                      Text(
                          text = title,
                          color = txtColor,
                          fontWeight = FontWeight.Bold,
                          fontSize = 13.5.sp
                      )
                      Spacer(Modifier.height(10.dp))
                      content()
                  }
              }
          }
          @Composable
          fun SettingsToggleRow(
              title: String,
              subtitle: String,
              checked: Boolean,
              txtColor: Color,
              subColor: Color,
              onCheckedChange: (Boolean) -> Unit
          ) {
              Row(
