          @Composable
          fun PinSetupDialog(
              isFa: Boolean,
              onDismiss: () -> Unit,
              onSavePin: (String) -> Unit
          ) {
              var pinInput by remember { mutableStateOf("") }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Text(if (isFa) "تعیین پین‌کد ۴ رقمی" else "Set 4-Digit PIN", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                  },
                  text = {
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                          Text(
                              if (isFa) "پین‌کد ۴ رقمی دلخواه خود را وارد کنید:" else "Enter your custom 4-digit PIN:",
                              fontSize = 12.sp,
                              textAlign = TextAlign.Center
                          )
                          Spacer(Modifier.height(12.dp))
                          Text(
                              text = pinInput.padEnd(4, '○'),
                              fontSize = 26.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color(0xFF2563EB)
                          )
                          Spacer(Modifier.height(12.dp))
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              val rows = listOf(listOf(1, 2, 3), listOf(4, 5, 6), listOf(7, 8, 9))
                              rows.forEach { r ->
                                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.padding(vertical = 4.dp)) {
                                      r.forEach { d ->
                                          OutlinedButton(
                                              onClick = { if (pinInput.length < 4) pinInput += d.toString() },
                                              modifier = Modifier.size(52.dp),
                                              shape = CircleShape,
                                              contentPadding = PaddingValues(0.dp)
                                          ) {
                                              Text(d.toString(), fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.padding(top = 4.dp)) {
                                  OutlinedButton(
                                      onClick = { if (pinInput.isNotEmpty()) pinInput = pinInput.dropLast(1) },
                                      modifier = Modifier.size(52.dp),
                                      shape = CircleShape,
                                      contentPadding = PaddingValues(0.dp)
                                  ) {
                                      Text("⌫", fontSize = 16.sp)
                                  }
                                  OutlinedButton(
                                      onClick = { if (pinInput.length < 4) pinInput += "0" },
                                      modifier = Modifier.size(52.dp),
                                      shape = CircleShape,
                                      contentPadding = PaddingValues(0.dp)
                                  ) {
                                      Text("0", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.size(52.dp))
                              }
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          enabled = pinInput.length == 4,
                          onClick = { onSavePin(pinInput) }
                      ) {
                          Text(if (isFa) "ذخیره" else "Save")
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text(if (isFa) "انصراف" else "Cancel")
                      }
                  }
              )
          }
          @Composable
          fun PatternSetupDialog(
              isFa: Boolean,
              onDismiss: () -> Unit,
              onSavePattern: (String) -> Unit
          ) {
              val selectedNodes = remember { mutableStateListOf<Int>() }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Text(if (isFa) "تعیین الگوی قفل (حداقل ۴ نقطه)" else "Set Pattern (Min 4 Dots)", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                  },
                  text = {
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                          Text(
                              if (isFa) "نقاط الگو را به ترتیب لمس کنید (${selectedNodes.size} نقطه):" else "Tap at least 4 dots in order (${selectedNodes.size} selected):",
                              fontSize = 12.sp,
                              textAlign = TextAlign.Center
                          )
                          Spacer(Modifier.height(12.dp))
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              val rows = listOf(listOf(1, 2, 3), listOf(4, 5, 6), listOf(7, 8, 9))
                              rows.forEach { r ->
                                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.padding(vertical = 5.dp)) {
                                      r.forEach { node ->
                                          val idx = selectedNodes.indexOf(node)
                                          val isSel = idx != -1
                                          Button(
                                              onClick = { if (!isSel) selectedNodes.add(node) },
                                              modifier = Modifier.size(54.dp),
                                              shape = CircleShape,
                                              colors = ButtonDefaults.buttonColors(
                                                  containerColor = if (isSel) Color(0xFF2563EB) else Color(0x222563EB)
                                              ),
                                              contentPadding = PaddingValues(0.dp)
                                          ) {
                                              Text(
                                                  if (isSel) "${idx + 1}" else "•",
                                                  color = if (isSel) Color.White else Color(0xFF2563EB),
                                                  fontSize = 18.sp,
                                                  fontWeight = FontWeight.Bold
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                          TextButton(onClick = { selectedNodes.clear() }) {
                              Text(if (isFa) "پاک کردن" else "Clear")
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          enabled = selectedNodes.size >= 4,
                          onClick = { onSavePattern(selectedNodes.joinToString("-")) }
                      ) {
                          Text(if (isFa) "ذخیره" else "Save")
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text(if (isFa) "انصراف" else "Cancel")
                      }
                  }
              )
          }
          ''')
          print("NowLock v6.5 project generated cleanly!")
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Accept Preinstalled Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compile Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk NowLock.apk
      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NowLock-APK
          path: NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v6.5-nowlock
          name: "NowLock App v6.5 (Self-Lock + Gallery Intruder Selfie + Relock Delay + Notch UI)"
          body: "فایل نصبی آماده NowLock v6.5 با قابلیت قفل خود برنامه، ذخیره واقعی عکس فضول‌گیر در گالری، تنظیم تاخیر قفل (فوری، ۲، ۴، ۶، ۱۰ دقیقه)، تطبیق با ناچ صفحه و بخش درباره برنامه با نام حامد."
          files: NowLock.apk

