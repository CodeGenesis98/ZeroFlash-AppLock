          import io, tarfile, zipfile
          for cand_pack in ["nowlock_hd_assets.zip", ".github/workflows/nowlock_hd_assets.zip", "nowlock_hd_assets.pack", ".github/workflows/nowlock_hd_assets.pack"]:
