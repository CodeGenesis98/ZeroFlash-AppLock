                                              val activeRem = AppRepo.getLockoutRemainingSeconds()
                                              if (activeRem > 0) {
                                                  selfCooldownSec = activeRem
                                                  selfStatusMsg = s.formatCooldown(activeRem)
                                              } else {
                                                  selfStatusMsg = s.lockWrongAttempt
