          // Continuous Touch-Drag Pattern Setup Dialog (Draw without lifting finger, identical to Lock Screen!)
          @Composable
          fun PatternSetupDialog(
              s: UiStrings,
              onDismiss: () -> Unit,
              onSavePattern: (String) -> Unit
          ) {
              val selectedNodes = remember { mutableStateListOf<Int>() }
              var currentTouchPos by remember { mutableStateOf<Offset?>(null) }
              var boxSize by remember { mutableStateOf(IntSize.Zero) }
              fun nodeCenter(index: Int): Offset {
                  val row = (index - 1) / 3
                  val col = (index - 1) % 3
                  val cellW = boxSize.width / 3f
                  val cellH = boxSize.height / 3f
                  return Offset(cellW * (col + 0.5f), cellH * (row + 0.5f))
              }
              fun checkHitNode(pos: Offset): Int? {
                  if (boxSize.width == 0) return null
                  val hitRadius = (boxSize.width / 6f) * 0.68f
                  for (i in 1..9) {
                      val c = nodeCenter(i)
                      if (hypot(pos.x - c.x, pos.y - c.y) <= hitRadius) {
                          return i
                      }
                  }
                  return null
              }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Text(s.dlgPatternTitle, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                  },
                  text = {
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                          Text(
                              "${s.dlgPatternSub} (${selectedNodes.size})",
                              fontSize = 12.sp,
                              textAlign = TextAlign.Center
                          )
                          Spacer(Modifier.height(14.dp))
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              Box(
                                  modifier = Modifier
                                      .size(230.dp)
                                      .onSizeChanged { boxSize = it }
                                      .pointerInput(Unit) {
                                          detectDragGestures(
                                              onDragStart = { offset ->
                                                  selectedNodes.clear()
                                                  checkHitNode(offset)?.let { node ->
                                                      if (!selectedNodes.contains(node)) selectedNodes.add(node)
                                                  }
                                                  currentTouchPos = offset
                                              },
                                              onDrag = { change, _ ->
                                                  change.consume()
                                                  currentTouchPos = change.position
                                                  checkHitNode(change.position)?.let { node ->
                                                      if (!selectedNodes.contains(node)) {
                                                          selectedNodes.add(node)
                                                      }
                                                  }
                                              },
                                              onDragEnd = {
                                                  currentTouchPos = null
                                                  if (selectedNodes.size < 4) {
                                                      selectedNodes.clear()
                                                  }
                                              },
                                              onDragCancel = {
                                                  currentTouchPos = null
                                              }
                                          )
                                      }
                              ) {
                                  val lineColor = Color(0xFF5D56F5)
                                  val dotColor = Color(0xFF64748B)
                                  ComposeCanvas(modifier = Modifier.fillMaxSize()) {
                                      for (i in 0 until selectedNodes.size - 1) {
                                          val start = nodeCenter(selectedNodes[i])
                                          val end = nodeCenter(selectedNodes[i + 1])
                                          drawLine(
                                              color = lineColor,
                                              start = start,
                                              end = end,
                                              strokeWidth = 4.5.dp.toPx(),
                                              cap = StrokeCap.Round
                                          )
                                      }
                                      if (selectedNodes.isNotEmpty() && currentTouchPos != null) {
                                          drawLine(
                                              color = lineColor.copy(alpha = 0.65f),
                                              start = nodeCenter(selectedNodes.last()),
                                              end = currentTouchPos!!,
                                              strokeWidth = 3.5.dp.toPx(),
                                              cap = StrokeCap.Round
                                          )
                                      }
                                      for (i in 1..9) {
                                          val center = nodeCenter(i)
                                          val isSelected = selectedNodes.contains(i)
                                          if (isSelected) {
                                              drawCircle(
                                                  color = lineColor.copy(alpha = 0.24f),
                                                  radius = 20.dp.toPx(),
                                                  center = center
                                              )
                                              drawCircle(
                                                  color = lineColor,
                                                  radius = 8.5.dp.toPx(),
                                                  center = center
                                              )
                                          } else {
                                              drawCircle(
                                                  color = dotColor.copy(alpha = 0.55f),
                                                  radius = 6.dp.toPx(),
                                                  center = center
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                          TextButton(onClick = { selectedNodes.clear(); currentTouchPos = null }) {
                              Text(s.btnClear)
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          enabled = selectedNodes.size >= 4,
                          onClick = { onSavePattern(selectedNodes.joinToString("-")) }
                      ) {
                          Text(s.btnSave)
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text(s.btnCancel)
                      }
                  }
              )
          }
          ''')
          print("NowLock v7.5 project generated cleanly!")
      - name: Compile Signed APK with Preinstalled JDK 17 & Gradle
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if ! command -v gradle &> /dev/null; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH="/tmp/gradle-8.7/bin:$PATH"
          fi
          gradle assembleDebug --no-daemon --no-build-cache
          cp app/build/outputs/apk/debug/app-debug.apk NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v7.5-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          gh release create v7.5-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "NowLock App v7.5 (Full 3rd-Party App Locking + Direct Permissions + Drag Pattern Setup + 5 Full Languages)" --notes "فایل نصبی آماده NowLock v7.5 با رفع کامل قفل تمام برنامه‌های گوشی (OverlayLockBridge)، رفع کرش دکمه دوربین (fragment-ktx:1.8.1)، هدایت مستقیم به صفحه مجوزها، رسم پیوسته الگو در تنظیمات، اعلان نصب برنامه جدید، سلفی فضول‌گیر در صورت خطای اثر انگشت، و ترجمه ۱۰۰٪ تمام بخش‌ها به ۵ زبان."

