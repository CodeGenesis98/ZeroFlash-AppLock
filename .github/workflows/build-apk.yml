                                          s = s,
                                          isDecoySetup = true,
                                          onDismiss = { showDecoyPatternDialog = false },
                                          onSavePattern = { decoyPat ->
                                              AppRepo.setDecoyPattern(decoyPat)
                                              decoyEnabled = true
                                              showDecoyPatternDialog = false
                                              Toast.makeText(this@MainActivity, "✓ ${s.btnSetDecoyPattern}", Toast.LENGTH_SHORT).show()
                                          }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
              private fun loadRealLauncherApps(): List<RealAppItem> {
                  val pm = packageManager
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  val resolveInfos = pm.queryIntentActivities(mainIntent, 0)
                  val blockedKeywords = listOf(
                      "plugin", "effect", "filter", "sticker", "wallpaper",
                      "auto_generated_rro", "overlay", "provider", "com.android.cts"
                  )
                  val lockedSet = AppRepo.getLockedPackages()
                  val items = resolveInfos
                      .mapNotNull { ri ->
                          val pkg = ri.activityInfo?.packageName ?: return@mapNotNull null
                          if (blockedKeywords.any { pkg.lowercase().contains(it) }) return@mapNotNull null
                          val isSelf = (pkg == packageName)
                          val label = if (isSelf) "NowLock" else (ri.loadLabel(pm)?.toString() ?: pkg)
                          val targetPx = if (AppRepo.isLowEndHardware) 84 else 120
                          val iconDrawable = ri.loadIcon(pm) ?: pm.defaultActivityIcon
                          val imgBmp = drawableToHdImageBitmap(iconDrawable, targetPx)
                          RealAppItem(
                              label = label,
                              packageName = pkg,
                              iconImage = imgBmp,
                              isLocked = lockedSet.contains(pkg),
                              isSelfApp = isSelf
                          )
                      }
                      .distinctBy { it.packageName }
                      .toMutableList()
                  if (items.none { it.packageName == packageName }) {
                      runCatching {
                          val targetPx = if (AppRepo.isLowEndHardware) 84 else 120
                          val ai = pm.getApplicationInfo(packageName, 0)
                          val imgBmp = drawableToHdImageBitmap(pm.getApplicationIcon(ai), targetPx)
                          items.add(
                              0,
                              RealAppItem(
                                  label = "NowLock",
                                  packageName = packageName,
                                  iconImage = imgBmp,
                                  isLocked = lockedSet.contains(packageName),
                                  isSelfApp = true
                              )
                          )
                      }
                  }
                  return items.sortedWith(
                      compareByDescending<RealAppItem> { it.isSelfApp }
                          .thenByDescending { it.isLocked }
                          .thenBy { it.label.lowercase() }
                  )
              }
          }
