                                                          }
                                                      }
                                                      val filteredApps = appList.filter { app ->
                                                          val matchesFilter = when (filterMode) {
                                                              AppFilterMode.ALL -> true
                                                              AppFilterMode.LOCKED -> app.isLocked
                                                              AppFilterMode.UNLOCKED -> !app.isLocked
                                                          }
                                                          val matchesQuery = searchQuery.isBlank() ||
                                                              app.label.contains(searchQuery, ignoreCase = true) ||
                                                              app.packageName.contains(searchQuery, ignoreCase = true)
                                                          matchesFilter && matchesQuery
                                                      }
                                                      LazyColumn(
                                                          verticalArrangement = Arrangement.spacedBy(8.dp),
                                                          contentPadding = PaddingValues(bottom = navBarBottomInset + 28.dp)
                                                      ) {
                                                          items(items = filteredApps, key = { it.packageName }, contentType = { "app_row" }) { app ->
                                                              val isExpanded = expandedPerAppPkg == app.packageName
                                                              var perAppCfg by remember(app.packageName, isExpanded) {
                                                                  mutableStateOf(AppRepo.getPerAppConfig(app.packageName))
                                                              }
                                                              Surface(
                                                                  shape = RoundedCornerShape(18.dp),
                                                                  color = card,
                                                                  border = BorderStroke(
                                                                      width = if (app.isSelfApp) 1.5.dp else 1.dp,
                                                                      color = if (app.isSelfApp) blue.copy(alpha = 0.45f) else border
                                                                  ),
                                                                  modifier = Modifier.fillMaxWidth()
                                                              ) {
                                                                  Column(modifier = Modifier.fillMaxWidth()) {
                                                                      Row(
                                                                          modifier = Modifier
                                                                              .fillMaxWidth()
                                                                              .padding(horizontal = 14.dp, vertical = 11.dp),
                                                                          horizontalArrangement = Arrangement.SpaceBetween,
                                                                          verticalAlignment = Alignment.CenterVertically
                                                                      ) {
                                                                          Row(
                                                                              verticalAlignment = Alignment.CenterVertically,
                                                                              modifier = Modifier.weight(1f)
                                                                          ) {
                                                                              Image(
                                                                                  bitmap = app.iconImage,
                                                                                  contentDescription = app.label,
                                                                                  modifier = Modifier
                                                                                      .size(44.dp)
                                                                                      .clip(RoundedCornerShape(11.dp))
                                                                              )
                                                                              Spacer(Modifier.width(12.dp))
                                                                              Column {
                                                                                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                                                                      Text(app.label, color = txt, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                                                                                      if (app.isSelfApp) {
                                                                                          Surface(
                                                                                              shape = RoundedCornerShape(6.dp),
                                                                                              color = blue.copy(alpha = 0.15f)
                                                                                          ) {
                                                                                              Text(
                                                                                                  s.selfAppBadge,
                                                                                                  color = blue,
                                                                                                  fontSize = 10.sp,
                                                                                                  fontWeight = FontWeight.Bold,
                                                                                                  modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp)
                                                                                              )
                                                                                          }
                                                                                      }
                                                                                  }
                                                                                  Text(app.packageName, color = sub, fontSize = 11.sp)
                                                                              }
                                                                          }
                                                                          Row(
                                                                              verticalAlignment = Alignment.CenterVertically,
                                                                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                                                                          ) {
                                                                              // Expandable Per-App Settings Arrow Button right next to the Lock Switch!
                                                                              Surface(
                                                                                  shape = RoundedCornerShape(8.dp),
                                                                                  color = if (isExpanded || perAppCfg.useCustom) blue.copy(alpha = 0.16f) else Color.Transparent,
                                                                                  border = BorderStroke(1.dp, if (perAppCfg.useCustom) blue else border),
                                                                                  modifier = Modifier
                                                                                      .size(32.dp)
                                                                                      .clickable {
                                                                                          expandedPerAppPkg = if (isExpanded) null else app.packageName
                                                                                      }
                                                                              ) {
                                                                                  Box(contentAlignment = Alignment.Center) {
                                                                                      Text(
                                                                                          text = if (isExpanded) "▲" else "▼",
                                                                                          color = if (perAppCfg.useCustom) blue else sub,
                                                                                          fontSize = 11.sp,
                                                                                          fontWeight = FontWeight.Bold
                                                                                      )
                                                                                  }
                                                                              }
                                                                              Switch(
                                                                                  checked = app.isLocked,
                                                                                  onCheckedChange = { lock ->
                                                                                      if (!AppRepo.isAnyPasswordSet() && lock) {
                                                                                          pendingLockPkg = app.packageName
                                                                                          if (comboMode == LockComboMode.PATTERN_FINGERPRINT) {
                                                                                              showPatternDialog = true
                                                                                          } else {
                                                                                              showPinDialog = true
                                                                                          }
                                                                                      } else {
                                                                                          AppRepo.toggleAppLock(app.packageName, lock)
                                                                                          if (app.isSelfApp && lock) {
                                                                                              AppRepo.markUnlocked(packageName)
                                                                                          }
                                                                                          appList = appList.map {
                                                                                              if (it.packageName == app.packageName) it.copy(isLocked = lock) else it
                                                                                          }
                                                                                          NowLockMonitorService.startServiceSafely(this@MainActivity)
                                                                                      }
                                                                                  }
                                                                              )
                                                                          }
                                                                      }
                                                                      // Expandable Per-App Settings Drawer (Default: Follow Global Settings, or Custom Override for every setting!)
                                                                      AnimatedVisibility(visible = isExpanded) {
                                                                          Column(
