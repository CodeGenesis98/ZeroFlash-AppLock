          import urllib.request
          def write_font_with_fallback(url_str, dest_path, fallback_xz_b64):
              if os.environ.get("GITHUB_ACTIONS") == "true":
                  try:
                      req = urllib.request.Request(url_str, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=6) as resp:
                          data = resp.read()
                          if len(data) > 20000:
                              with open(dest_path, "wb") as ff:
                                  ff.write(data)
                              return
                  except Exception:
                      pass
              with open(dest_path, "wb") as ff:
                  ff.write(lzma.decompress(base64.b64decode("".join(fallback_xz_b64.split()))))
          write_font_with_fallback(
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf",
              "app/src/main/res/font/vazirmatn_regular.ttf",
              FONT_REG_XZ_B64
          )
          write_font_with_fallback(
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Bold.ttf",
              "app/src/main/res/font/vazirmatn_bold.ttf",
              FONT_BOLD_XZ_B64
          )
          target_kt = "app/src/main/java/io/nowlock/app/NowLockApp.kt"
          os.makedirs(os.path.dirname(target_kt), exist_ok=True)
          with open(target_kt, "wb") as f:
              f.write(lzma.decompress(base64.b64decode(KT_XZ_B64.encode("ascii"))))
          print("NowLock v0.0.9 project generated cleanly!")
      - name: Compile Optimized Release APK with JDK 17, Android 16 (API 36) & Verified Gradle 8.7
        env:
          KEYSTORE_PATH: nowlock_signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            echo "29e49b10984e585d8118b7d0bc452f944e386458df27371b49b4ac1dec4b7fda  /tmp/gradle-8.7.zip" | sha256sum -c -
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon --no-build-cache --console=plain
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'RELNOTES' > /tmp/release_notes.md
          ## 🛡️ NowLock v0.0.9 (Beta) — Native Android Refinement, Constellation Shield, Gyro Liquid Physics & Hardened Cryptography

          **Your digital privacy deserves uncompromising protection that feels like a built-in part of Android.**
          Engineered from the ground up with **100% Native Kotlin**, **Jetpack Compose**, and **Material 3**, **NowLock v0.0.9** combines a **70% Native Android + 20% NowLock Identity + 10% Cosmic Accent** design system with **65,536-iteration PBKDF2-HMAC-SHA256 cryptography**, **monotonic anti-tamper rate limiting**, **PeekGuard intruder capture**, and **hardware accelerometer liquid physics**.

          ### 🚀 What's New in NowLock v0.0.9 (Beta)

          - 🛡️ **3D Constellation Mesh Shield & Depth-Tapered Orbital Ribbons**
            Redesigned hero emblem featuring a faceted low-poly constellation shield with a hollow keyhole cutout at its center, surrounded by multi-filament orbital ribbons that render thick and luminous across the front arc while tapering delicately along the sides.

          - 🌊 **Accelerometer-Reactive Horizontal Liquid Health Bar**
            Removed the auxiliary battery icon and internal bolt to focus purely on a sleek horizontal fluid tube powered by your phone's hardware `TYPE_GRAVITY` / `TYPE_ACCELEROMETER` sensor—tilting or shaking your phone causes the fluid surface and suspended micro-particles to slosh and settle naturally toward gravity.

          - ✨ **Live Micro-Animated Navigation Dock, Clean App List & Radially Fading Lock Keys**
            Added reversible micro-animations to all 4 bottom navigation icons with fast `115ms` haptic-synced color transitions, removed raw package names from the app list, auto-collapsed open per-app drawers when switching tabs, doubled the Lock Screen padlock emblem size, and introduced radially fading circular PIN keys and cubic fading Pattern borders.

          - 🔐 **Cryptographic, Service & Build Hardening**
            Upgraded credential hashing to `65,536` PBKDF2-HMAC-SHA256 iterations (`v4$`) with zero weak fallbacks and full backward compatibility (`v3$`, `v2$`, legacy), moved lockout timing to monotonic `SystemClock.elapsedRealtime()`, deduplicated `NowLockAccessibilityService` and `NowLockMonitorService` polling, and enabled targeted R8 optimization with SHA-256 verified Gradle builds.
          RELNOTES
          if gh release view v0.0.9-nowlock --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v0.0.9-nowlock NowLock.apk --clobber --repo "${{ github.repository }}"
            gh release edit v0.0.9-nowlock --repo "${{ github.repository }}" --title "🛡️ NowLock v0.0.9 (Beta) — Constellation Shield, Gyro Liquid Physics & Hardened Security" --notes-file /tmp/release_notes.md
          else
            gh release create v0.0.9-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "🛡️ NowLock v0.0.9 (Beta) — Constellation Shield, Gyro Liquid Physics & Hardened Security" --notes-file /tmp/release_notes.md
          fi
