          // Adaptive Screen Metrics for Compact Phones, Foldables (Z Fold / Flip), Landscape, and Tablets
          data class AdaptiveScreenMetrics(
              val widthDp: Int,
              val heightDp: Int,
              val isCompactHeight: Boolean,
              val isUltraShortHeight: Boolean,
              val isTabletOrUnfolded: Boolean,
              val useTwoPaneLockLayout: Boolean,
              val useTwoColumnAppGrid: Boolean,
              val dialKeySizeDp: Int,
              val patternGridSizeDp: Int,
              val contentMaxWidthDp: Int
          )
          @Composable
          fun rememberAdaptiveScreenMetrics(): AdaptiveScreenMetrics {
              val cfg = LocalConfiguration.current
              val w = cfg.screenWidthDp
              val h = cfg.screenHeightDp
              val isUltraShort = h < 580
              val isCompact = h < 700
              val isTabOrFold = w >= 600
              // Use 2-pane side-by-side lock screen when in landscape or on wide foldable inner screens with short vertical height
              val twoPaneLock = (w >= 580 && w > h) || (w >= 600 && h < 680)
              val twoColApps = w >= 640
              val dialKey = when {
                  twoPaneLock -> (h / 6).coerceIn(50, 72)
                  h < 580 -> 56
                  h < 660 -> 66
                  h < 740 -> 74
                  w >= 600 && h >= 820 -> 88
                  else -> 82
              }
              val patGrid = when {
                  twoPaneLock -> (h - 90).coerceIn(170, 250)
                  h < 580 -> 190
                  h < 660 -> 220
                  h < 740 -> 246
                  w >= 600 && h >= 820 -> 300
                  else -> 276
              }
              val maxContentW = if (w >= 840) 800 else if (w >= 600) 680 else 10000
              return AdaptiveScreenMetrics(
                  widthDp = w,
                  heightDp = h,
                  isCompactHeight = isCompact,
                  isUltraShortHeight = isUltraShort,
                  isTabletOrUnfolded = isTabOrFold,
                  useTwoPaneLockLayout = twoPaneLock,
                  useTwoColumnAppGrid = twoColApps,
                  dialKeySizeDp = dialKey,
                  patternGridSizeDp = patGrid,
                  contentMaxWidthDp = maxContentW
              )
          }
          fun configureNotchAndGlassBars(activity: Activity, isDark: Boolean) {
              runCatching {
                  val window = activity.window
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes = window.attributes.apply {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  window.statusBarColor = android.graphics.Color.TRANSPARENT
                  window.navigationBarColor = android.graphics.Color.TRANSPARENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.isNavigationBarContrastEnforced = false
                  }
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.isAppearanceLightStatusBars = !isDark
                  controller.isAppearanceLightNavigationBars = !isDark
              }
          }
          // Happ VPN Inspired Seamless Multi-Stop Ambient Background
          // Helper to prompt adding NowLock Quick Settings Tile to the phone's Control Center (Android 13+ native prompt, with fallback toast)
          fun requestAddControlCenterTile(context: Context, fallbackToastMsg: String) {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  val sbm = context.getSystemService(StatusBarManager::class.java)
                  if (sbm != null) {
                      val comp = ComponentName(context, NowLockControlCenterTileService::class.java)
                      val icon = Icon.createWithResource(context, R.drawable.ic_qs_lock_tile)
                      runCatching {
                          sbm.requestAddTileService(
                              comp,
                              "NowLock",
                              icon,
                              ContextCompat.getMainExecutor(context)
                          ) { resultCode ->
                              when (resultCode) {
                                  StatusBarManager.TILE_ADD_REQUEST_RESULT_TILE_ADDED -> {
                                      Toast.makeText(context, "✓ NowLock (Lock)", Toast.LENGTH_SHORT).show()
                                  }
                                  StatusBarManager.TILE_ADD_REQUEST_RESULT_TILE_ALREADY_ADDED -> {
                                      Toast.makeText(context, fallbackToastMsg, Toast.LENGTH_LONG).show()
                                  }
                                  else -> {
                                      Toast.makeText(context, fallbackToastMsg, Toast.LENGTH_LONG).show()
                                  }
                              }
                          }
                          return
                      }
                  }
              }
              Toast.makeText(context, fallbackToastMsg, Toast.LENGTH_LONG).show()
          }
          // Xiaomi MIUI/HyperOS App Lock Inspired Frosted Matte Glass with Slow, Soft Dynamic App-Color Clouds
          // Completely hides the underlying app's sensitive content while reflecting its blurred ambient color palette!
          @Composable
          fun FrostedAppColorGlassBackground(
              targetPkg: String,
              isDark: Boolean,
              modifier: Modifier = Modifier,
              content: @Composable BoxScope.() -> Unit
          ) {
              val context = LocalContext.current
              // Extract the locked app's color palette and randomly shuffle/pair its colors + phase seed on each open
              val basePalette = remember(targetPkg) {
                  AppRepo.getOrExtractAppColorPalette(context, targetPkg).shuffled()
              }
              val randomSeedOffset = remember(targetPkg) { Random.nextFloat() * 6.28f }
              // Light Theme: uses the locked app's bright, vivid colors directly.
              // Dark Theme: takes that exact same color combination from the locked app and darkens it!
              val c1 = if (isDark) lerp(basePalette[0], Color(0xFF070A12), 0.45f) else basePalette[0]
              val c2 = if (isDark) lerp(basePalette[1 % basePalette.size], Color(0xFF070A12), 0.45f) else basePalette[1 % basePalette.size]
              val c3 = if (isDark) lerp(basePalette[2 % basePalette.size], Color(0xFF070A12), 0.45f) else basePalette[2 % basePalette.size]
              val c4 = if (isDark) lerp(basePalette[3 % basePalette.size], Color(0xFF070A12), 0.45f) else basePalette[3 % basePalette.size]
              val isLowEnd = AppRepo.isLowEndHardware
              val phase = if (isLowEnd) {
                  randomSeedOffset
              } else {
                  val infiniteTransition = rememberInfiniteTransition(label = "xiaomiFrostedFlow")
                  val animPhase by infiniteTransition.animateFloat(
                      initialValue = 0f,
                      targetValue = 6.2831855f,
                      animationSpec = infiniteRepeatable(
                          animation = tween(durationMillis = 8800, easing = LinearEasing),
                          repeatMode = RepeatMode.Restart
                      ),
                      label = "frostedPhase"
                  )
                  animPhase + randomSeedOffset
              }
              val isAmoled = AppRepo.isAmoledEffective()
              val baseBg = when {
                  isAmoled -> Color(0xFF000000)
                  isDark -> lerp(Color(0xFF070A12), c1, 0.34f)
                  else -> lerp(Color(0xFF1A2433), c1, 0.62f)
              }
              Box(
                  modifier = modifier
                      .fillMaxSize()
                      .background(baseBg)
              ) {
                  if (!isAmoled) {
                      ComposeCanvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width
                      val h = size.height
                      val maxDim = maxOf(w, h).coerceAtLeast(1f)
                      val orbAlphaCore = if (isDark) 0.78f else 0.88f
                      val orbAlphaMid = if (isDark) 0.36f else 0.46f
                      // Orb 1: Wide sweeping upper-left to center-right path
                      val c1Center = Offset(
                          x = w * (0.28f + 0.32f * cos(phase)),
                          y = h * (0.24f + 0.22f * sin(phase))
                      )
                      drawCircle(
                          brush = Brush.radialGradient(
                              colors = listOf(
                                  c1.copy(alpha = orbAlphaCore),
                                  c1.copy(alpha = orbAlphaMid),
                                  Color.Transparent
                              ),
                              center = c1Center,
                              radius = maxDim * 0.52f
                          ),
                          radius = maxDim * 0.52f,
                          center = c1Center
                      )
                      // Orb 2: Counter-rotating lower-right to center-left path
                      val c2Center = Offset(
                          x = w * (0.72f + 0.30f * sin(phase + 1.57f)),
                          y = h * (0.70f + 0.24f * cos(phase + 1.57f))
                      )
                      drawCircle(
                          brush = Brush.radialGradient(
                              colors = listOf(
                                  c2.copy(alpha = orbAlphaCore),
                                  c2.copy(alpha = orbAlphaMid),
                                  Color.Transparent
                              ),
                              center = c2Center,
                              radius = maxDim * 0.54f
                          ),
                          radius = maxDim * 0.54f,
                          center = c2Center
                      )
                      // Orb 3: Diagonal figure-8 ambient wave
                      val c3Center = Offset(
                          x = w * (0.50f + 0.34f * sin(phase + 3.14f)),
                          y = h * (0.46f + 0.26f * sin(phase * 2f))
                      )
                      drawCircle(
                          brush = Brush.radialGradient(
                              colors = listOf(
                                  c3.copy(alpha = orbAlphaCore * 0.92f),
                                  c3.copy(alpha = orbAlphaMid * 0.85f),
                                  Color.Transparent
                              ),
                              center = c3Center,
                              radius = maxDim * 0.48f
                          ),
                          radius = maxDim * 0.48f,
                          center = c3Center
                      )
                      // Orb 4: Soft accent highlight orb
                      val c4Center = Offset(
                          x = w * (0.36f + 0.28f * cos(phase + 4.4f)),
                          y = h * (0.78f + 0.20f * sin(phase + 4.4f))
                      )
                      drawCircle(
                          brush = Brush.radialGradient(
                              colors = listOf(
                                  c4.copy(alpha = orbAlphaCore * 0.85f),
                                  c4.copy(alpha = orbAlphaMid * 0.75f),
                                  Color.Transparent
                              ),
                              center = c4Center,
                              radius = maxDim * 0.46f
                          ),
                          radius = maxDim * 0.46f,
                          center = c4Center
                      )
                      // Uniform Matte Frosted Glass Veil (No top or bottom white fade border!)
                      drawRect(
                          color = if (isDark) Color(0x24050811) else Color(0x18101824)
                      )
                      }
                  }
                  content()
              }
          }
