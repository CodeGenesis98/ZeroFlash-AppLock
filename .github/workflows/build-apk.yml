name: Build ZeroFlash AppLock APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Sync Companion HD Asset Pack from Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d .git ] && [ -n "${GITHUB_REPOSITORY:-}" ]; then
            git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch -q --depth=1 origin "${GITHUB_SHA}" && git checkout -q -f FETCH_HEAD || true
          fi

