                          secondaryColor = secondaryTextColor,
                          onClick = { onDigitClick(0) }
                      )
                      if (showFingerprintKey) {
                          TelegramFingerprintButton(
                              sizeDp = keySizeDp - 4,
                              isActivePulse = isFingerprintPulsing,
                              tintColor = primaryTextColor,
                              accentColor = accentColor,
                              onClick = onFingerprintClick
                          )
                      } else {
                          Spacer(modifier = Modifier.size((keySizeDp - 4).dp))
                      }
                  }
              }
          }
