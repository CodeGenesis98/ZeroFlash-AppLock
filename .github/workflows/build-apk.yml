          @Composable
          fun InteractivePatternLockView(
              gridSizeDp: Int = 276,
              dotColor: Color,
              lineColor: Color,
              errorColor: Color,
              onPatternCompleted: (String, () -> Unit) -> Unit
          ) {
              val selectedDots = remember { mutableStateListOf<Int>() }
              var currentTouchPos by remember { mutableStateOf<Offset?>(null) }
              var isError by remember { mutableStateOf(false) }
              var boxSize by remember { mutableStateOf(IntSize.Zero) }
              fun nodeCenter(index: Int): Offset {
                  val row = (index - 1) / 3
                  val col = (index - 1) % 3
                  val cellW = boxSize.width / 3f
                  val cellH = boxSize.height / 3f
                  return Offset(cellW * (col + 0.5f), cellH * (row + 0.5f))
              }
              fun checkHitNode(pos: Offset): Int? {
                  if (boxSize.width == 0) return null
                  val hitRadius = (boxSize.width / 6f) * 0.68f
                  for (i in 1..9) {
                      val c = nodeCenter(i)
                      if (hypot(pos.x - c.x, pos.y - c.y) <= hitRadius) {
                          return i
                      }
                  }
                  return null
              }
              fun finishPatternAttempt() {
                  if (selectedDots.size >= 4) {
                      val patternStr = selectedDots.joinToString("-")
                      onPatternCompleted(patternStr) {
                          selectedDots.clear()
                          currentTouchPos = null
                          isError = false
                      }
                      isError = true
                  } else if (selectedDots.isNotEmpty()) {
                      selectedDots.clear()
                      currentTouchPos = null
                  }
              }
              Box(
                  modifier = Modifier
                      .size(gridSizeDp.dp)
                      .onSizeChanged { boxSize = it }
                      .pointerInput(Unit) {
                          detectDragGestures(
                              onDragStart = { offset ->
                                  if (isError) {
                                      selectedDots.clear()
                                      isError = false
                                  }
                                  checkHitNode(offset)?.let { node ->
                                      if (!selectedDots.contains(node)) selectedDots.add(node)
                                  }
                                  currentTouchPos = offset
                              },
                              onDrag = { change, _ ->
                                  change.consume()
                                  currentTouchPos = change.position
                                  checkHitNode(change.position)?.let { node ->
                                      if (!selectedDots.contains(node)) {
                                          selectedDots.add(node)
                                      }
                                  }
                              },
                              onDragEnd = {
                                  currentTouchPos = null
                                  finishPatternAttempt()
                              },
                              onDragCancel = {
                                  currentTouchPos = null
                                  selectedDots.clear()
                              }
                          )
                      }
                      .pointerInput(Unit) {
                          detectTapGestures { offset ->
                              if (isError) {
                                  selectedDots.clear()
                                  isError = false
                              }
                              checkHitNode(offset)?.let { node ->
                                  if (!selectedDots.contains(node)) {
                                      selectedDots.add(node)
                                      if (selectedDots.size >= 4) {
                                          finishPatternAttempt()
                                      }
                                  }
                              }
                          }
                      }
              ) {
                  ComposeCanvas(modifier = Modifier.fillMaxSize()) {
                      val activeLineColor = if (isError) errorColor else lineColor
                      for (i in 0 until selectedDots.size - 1) {
                          val start = nodeCenter(selectedDots[i])
                          val end = nodeCenter(selectedDots[i + 1])
                          drawLine(
                              color = activeLineColor,
                              start = start,
                              end = end,
                              strokeWidth = 4.5.dp.toPx(),
                              cap = StrokeCap.Round
                          )
                      }
                      if (selectedDots.isNotEmpty() && currentTouchPos != null && !isError) {
                          drawLine(
                              color = activeLineColor.copy(alpha = 0.65f),
                              start = nodeCenter(selectedDots.last()),
                              end = currentTouchPos!!,
                              strokeWidth = 3.5.dp.toPx(),
                              cap = StrokeCap.Round
                          )
                      }
                      for (i in 1..9) {
                          val center = nodeCenter(i)
                          val isSelected = selectedDots.contains(i)
                          if (isSelected) {
                              drawCircle(
                                  color = activeLineColor.copy(alpha = 0.24f),
                                  radius = 22.dp.toPx(),
                                  center = center
                              )
                              drawCircle(
                                  color = activeLineColor,
                                  radius = 9.dp.toPx(),
                                  center = center
                              )
                          } else {
                              drawCircle(
                                  color = dotColor.copy(alpha = 0.55f),
                                  radius = 6.5.dp.toPx(),
                                  center = center
                              )
                          }
                      }
                  }
              }
          }
          data class RealAppItem(
              val label: String,
              val packageName: String,
              val iconImage: ImageBitmap,
              val isLocked: Boolean,
              val isSelfApp: Boolean = false
          )
          fun drawableToHdImageBitmap(drawable: Drawable, targetPx: Int): ImageBitmap {
              val bitmap = Bitmap.createBitmap(targetPx, targetPx, Bitmap.Config.ARGB_8888)
              val canvas = Canvas(bitmap)
              drawable.setFilterBitmap(true)
              drawable.setBounds(0, 0, targetPx, targetPx)
              drawable.draw(canvas)
              return bitmap.asImageBitmap()
          }
          // Animated Top Security Status Emblem for Smart Security Report Tab:
          // - Critical Red Danger State (#EF4444) when permissions or lock service are disabled (or initially not granted)
          // - Warning Yellow Exclamation State (#F59E0B) when failed password attempts or password warnings exist
          // - Smooth natural color & geometry morphing between states!
          @Composable
          fun AnimatedSecurityReportEmblem(
              isDangerRed: Boolean,
              isWarningYellow: Boolean,
              titleText: String,
              subtitleText: String,
              cardColor: Color,
              borderColor: Color,
              txtColor: Color,
              subColor: Color
          ) {
              val targetAccent = when {
                  isDangerRed -> Color(0xFFEF4444)
                  isWarningYellow -> Color(0xFFF59E0B)
                  else -> Color(0xFF10B981)
              }
              val animatedColor by animateColorAsState(
                  targetValue = targetAccent,
                  animationSpec = tween(durationMillis = 700, easing = FastOutSlowInEasing),
                  label = "emblemColorMorph"
              )
              // 1f = Red Danger Triangle, 0f = Yellow Warning Circle / Shield
              val shapeMorph by animateFloatAsState(
                  targetValue = if (isDangerRed) 1f else 0f,
                  animationSpec = tween(durationMillis = 700, easing = FastOutSlowInEasing),
                  label = "emblemShapeMorph"
              )
              val infiniteTransition = rememberInfiniteTransition(label = "securityEmblemPulse")
              val pulseProgress by infiniteTransition.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(durationMillis = 1900, easing = FastOutSlowInEasing),
                      repeatMode = RepeatMode.Restart
                  ),
                  label = "pulseWave"
              )
              val emblemScale by infiniteTransition.animateFloat(
                  initialValue = 0.94f,
                  targetValue = 1.06f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(durationMillis = 1100, easing = FastOutSlowInEasing),
                      repeatMode = RepeatMode.Reverse
                  ),
                  label = "emblemBreath"
              )
              Surface(
                  shape = RoundedCornerShape(22.dp),
                  color = cardColor,
                  border = BorderStroke(1.5.dp, animatedColor.copy(alpha = 0.55f)),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 18.dp, vertical = 18.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Box(
                          contentAlignment = Alignment.Center,
                          modifier = Modifier.size(96.dp)
                      ) {
                          ComposeCanvas(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .scale(emblemScale)
                          ) {
                              val cx = size.width / 2f
                              val cy = size.height / 2f
                              val baseR = size.minDimension * 0.32f
                              if (shapeMorph > 0.45f) {
                                  // Expanding Triangular Pulse Waves matching the Red Danger Triangle geometry!
                                  val waveScale1 = 1f + pulseProgress * 0.62f
                                  val rW1 = baseR * waveScale1
                                  val waveTriPath1 = Path().apply {
                                      moveTo(cx, cy - rW1 * 0.95f)
                                      lineTo(cx + rW1 * 0.92f, cy + rW1 * 0.78f)
                                      lineTo(cx - rW1 * 0.92f, cy + rW1 * 0.78f)
                                      close()
                                  }
                                  drawPath(
                                      path = waveTriPath1,
                                      color = animatedColor.copy(alpha = (1f - pulseProgress) * 0.42f),
                                      style = androidx.compose.ui.graphics.drawscope.Stroke(
                                          width = 2.8.dp.toPx(),
                                          cap = StrokeCap.Round
                                      )
                                  )
                                  val rW2 = baseR * 1.22f
                                  val waveTriPath2 = Path().apply {
                                      moveTo(cx, cy - rW2 * 0.95f)
                                      lineTo(cx + rW2 * 0.92f, cy + rW2 * 0.78f)
                                      lineTo(cx - rW2 * 0.92f, cy + rW2 * 0.78f)
                                      close()
                                  }
                                  drawPath(
                                      path = waveTriPath2,
                                      color = animatedColor.copy(alpha = 0.16f)
                                  )
                              } else {
                                  // Expanding Circular Pulse Waves for Yellow Warning / Emerald Safe Circle!
                                  drawCircle(
                                      color = animatedColor.copy(alpha = (1f - pulseProgress) * 0.34f),
                                      radius = baseR * (1f + pulseProgress * 0.65f),
                                      center = Offset(cx, cy)
                                  )
                                  drawCircle(
                                      color = animatedColor.copy(alpha = 0.18f),
                                      radius = baseR * 1.18f,
                                      center = Offset(cx, cy)
                                  )
                              }
                              if (shapeMorph > 0.45f) {
                                  // Dynamic Red Danger Hazard Triangle with rounded stroke + inner fill
                                  val triPath = Path().apply {
                                      moveTo(cx, cy - baseR * 0.95f)
                                      lineTo(cx + baseR * 0.92f, cy + baseR * 0.78f)
                                      lineTo(cx - baseR * 0.92f, cy + baseR * 0.78f)
                                      close()
                                  }
                                  drawPath(
                                      path = triPath,
                                      color = animatedColor.copy(alpha = 0.25f)
                                  )
                                  drawPath(
                                      path = triPath,
                                      color = animatedColor,
                                      style = androidx.compose.ui.graphics.drawscope.Stroke(
                                          width = 3.5.dp.toPx(),
                                          cap = StrokeCap.Round
                                      )
                                  )
                              } else {
                                  // Dynamic Yellow Warning Exclamation Circle / Safe Badge
                                  drawCircle(
                                      color = animatedColor.copy(alpha = 0.25f),
                                      radius = baseR * 0.92f,
                                      center = Offset(cx, cy)
                                  )
                                  drawCircle(
                                      color = animatedColor,
                                      radius = baseR * 0.92f,
                                      center = Offset(cx, cy),
                                      style = androidx.compose.ui.graphics.drawscope.Stroke(width = 3.5.dp.toPx())
                                  )
                              }
                              // Central Exclamation Mark (!) for both Danger (Red) and Warning (Yellow), or Checkmark when Safe
                              if (isDangerRed || isWarningYellow) {
                                  drawLine(
                                      color = animatedColor,
                                      start = Offset(cx, cy - baseR * 0.36f),
                                      end = Offset(cx, cy + baseR * 0.16f),
                                      strokeWidth = 4.2.dp.toPx(),
                                      cap = StrokeCap.Round
                                  )
                                  drawCircle(
                                      color = animatedColor,
                                      radius = 2.6.dp.toPx(),
                                      center = Offset(cx, cy + baseR * 0.44f)
                                  )
                              } else {
                                  drawLine(
                                      color = animatedColor,
                                      start = Offset(cx - baseR * 0.32f, cy + baseR * 0.04f),
                                      end = Offset(cx - baseR * 0.06f, cy + baseR * 0.30f),
                                      strokeWidth = 3.8.dp.toPx(),
                                      cap = StrokeCap.Round
                                  )
                                  drawLine(
                                      color = animatedColor,
                                      start = Offset(cx - baseR * 0.06f, cy + baseR * 0.30f),
                                      end = Offset(cx + baseR * 0.38f, cy - baseR * 0.24f),
                                      strokeWidth = 3.8.dp.toPx(),
                                      cap = StrokeCap.Round
                                  )
                              }
                          }
                      }
                      Spacer(Modifier.height(10.dp))
                      Text(
                          text = titleText,
                          color = animatedColor,
                          fontSize = 14.5.sp,
                          fontWeight = FontWeight.Bold,
                          textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(4.dp))
                      Text(
                          text = subtitleText,
                          color = subColor,
                          fontSize = 11.5.sp,
                          textAlign = TextAlign.Center,
                          lineHeight = 17.sp
                      )
                  }
              }
          }

          @OptIn(ExperimentalFoundationApi::class)
          class MainActivity : FragmentActivity() {
              private var hasOverlayState = mutableStateOf(false)
              private var hasAccState = mutableStateOf(false)
              private var hasUsageState = mutableStateOf(false)
              private var hasCameraState = mutableStateOf(false)
              private var isPausedInRecentsState = mutableStateOf(false)
              private var isSelfLockedState = mutableStateOf(false)
              override fun onPause() {
                  super.onPause()
                  isPausedInRecentsState.value = true
              }
              override fun onStop() {
                  super.onStop()
                  if (!isChangingConfigurations && !AppRepo.isSelfSettingsGraceActive()) {
                      if (AppRepo.getRelockDelayMinutes() <= 0) {
                          AppRepo.unlockedSession.remove(packageName)
                          AppRepo.unlockTimestamps.remove(packageName)
                      }
                  }
              }
              override fun onResume() {
                  super.onResume()
                  isPausedInRecentsState.value = false
                  hasOverlayState.value = Settings.canDrawOverlays(this)
                  hasAccState.value = isAccessibilityServiceEnabled(this)
                  hasUsageState.value = isUsageStatsPermissionGranted(this)
                  hasCameraState.value = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                  applyRecentsSecureFlag(AppRepo.isRecentsPrivacyEnabled())
                  NowLockMonitorService.startServiceSafely(this)
                  if (AppRepo.isAnyPasswordSet() &&
                      AppRepo.getLockedPackages().contains(packageName) &&
                      !AppRepo.isSelfSettingsGraceActive() &&
                      !AppRepo.isWithinGracePeriod(packageName)
                  ) {
                      isSelfLockedState.value = true
                  } else {
                      isSelfLockedState.value = false
                  }
              }
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      hasOverlayState.value = Settings.canDrawOverlays(this)
                      hasAccState.value = isAccessibilityServiceEnabled(this)
                      hasUsageState.value = isUsageStatsPermissionGranted(this)
                      hasCameraState.value = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                  }
              }
              private fun requestCameraPermissionSafely() {
                  AppRepo.markLeavingForSettings(this)
                  runCatching {
                      val perms = mutableListOf(Manifest.permission.CAMERA)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      ActivityCompat.requestPermissions(this, perms.toTypedArray(), 1001)
                  }.onFailure {
                      openDirectAppDetailsSettings(this)
                  }
              }
              fun triggerSelfFingerprintPrompt(
                  s: UiStrings,
                  onSuccess: () -> Unit,
                  onFailedAttempt: () -> Unit,
                  onCancelOrError: () -> Unit
              ) {
                  val executor = ContextCompat.getMainExecutor(this)
                  val prompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                          super.onAuthenticationSucceeded(result)
                          onSuccess()
                      }
                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                          super.onAuthenticationError(errorCode, errString)
                          if (errorCode == BiometricPrompt.ERROR_LOCKOUT || errorCode == BiometricPrompt.ERROR_LOCKOUT_PERMANENT) {
                              onFailedAttempt()
                          }
                          onCancelOrError()
                      }
                      override fun onAuthenticationFailed() {
                          super.onAuthenticationFailed()
                          onFailedAttempt()
                      }
                  })
                  val promptInfo = BiometricPrompt.PromptInfo.Builder()
                      .setTitle("NowLock")
                      .setSubtitle(s.biometricSubtitle)
                      .setNegativeButtonText(
                          if (AppRepo.getComboMode() == LockComboMode.PATTERN_FINGERPRINT) s.biometricUsePattern else s.biometricUsePin
                      )
                      .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.BIOMETRIC_WEAK)
                      .build()
                  runCatching { prompt.authenticate(promptInfo) }.onFailure { onCancelOrError() }
              }
              private fun applyRecentsSecureFlag(enabled: Boolean) {
                  runCatching {
                      if (enabled) {
                          window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                      } else {
                          window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                      }
                  }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  AppRepo.init(this)
                  applyRecentsSecureFlag(AppRepo.isRecentsPrivacyEnabled())
                  configureNotchAndGlassBars(this, AppRepo.isDarkEffective(this))
                  hasOverlayState.value = Settings.canDrawOverlays(this)
                  hasAccState.value = isAccessibilityServiceEnabled(this)
                  hasUsageState.value = isUsageStatsPermissionGranted(this)
                  hasCameraState.value = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                  NowLockMonitorService.startServiceSafely(this)
                  setContent {
                      var themeMode by remember { mutableStateOf(AppRepo.getThemeMode()) }
                      var appLang by remember { mutableStateOf(AppRepo.getAppLang()) }
                      val s = getStrings(appLang)
                      val isFa = appLang.isRtl
                      val pagerState = rememberPagerState(initialPage = 0, pageCount = { NowLockNavTab.entries.size })
                      val selectedTab = NowLockNavTab.entries[pagerState.currentPage]
                      var comboMode by remember { mutableStateOf(AppRepo.getComboMode()) }
                      var fpEnabled by remember { mutableStateOf(AppRepo.isFingerprintEnabled()) }
                      var iconMode by remember { mutableStateOf(AppRepo.getIconMode()) }
                      var relockMinutes by remember { mutableStateOf(AppRepo.getRelockDelayMinutes()) }
                      var recentsPrivacy by remember { mutableStateOf(AppRepo.isRecentsPrivacyEnabled()) }
                      val sysDark = isSystemInDarkTheme()
                      val isAmoled = themeMode == ThemeMode.AMOLED
                      val isDark = when (themeMode) {
                          ThemeMode.SYSTEM -> sysDark
                          ThemeMode.DARK, ThemeMode.AMOLED -> true
                          ThemeMode.LIGHT -> false
                      }
                      SideEffect {
                          configureNotchAndGlassBars(this@MainActivity, isDark)
                      }
                      val hasOverlayPerm by hasOverlayState
                      val hasAccPerm by hasAccState
                      val hasUsagePerm by hasUsageState
                      val hasCamPerm by hasCameraState
                      val isPausedInRecents by isPausedInRecentsState
                      LaunchedEffect(hasCamPerm) {
                          while (!hasCamPerm) {
                              delay(450)
                              hasCameraState.value = ContextCompat.checkSelfPermission(
                                  this@MainActivity,
                                  Manifest.permission.CAMERA
                              ) == PackageManager.PERMISSION_GRANTED
                          }
                      }
                      val isEngineReady = hasAccPerm && hasUsagePerm && hasOverlayPerm && hasCamPerm
                      val topHeaderBg = if (isAmoled) Color(0xFF000000) else if (isDark) Color(0xCC1C1B5A) else Color(0xE6F0F2FA)
                      val card = if (isAmoled) Color(0xFF0B0B10) else if (isDark) Color(0xCC282664) else Color(0xF0FFFFFF)
                      val border = if (isAmoled) Color(0x26FFFFFF) else if (isDark) Color(0x18FFFFFF) else Color(0x125D56F5)
                      val blue = if (isDark) Color(0xFF6C63FF) else Color(0xFF5D56F5)
                      val txt = if (isDark) Color(0xFFF5F6FA) else Color(0xFF1F2232)
                      val sub = if (isDark) Color(0xFFA7A4D6) else Color(0xFF757992)
                      val lockedPkgsNow = remember { AppRepo.getLockedPackages() }
                      var appList by remember {
                          mutableStateOf(
                              AppRepo.cachedLauncherApps?.map { item ->
                                  item.copy(isLocked = lockedPkgsNow.contains(item.packageName))
                              } ?: emptyList()
                          )
                      }
                      LaunchedEffect(Unit) {
                          if (appList.isEmpty()) {
                              val loaded = withContext(Dispatchers.Default) {
                                  loadRealLauncherApps()
                              }
                              AppRepo.cachedLauncherApps = loaded
                              appList = loaded
                          }
                      }
                      var filterMode by remember { mutableStateOf(AppFilterMode.ALL) }
                      var searchQuery by remember { mutableStateOf("") }
                      var isLauncherHidden by remember { mutableStateOf(AppRepo.isLauncherHidden()) }
                      var lockOnScreenOff by remember { mutableStateOf(AppRepo.isLockOnScreenOffEnabled()) }
                      var decoyEnabled by remember { mutableStateOf(AppRepo.isDecoyEnabled()) }
                      var showPinDialog by remember { mutableStateOf(false) }
                      var showPatternDialog by remember { mutableStateOf(false) }
                      var showDecoyPinDialog by remember { mutableStateOf(false) }
                      var showDecoyPatternDialog by remember { mutableStateOf(false) }
                      var showPrivacyFullModal by remember { mutableStateOf(false) }
                      var pendingLockPkg by remember { mutableStateOf<String?>(null) }
                      var expandedPerAppPkg by remember { mutableStateOf<String?>(null) }
                      var passwordSetState by remember { mutableStateOf(AppRepo.isAnyPasswordSet()) }
                      var securityLogs by remember { mutableStateOf(AppRepo.getSecurityLogs()) }
                      var showUpdateSubtitle by remember { mutableStateOf(false) }
                      // Refresh security logs whenever switching to the Security Report tab, and auto-clear from storage once read upon leaving the tab!
                      var prevAcc by remember { mutableStateOf(hasAccPerm) }
                      var prevUsage by remember { mutableStateOf(hasUsagePerm) }
                      var prevOverlay by remember { mutableStateOf(hasOverlayPerm) }
                      var prevCam by remember { mutableStateOf(hasCamPerm) }
                      LaunchedEffect(hasAccPerm, hasUsagePerm, hasOverlayPerm, hasCamPerm) {
                          if (prevAcc && !hasAccPerm) AppRepo.appendSecurityLog(this@MainActivity, packageName, "PERM_REVOKED_ACC")
                          if (prevUsage && !hasUsagePerm) AppRepo.appendSecurityLog(this@MainActivity, packageName, "PERM_REVOKED_USAGE")
                          if (prevOverlay && !hasOverlayPerm) AppRepo.appendSecurityLog(this@MainActivity, packageName, "PERM_REVOKED_OVERLAY")
                          if (prevCam && !hasCamPerm) AppRepo.appendSecurityLog(this@MainActivity, packageName, "PERM_REVOKED_CAM")
                          prevAcc = hasAccPerm
                          prevUsage = hasUsagePerm
                          prevOverlay = hasOverlayPerm
                          prevCam = hasCamPerm
                          securityLogs = AppRepo.getSecurityLogs()
                      }
                      LaunchedEffect(pagerState.currentPage) {
                          if (NowLockNavTab.entries[pagerState.currentPage] == NowLockNavTab.REPORT) {
                              securityLogs = AppRepo.getSecurityLogs()
                          }
                      }
                      val scope = rememberCoroutineScope()
                      val navBarBottomInset = WindowInsets.navigationBars.asPaddingValues().calculateBottomPadding()
                      CompositionLocalProvider(LocalLayoutDirection provides if (appLang.isRtl) LayoutDirection.Rtl else LayoutDirection.Ltr) {
                          MaterialTheme {
                              HappAmbientBackground(isDark = isDark) {
                                  Scaffold(
                                      containerColor = Color.Transparent,
                                      contentWindowInsets = WindowInsets(0, 0, 0, 0),
                                      topBar = {
                                          Column(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .background(topHeaderBg)
                                                  .windowInsetsPadding(WindowInsets.statusBars.union(WindowInsets.displayCutout))
                                                  .padding(top = 8.dp, bottom = 2.dp),
                                              horizontalAlignment = Alignment.CenterHorizontally
                                          ) {
                                              Row(
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .padding(horizontal = 20.dp, vertical = 6.dp),
                                                  horizontalArrangement = Arrangement.SpaceBetween,
                                                  verticalAlignment = Alignment.CenterVertically
                                              ) {
                                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                                      Image(
                                                          painter = painterResource(
                                                              id = if (iconMode == AppIconMode.CALCULATOR) R.drawable.ic_nowlock_calculator else R.drawable.ic_nowlock_logo
                                                          ),
                                                          contentDescription = "NowLock Icon",
                                                          modifier = Modifier
                                                              .size(34.dp)
                                                              .clip(RoundedCornerShape(9.dp))
                                                      )
                                                      Spacer(Modifier.width(10.dp))
                                                      AnimatedRgbBrandText(
                                                          text = "NowLock",
                                                          fontSize = 23.sp
                                                      )
                                                  }
                                                  Surface(
                                                      shape = RoundedCornerShape(50),
                                                      color = if (passwordSetState && isEngineReady) Color(0x2210B981) else Color(0x22F43F5E)
                                                  ) {
                                                      Text(
                                                          text = if (!passwordSetState) s.statusNoPassword
                                                          else if (!isEngineReady) s.statusNeedsPerm
                                                          else s.statusActive,
                                                          color = if (passwordSetState && isEngineReady) Color(0xFF10B981) else Color(0xFFF43F5E),
                                                          fontSize = 11.sp,
                                                          fontWeight = FontWeight.SemiBold,
                                                          modifier = Modifier.padding(horizontal = 10.dp, vertical = 5.dp)
                                                      )
                                                  }
                                              }
                                              TabRow(
                                                  selectedTabIndex = pagerState.currentPage,
                                                  containerColor = Color.Transparent,
                                                  contentColor = blue,
                                                  divider = { HorizontalDivider(color = border) }
                                              ) {
                                                  NowLockNavTab.entries.forEach { tab ->
                                                      val isSelected = pagerState.currentPage == tab.ordinal
                                                      Tab(
                                                          selected = isSelected,
                                                          onClick = {
                                                              scope.launch {
                                                                  pagerState.animateScrollToPage(
                                                                      page = tab.ordinal,
                                                                      animationSpec = tween(durationMillis = 320, easing = FastOutSlowInEasing)
                                                                  )
                                                              }
                                                          },
                                                          text = {
                                                              Text(
                                                                  tab.getTitle(s),
                                                                  fontSize = 13.sp,
                                                                  fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal,
                                                                  color = if (isSelected) blue else sub
                                                              )
                                                          }
                                                      )
                                                  }
                                              }
                                          }
                                      }
                                  ) { innerPadding ->
                                      val screenMetrics = rememberAdaptiveScreenMetrics()
                                      Box(
                                          contentAlignment = Alignment.TopCenter,
                                          modifier = Modifier
                                              .fillMaxSize()
                                              .padding(top = innerPadding.calculateTopPadding())
                                      ) {
                                          HorizontalPager(
                                              state = pagerState,
                                              key = { it },
                                              modifier = Modifier.fillMaxSize()
                                          ) { pageIdx ->
                                              Box(
                                                  contentAlignment = Alignment.TopCenter,
                                                  modifier = Modifier
                                                      .fillMaxSize()
                                                      .graphicsLayer {
                                                          val pageOffset = ((pagerState.currentPage - pageIdx) + pagerState.currentPageOffsetFraction).let { abs(it) }.coerceIn(0f, 1f)
                                                          alpha = 1f - (pageOffset * 0.35f)
                                                          val scale = 1f - (pageOffset * 0.025f)
                                                          scaleX = scale
                                                          scaleY = scale
                                                      }
                                              ) {
                                                  when (NowLockNavTab.entries[pageIdx]) {
                                              NowLockNavTab.APPS -> {
                                                  Column(modifier = Modifier.widthIn(max = screenMetrics.contentMaxWidthDp.dp).fillMaxSize().padding(horizontal = 16.dp)) {
                                                      OutlinedTextField(
