          // Full-Screen Lock Activity (Clean Top Header: ONLY Small Padlock + RGB "NowLock", Intruder Selfie on Failed Fingerprint Too)
          class LockScreenActivity : FragmentActivity() {
              companion object {
                  @Volatile var isShowing = false
                  @Volatile var activeTargetPkg = ""
              }
              override fun onResume() {
                  super.onResume()
                  isShowing = true
                  OverlayLockBridge.dismissShield(this)
              }
              override fun onStop() {
                  super.onStop()
                  isShowing = false
                  OverlayLockBridge.dismissShield(this)
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  overridePendingTransition(0, 0)
                  AppRepo.init(this)
                  if (AppRepo.isRecentsPrivacyEnabled()) {
                      runCatching { window.addFlags(WindowManager.LayoutParams.FLAG_SECURE) }
                  }
                  configureNotchAndGlassBars(this, AppRepo.isDarkEffective(this))
                  val targetPkg = intent.getStringExtra("target_pkg") ?: ""
                  activeTargetPkg = targetPkg
                  isShowing = true
                  OverlayLockBridge.dismissShield(this)
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          navigateHomeAndClose()
                      }
                  })
                  setContent {
                      val lang = AppRepo.getAppLang()
                      val s = getStrings(lang)
                      val themeMode = AppRepo.getThemeMode()
                      val sysDark = isSystemInDarkTheme()
                      val isAmoled = themeMode == ThemeMode.AMOLED
                      val isDark = when (themeMode) {
                          ThemeMode.SYSTEM -> sysDark
                          ThemeMode.DARK, ThemeMode.AMOLED -> true
                          ThemeMode.LIGHT -> false
                      }
                      SideEffect {
                          configureNotchAndGlassBars(this@LockScreenActivity, isDark)
                      }
                      val config = LocalConfiguration.current
                      val isCompactScreen = config.screenHeightDp < 700
                      val primaryTextColor = Color(0xFFF8FAFC)
                      val secondaryTextColor = Color(0xFFD8DEE9)
                      val accentBlue = Color(0xFF6EE7B7)
                      val effCfg = remember(targetPkg) { AppRepo.getEffectiveConfig(targetPkg) }
                      val comboMode = effCfg.comboMode
                      val usePattern = (comboMode == LockComboMode.PATTERN_FINGERPRINT && AppRepo.isPatternSet()) ||
                          (!AppRepo.isPinSet() && AppRepo.isPatternSet())
                      val fpEnabled = effCfg.fpEnabled && canUseFingerprint(this)
                      var isShowingFakeCrash by remember { mutableStateOf(false) }
                      var enteredPin by remember { mutableStateOf("") }
                      var cooldownRemainingSec by remember { mutableStateOf(AppRepo.getLockoutRemainingSeconds()) }
                      val defaultPrompt = if (usePattern) s.lockPromptPattern else s.lockPromptPin
                      var statusMessage by remember(lang, usePattern) {
                          mutableStateOf(
                              if (cooldownRemainingSec > 0) s.formatCooldown(cooldownRemainingSec) else defaultPrompt
                          )
                      }
                      var isErrorState by remember { mutableStateOf(cooldownRemainingSec > 0) }
                      var isUnlockingFade by remember { mutableStateOf(false) }
                      var telegramBiometricPulse by remember { mutableStateOf(false) }
                      LaunchedEffect(cooldownRemainingSec) {
                          if (cooldownRemainingSec > 0) {
                              isErrorState = true
                              statusMessage = s.formatCooldown(cooldownRemainingSec)
                              delay(1000L)
                              val rem = AppRepo.getLockoutRemainingSeconds()
                              cooldownRemainingSec = rem
                              if (rem <= 0) {
                                  isErrorState = false
                                  statusMessage = defaultPrompt
                              }
                          }
                      }
                      val screenAlpha by animateFloatAsState(
                          targetValue = if (isUnlockingFade) 0f else 1f,
                          animationSpec = tween(durationMillis = 180, easing = FastOutSlowInEasing),
                          finishedListener = {
                              if (isUnlockingFade) {
                                  isShowing = false
                                  OverlayLockBridge.dismissShield(this@LockScreenActivity)
                                  finish()
                                  overridePendingTransition(0, android.R.anim.fade_out)
                              }
                          },
                          label = "unlockFade"
                      )
                      val scope = rememberCoroutineScope()
                      fun onSuccessfulUnlock() {
                          AppRepo.resetFailedAttempts()
                          cooldownRemainingSec = 0
                          if (targetPkg.isNotEmpty()) {
                              AppRepo.markUnlocked(targetPkg)
                          }
                          AppRepo.markUnlocked(packageName)
                          isShowing = false
                          OverlayLockBridge.dismissShield(this@LockScreenActivity)
                          finish()
                          overridePendingTransition(0, 0)
                      }
                      fun onWrongAttempt(methodStr: String = if (usePattern) "Pattern" else "PIN") {
                          isErrorState = true
                          if (effCfg.vibrateOnError) {
                              AppRepo.triggerShortVibration(this@LockScreenActivity, 65L)
                          }
                          val (_, penaltySec) = AppRepo.registerWrongCredentialAttempt(this@LockScreenActivity, targetPkg, methodStr)
                          if (penaltySec > 0) {
                              cooldownRemainingSec = penaltySec
                              statusMessage = s.formatCooldown(penaltySec)
                          } else {
                              val activeRem = AppRepo.getLockoutRemainingSeconds()
                              if (activeRem > 0) {
                                  cooldownRemainingSec = activeRem
                                  statusMessage = s.formatCooldown(activeRem)
                              } else {
                                  statusMessage = s.lockWrongAttempt
                              }
                          }
                      }
                      LaunchedEffect(Unit) {
                          if (fpEnabled) {
                              delay(180)
                              telegramBiometricPulse = true
                              triggerFingerprintPrompt(
                                  s = s,
                                  onSuccess = { onSuccessfulUnlock() },
                                  onFailedAttempt = { onWrongAttempt("Fingerprint") },
                                  onCancelOrError = { telegramBiometricPulse = false }
                              )
                          }
                      }
                      FrostedAppColorGlassBackground(
                          targetPkg = targetPkg,
                          isDark = isDark,
                          modifier = Modifier
                              .fillMaxSize()
                              .alpha(screenAlpha)
                      ) {
                          AdaptiveLockScreenBody(
                              s = s,
                              usePattern = usePattern,
                              fpEnabled = fpEnabled,
                              isFingerprintPulsing = telegramBiometricPulse,
                              statusMessage = statusMessage,
                              isErrorState = isErrorState,
                              enteredPinLength = enteredPin.length,
                              primaryTextColor = primaryTextColor,
                              secondaryTextColor = secondaryTextColor,
                              accentBlue = accentBlue,
                              onPatternAttempt = { patternStr, resetPatternCallback ->
                                  val rem = AppRepo.getLockoutRemainingSeconds()
                                  val isCorrect = AppRepo.verifyPattern(patternStr)
                                  val isDecoy = effCfg.decoyCrashEnabled && AppRepo.verifyDecoyPattern(patternStr)
                                  if (rem > 0) {
                                      cooldownRemainingSec = rem
                                      if (!isCorrect && !isDecoy) {
                                          onWrongAttempt("Pattern")
                                      } else {
                                          isErrorState = true
                                          AppRepo.triggerShortVibration(this@LockScreenActivity, 50L)
                                          statusMessage = s.formatCooldown(cooldownRemainingSec)
                                      }
                                      scope.launch {
                                          delay(320)
                                          resetPatternCallback()
                                      }
                                  } else if (isCorrect) {
                                      onSuccessfulUnlock()
                                  } else if (isDecoy) {
                                      AppRepo.appendSecurityLog(this@LockScreenActivity, targetPkg, "DECOY_USED")
                                      resetPatternCallback()
                                      isShowingFakeCrash = true
                                  } else {
                                      onWrongAttempt("Pattern")
                                      scope.launch {
                                          delay(350)
                                          resetPatternCallback()
                                          if (cooldownRemainingSec == 0) {
                                              isErrorState = false
                                              statusMessage = defaultPrompt
                                          }
                                      }
                                  }
                              },
                              onDigitClick = { digit ->
                                  if (enteredPin.length < 4) {
                                      if (cooldownRemainingSec <= 0) isErrorState = false
                                      enteredPin += digit.toString()
                                      if (enteredPin.length == 4) {
                                          val rem = AppRepo.getLockoutRemainingSeconds()
                                          val isCorrect = AppRepo.verifyPin(enteredPin)
                                          val isDecoy = effCfg.decoyCrashEnabled && AppRepo.verifyDecoyPin(enteredPin)
                                          if (rem > 0) {
                                              cooldownRemainingSec = rem
                                              if (!isCorrect && !isDecoy) {
                                                  onWrongAttempt("PIN")
                                              } else {
                                                  isErrorState = true
                                                  AppRepo.triggerShortVibration(this@LockScreenActivity, 50L)
                                                  statusMessage = s.formatCooldown(cooldownRemainingSec)
                                              }
                                              scope.launch {
                                                  delay(260)
                                                  enteredPin = ""
                                              }
                                          } else if (isCorrect) {
                                              onSuccessfulUnlock()
                                          } else if (isDecoy) {
                                              AppRepo.appendSecurityLog(this@LockScreenActivity, targetPkg, "DECOY_USED")
                                              enteredPin = ""
                                              isShowingFakeCrash = true
                                          } else {
                                              onWrongAttempt("PIN")
                                              scope.launch {
                                                  delay(260)
                                                  enteredPin = ""
                                              }
                                          }
                                      }
                                  }
                              },
                              onBackspaceClick = {
                                  if (enteredPin.isNotEmpty()) {
                                      isErrorState = false
                                      enteredPin = enteredPin.dropLast(1)
                                  }
                              },
                              onFingerprintClick = {
                                  telegramBiometricPulse = true
                                  triggerFingerprintPrompt(
                                      s = s,
                                      onSuccess = { onSuccessfulUnlock() },
                                      onFailedAttempt = { onWrongAttempt("Fingerprint") },
                                      onCancelOrError = { telegramBiometricPulse = false }
                                  )
                              },
                              onExitClick = { navigateHomeAndClose() }
                          )
                          if (isShowingFakeCrash) {
                              FakeAndroidSystemCrashOverlay(
                                  targetPkg = targetPkg,
                                  s = s,
                                  onCloseApp = { navigateHomeAndClose() }
                              )
                          }
                      }
                  }
              }
              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  val pkg = intent.getStringExtra("target_pkg") ?: ""
                  if (pkg.isNotEmpty()) activeTargetPkg = pkg
                  OverlayLockBridge.dismissShield(this)
              }
              override fun onDestroy() {
                  isShowing = false
                  OverlayLockBridge.dismissShield(this)
                  super.onDestroy()
              }
              private fun navigateHomeAndClose() {
                  OverlayLockBridge.dismissShield(this)
                  val home = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK
                  }
                  runCatching { startActivity(home) }
                  isShowing = false
                  finish()
              }
              private fun triggerFingerprintPrompt(
                  s: UiStrings,
                  onSuccess: () -> Unit,
                  onFailedAttempt: () -> Unit,
                  onCancelOrError: () -> Unit
              ) {
                  val executor = ContextCompat.getMainExecutor(this)
                  val prompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                          super.onAuthenticationSucceeded(result)
                          onSuccess()
                      }
                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                          super.onAuthenticationError(errorCode, errString)
                          if (errorCode == BiometricPrompt.ERROR_LOCKOUT || errorCode == BiometricPrompt.ERROR_LOCKOUT_PERMANENT) {
                              onFailedAttempt()
                          }
                          onCancelOrError()
                      }
                      override fun onAuthenticationFailed() {
                          super.onAuthenticationFailed()
                          // Every wrong fingerprint attempt triggers vibration and counts toward Intruder Selfie!
                          onFailedAttempt()
                      }
                  })
                  val promptInfo = BiometricPrompt.PromptInfo.Builder()
                      .setTitle("NowLock")
                      .setSubtitle(s.biometricSubtitle)
                      .setNegativeButtonText(
                          if (AppRepo.getComboMode() == LockComboMode.PATTERN_FINGERPRINT) s.biometricUsePattern else s.biometricUsePin
                      )
                      .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.BIOMETRIC_WEAK)
                      .build()
                  runCatching { prompt.authenticate(promptInfo) }.onFailure { onCancelOrError() }
              }
          }
          fun canUseFingerprint(context: Context): Boolean {
              val bm = BiometricManager.from(context)
              return bm.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.BIOMETRIC_WEAK) == BiometricManager.BIOMETRIC_SUCCESS
          }
