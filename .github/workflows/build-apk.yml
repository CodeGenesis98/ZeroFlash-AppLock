                      android:roundIcon="@drawable/ic_nowlock_calculator"
                      android:label="@string/calc_alias_name"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <!-- Fullscreen Lock Screen Activity -->
                  <activity
                      android:name=".LockScreenActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:showOnLockScreen="true"
                      android:resizeableActivity="true"
                      android:configChanges="uiMode|locale|layoutDirection|orientation|screenSize|smallestScreenSize|screenLayout|density"
                      android:theme="@style/Theme.NowLock" />
                  <!-- Engine 1: Accessibility + UsageStats Hybrid Service -->
                  <service
                      android:name=".NowLockAccessibilityService"
                      android:exported="true"
                      android:directBootAware="true"
                      android:label="@string/accessibility_service_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
                  <!-- Engine 2: Standalone UsageStats Foreground Service (Reboot & Background Guard) -->
                  <service
                      android:name=".NowLockMonitorService"
                      android:exported="false"
                      android:directBootAware="true"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
