              private lateinit var prefs: SharedPreferences
              private val lockedMemorySet = ConcurrentHashMap.newKeySet<String>()
              val unlockedSession = ConcurrentHashMap.newKeySet<String>()
              val unlockTimestamps = ConcurrentHashMap<String, Long>()
              @Volatile var lastActivePackage: String = ""
              @Volatile var lastLockShownTime: Long = 0L
              fun init(ctx: Context) {
                  if (!::prefs.isInitialized) {
                      val storageCtx = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && ctx.isDeviceProtectedStorage) {
                          ctx
                      } else {
                          ctx.applicationContext ?: ctx
                      }
                      prefs = storageCtx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      reloadLockedPackagesFromPrefs()
                  }
              }
              private fun reloadLockedPackagesFromPrefs() {
                  val csv = prefs.getString(KEY_LOCKED_PKGS_CSV, null)
                  if (csv != null) {
                      lockedMemorySet.clear()
                      csv.split(",").map { it.trim() }.filter { it.isNotEmpty() }.forEach { lockedMemorySet.add(it) }
                  } else {
                      val legacy = prefs.getStringSet(KEY_LOCKED_PKGS, emptySet()) ?: emptySet()
                      lockedMemorySet.clear()
                      lockedMemorySet.addAll(legacy)
                      if (legacy.isNotEmpty()) {
                          prefs.edit().putString(KEY_LOCKED_PKGS_CSV, legacy.joinToString(",")).commit()
                      }
                  }
              }
              fun getLockedPackages(): Set<String> {
                  reloadLockedPackagesFromPrefs()
                  return lockedMemorySet.toSet()
              }
              fun isPinSet(): Boolean = prefs.getString(KEY_PIN_HASH, null) != null
              fun isPatternSet(): Boolean = prefs.getString(KEY_PATTERN_HASH, null) != null
              fun isAnyPasswordSet(): Boolean = isPinSet() || isPatternSet()
              fun setPin(pin: String) {
                  prefs.edit().putString(KEY_PIN_HASH, sha256("pin_" + pin)).commit()
              }
              fun verifyPin(pin: String): Boolean {
                  val saved = prefs.getString(KEY_PIN_HASH, null) ?: return false
                  return sha256("pin_" + pin) == saved
              }
              fun setPattern(patternStr: String) {
                  prefs.edit().putString(KEY_PATTERN_HASH, sha256("pat_" + patternStr)).commit()
              }
              fun verifyPattern(patternStr: String): Boolean {
                  val saved = prefs.getString(KEY_PATTERN_HASH, null) ?: return false
                  return sha256("pat_" + patternStr) == saved
              }
              fun getComboMode(): LockComboMode =
                  runCatching {
                      LockComboMode.valueOf(prefs.getString(KEY_COMBO_MODE, LockComboMode.PIN_FINGERPRINT.name) ?: LockComboMode.PIN_FINGERPRINT.name)
                  }.getOrDefault(LockComboMode.PIN_FINGERPRINT)
              fun setComboMode(m: LockComboMode) {
                  prefs.edit().putString(KEY_COMBO_MODE, m.name).commit()
              }
              fun isFingerprintEnabled(): Boolean = prefs.getBoolean(KEY_FINGERPRINT_ENABLED, true)
              fun setFingerprintEnabled(enabled: Boolean) {
                  prefs.edit().putBoolean(KEY_FINGERPRINT_ENABLED, enabled).commit()
              }
              fun getRelockDelayMinutes(): Int = prefs.getInt(KEY_RELOCK_MINUTES, 0)
              fun setRelockDelayMinutes(minutes: Int) {
                  prefs.edit().putInt(KEY_RELOCK_MINUTES, minutes).commit()
              }
              fun isRecentsPrivacyEnabled(): Boolean = prefs.getBoolean(KEY_RECENTS_PRIVACY, true)
              fun setRecentsPrivacyEnabled(enabled: Boolean) {
                  prefs.edit().putBoolean(KEY_RECENTS_PRIVACY, enabled).commit()
              }
              fun getIconMode(): AppIconMode =
                  runCatching {
                      AppIconMode.valueOf(prefs.getString(KEY_ICON_MODE, AppIconMode.PADLOCK.name) ?: AppIconMode.PADLOCK.name)
                  }.getOrDefault(AppIconMode.PADLOCK)
              fun setIconMode(ctx: Context, mode: AppIconMode) {
                  prefs.edit().putString(KEY_ICON_MODE, mode.name).commit()
                  val pm = ctx.packageManager
                  val defaultAlias = ComponentName(ctx, "io.nowlock.app.LauncherDefaultAlias")
                  val calcAlias = ComponentName(ctx, "io.nowlock.app.LauncherCalculatorAlias")
                  if (mode == AppIconMode.PADLOCK) {
                      pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
                      pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                  } else {
                      pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
                      pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                  }
              }
              fun toggleAppLock(pkg: String, lock: Boolean) {
                  reloadLockedPackagesFromPrefs()
                  if (lock) {
                      lockedMemorySet.add(pkg)
                      unlockedSession.remove(pkg)
                      unlockTimestamps.remove(pkg)
                  } else {
                      lockedMemorySet.remove(pkg)
                      unlockedSession.remove(pkg)
                      unlockTimestamps.remove(pkg)
                  }
                  val csv = lockedMemorySet.joinToString(",")
                  prefs.edit()
                      .putString(KEY_LOCKED_PKGS_CSV, csv)
                      .putStringSet(KEY_LOCKED_PKGS, HashSet(lockedMemorySet))
                      .commit()
              }
              fun markUnlocked(pkg: String) {
                  val now = System.currentTimeMillis()
                  unlockedSession.add(pkg)
                  unlockTimestamps[pkg] = now
                  prefs.edit().putLong("unlock_ts_$pkg", now).commit()
                  lastActivePackage = pkg
              }
              fun isWithinGracePeriod(pkg: String): Boolean {
                  val delayMin = getRelockDelayMinutes()
                  if (delayMin <= 0) {
                      return unlockedSession.contains(pkg)
                  }
                  val windowMs = delayMin * 60_000L
                  val lastTs = unlockTimestamps[pkg] ?: prefs.getLong("unlock_ts_$pkg", 0L)
                  if (lastTs <= 0L) return false
                  val valid = (System.currentTimeMillis() - lastTs) < windowMs
                  if (!valid) {
                      unlockedSession.remove(pkg)
                      unlockTimestamps.remove(pkg)
                  }
                  return valid
              }
              fun clearAllUnlockedSessionsOnScreenOff() {
                  if (getRelockDelayMinutes() <= 0) {
                      unlockedSession.clear()
                      unlockTimestamps.clear()
                      lastActivePackage = ""
                  }
              }
              fun evaluateForegroundPackage(pkg: String, myPkg: String): Boolean {
                  if (pkg.isBlank() || pkg == myPkg) return false
                  if (pkg.contains("systemui") ||
                      pkg.contains("inputmethod") ||
                      pkg.contains("keyboard") ||
                      pkg.contains("biometric") ||
                      pkg.contains("permissioncontroller") ||
                      pkg == "android"
                  ) {
                      return false
                  }
                  if (!isAnyPasswordSet()) return false
                  val delayMin = getRelockDelayMinutes()
                  if (pkg != lastActivePackage && lastActivePackage.isNotEmpty()) {
                      val isHomeOrLauncher = pkg.contains("launcher") || pkg.contains("home") || pkg.contains("miui.home") || pkg.contains("sec.android.app.launcher")
                      if (delayMin <= 0) {
                          if (isHomeOrLauncher) {
                              unlockedSession.clear()
                          } else {
                              unlockedSession.remove(lastActivePackage)
                          }
                      } else {
                          if (unlockedSession.contains(lastActivePackage)) {
                              val now = System.currentTimeMillis()
                              unlockTimestamps.putIfAbsent(lastActivePackage, now)
                          }
                      }
                  }
                  lastActivePackage = pkg
                  if (isUninstallProtectionEnabled() && (pkg.contains("packageinstaller") || pkg.contains("uninstaller"))) {
                      return !isWithinGracePeriod(pkg)
                  }
                  val lockedSet = getLockedPackages()
                  if (!lockedSet.contains(pkg)) return false
                  return !isWithinGracePeriod(pkg)
              }
              fun launchLockScreenIfNeeded(ctx: Context, targetPkg: String) {
                  val now = System.currentTimeMillis()
                  if (now - lastLockShownTime < 300L && LockScreenActivity.activeTargetPkg == targetPkg && LockScreenActivity.isShowing) {
                      return
                  }
                  lastLockShownTime = now
                  if (targetPkg == ctx.packageName) {
                      val intent = Intent(ctx, LockScreenActivity::class.java).apply {
                          addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_CLEAR_TOP or
                              Intent.FLAG_ACTIVITY_SINGLE_TOP or
                              Intent.FLAG_ACTIVITY_NO_ANIMATION
                          )
                          putExtra("target_pkg", targetPkg)
                      }
                      runCatching { ctx.startActivity(intent) }
                  } else {
                      OverlayLockBridge.showShieldAndLaunchLockActivity(ctx, targetPkg)
                  }
              }
              fun isVibrationEnabled(): Boolean = prefs.getBoolean(KEY_VIBRATE, true)
              fun setVibrationEnabled(v: Boolean) = prefs.edit().putBoolean(KEY_VIBRATE, v).commit()
              fun isIntruderSelfieEnabled(): Boolean = prefs.getBoolean(KEY_INTRUDER, true)
              fun setIntruderSelfieEnabled(v: Boolean) = prefs.edit().putBoolean(KEY_INTRUDER, v).commit()
              fun recordIntruderAttempt(ctx: Context, targetPkg: String) {
                  val c = prefs.getInt(KEY_INTRUDER_COUNT, 0) + 1
                  prefs.edit().putInt(KEY_INTRUDER_COUNT, c).commit()
                  IntruderPhotoSaver.captureFrontCameraToGallery(ctx.applicationContext, targetPkg)
              }
              fun getIntruderCount(): Int = prefs.getInt(KEY_INTRUDER_COUNT, 0)
              fun isUninstallProtectionEnabled(): Boolean = prefs.getBoolean(KEY_UNINSTALL, false)
              fun setUninstallProtectionEnabled(v: Boolean) = prefs.edit().putBoolean(KEY_UNINSTALL, v).commit()
              fun getThemeMode(): ThemeMode =
                  runCatching { ThemeMode.valueOf(prefs.getString(KEY_THEME_MODE, ThemeMode.SYSTEM.name) ?: ThemeMode.SYSTEM.name) }.getOrDefault(ThemeMode.SYSTEM)
              fun setThemeMode(m: ThemeMode) = prefs.edit().putString(KEY_THEME_MODE, m.name).commit()
              fun getAppLang(): AppLang =
                  runCatching { AppLang.valueOf(prefs.getString(KEY_APP_LANG, AppLang.FA.name) ?: AppLang.FA.name) }.getOrDefault(AppLang.FA)
              fun setAppLang(lang: AppLang) = prefs.edit().putString(KEY_APP_LANG, lang.name).commit()
              fun isDarkEffective(ctx: Context): Boolean {
                  return when (getThemeMode()) {
                      ThemeMode.DARK -> true
                      ThemeMode.LIGHT -> false
                      ThemeMode.SYSTEM -> {
                          val nightFlags = ctx.resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK
                          nightFlags == Configuration.UI_MODE_NIGHT_YES
                      }
                  }
              }
              fun triggerShortVibration(ctx: Context, durationMs: Long = 55L) {
                  if (!isVibrationEnabled()) return
                  val vib = ctx.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vib.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      @Suppress("DEPRECATION")
                      vib.vibrate(durationMs)
                  }
              }
              private fun sha256(s: String): String =
                  MessageDigest.getInstance("SHA-256").digest(("nowlock_v65_salt_" + s).toByteArray()).joinToString("") { "%02x".format(it) }
          }
          fun isAccessibilityServiceEnabled(context: Context): Boolean {
              val expected = ComponentName(context, NowLockAccessibilityService::class.java).flattenToString()
              val enabledServices = Settings.Secure.getString(context.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
              val splitter = TextUtils.SimpleStringSplitter(':')
              splitter.setString(enabledServices)
              while (splitter.hasNext()) {
                  val component = splitter.next()
                  if (component.equals(expected, ignoreCase = true)) return true
              }
              return false
          }
          fun isUsageStatsPermissionGranted(context: Context): Boolean {
              val appOps = context.getSystemService(Context.APP_OPS_SERVICE) as? AppOpsManager ?: return false
              val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                  appOps.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), context.packageName)
              } else {
                  @Suppress("DEPRECATION")
                  appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), context.packageName)
              }
              return mode == AppOpsManager.MODE_ALLOWED
          }
          fun pollTopPackageViaUsageStats(context: Context): Pair<String, String> {
              if (!isUsageStatsPermissionGranted(context)) return "" to ""
              val usm = context.getSystemService(Context.USAGE_STATS_SERVICE) as? UsageStatsManager ?: return "" to ""
              val now = System.currentTimeMillis()
              val events = usm.queryEvents(now - 8000L, now)
              var latestPkg = ""
              var latestClass = ""
              var latestTime = 0L
              if (events != null) {
                  val event = UsageEvents.Event()
                  while (events.hasNextEvent()) {
                      events.getNextEvent(event)
                      if (event.eventType == UsageEvents.Event.ACTIVITY_RESUMED ||
                          event.eventType == UsageEvents.Event.MOVE_TO_FOREGROUND
                      ) {
                          if (event.timeStamp >= latestTime) {
                              latestTime = event.timeStamp
                              latestPkg = event.packageName ?: ""
                              latestClass = event.className ?: ""
                          }
                      }
                  }
              }
              return latestPkg to latestClass
          }
          // Helper to post "New App Installed: Lock with NowLock?" notification
          object NewAppNotificationHelper {
              private const val CHANNEL_ID = "nowlock_new_app_prompt"
              fun showLockPromptNotification(context: Context, newPkg: String) {
                  AppRepo.init(context)
                  if (newPkg == context.packageName || AppRepo.getLockedPackages().contains(newPkg)) return
                  val pm = context.packageManager
                  val appLabel = runCatching {
                      val ai = pm.getApplicationInfo(newPkg, 0)
                      pm.getApplicationLabel(ai).toString()
                  }.getOrNull() ?: return
                  val s = getStrings(AppRepo.getAppLang())
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager ?: return
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(
                          CHANNEL_ID,
                          "NowLock New App Prompt",
                          NotificationManager.IMPORTANCE_HIGH
                      )
                      nm.createNotificationChannel(chan)
                  }
                  val notifId = newPkg.hashCode().and(0x7FFFFFFF)
                  val lockIntent = Intent(context, NewAppLockActionReceiver::class.java).apply {
                      action = "io.nowlock.app.ACTION_LOCK_NEW_APP"
                      putExtra("target_pkg", newPkg)
                      putExtra("notif_id", notifId)
                  }
                  val dismissIntent = Intent(context, NewAppLockActionReceiver::class.java).apply {
                      action = "io.nowlock.app.ACTION_DISMISS_NEW_APP"
                      putExtra("notif_id", notifId)
                  }
                  val lockPi = PendingIntent.getBroadcast(
                      context,
                      notifId,
                      lockIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val dismissPi = PendingIntent.getBroadcast(
                      context,
                      notifId + 1,
                      dismissIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(context, CHANNEL_ID)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(context)
                  }
                  val notification = builder
                      .setSmallIcon(R.drawable.ic_nowlock_logo)
                      .setContentTitle(s.newAppNotifTitle + appLabel)
                      .setContentText(s.newAppNotifBody)
                      .setAutoCancel(true)
                      .addAction(Notification.Action.Builder(R.drawable.ic_nowlock_logo, s.newAppActionLock, lockPi).build())
                      .addAction(Notification.Action.Builder(R.drawable.ic_nowlock_logo, s.newAppActionDismiss, dismissPi).build())
                      .build()
                  runCatching { nm.notify(notifId, notification) }
              }
          }
          class NewAppInstallReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action != Intent.ACTION_PACKAGE_ADDED) return
                  if (intent.getBooleanExtra(Intent.EXTRA_REPLACING, false)) return
                  val pkg = intent.data?.schemeSpecificPart ?: return
                  NewAppNotificationHelper.showLockPromptNotification(context, pkg)
              }
          }
          class NewAppLockActionReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  AppRepo.init(context)
                  val notifId = intent?.getIntExtra("notif_id", 0) ?: 0
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                  if (notifId != 0) nm?.cancel(notifId)
                  if (intent?.action == "io.nowlock.app.ACTION_LOCK_NEW_APP") {
                      val pkg = intent.getStringExtra("target_pkg") ?: return
                      AppRepo.toggleAppLock(pkg, true)
                      val s = getStrings(AppRepo.getAppLang())
                      Toast.makeText(context, "🔒 ${s.filterLocked}: $pkg", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          // Engine 1: Instant 0ms Accessibility + UsageStats Hybrid Service (Auto-started by Android OS on boot!)
          class NowLockAccessibilityService : AccessibilityService() {
              private val mainHandler = Handler(Looper.getMainLooper())
              private var isPolling = false
              private val pollRunnable = object : Runnable {
                  override fun run() {
                      if (!isPolling) return
                      runCatching {
                          val (latestPkg, latestCls) = pollTopPackageViaUsageStats(this@NowLockAccessibilityService)
                          if (latestPkg.isNotEmpty() && !(latestPkg == packageName && latestCls.contains("LockScreenActivity"))) {
                              if (AppRepo.evaluateForegroundPackage(latestPkg, packageName)) {
                                  AppRepo.launchLockScreenIfNeeded(this@NowLockAccessibilityService, latestPkg)
                              }
                          }
                      }
                      mainHandler.postDelayed(this, 200L)
                  }
              }
              private val dynamicReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_SCREEN_OFF -> AppRepo.clearAllUnlockedSessionsOnScreenOff()
                          Intent.ACTION_PACKAGE_ADDED -> {
                              if (!intent.getBooleanExtra(Intent.EXTRA_REPLACING, false)) {
                                  val pkg = intent.data?.schemeSpecificPart ?: return
                                  NewAppNotificationHelper.showLockPromptNotification(context, pkg)
                              }
                          }
                      }
                  }
              }
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  AppRepo.init(this)
                  runCatching {
                      registerReceiver(dynamicReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
                      val pkgFilter = IntentFilter(Intent.ACTION_PACKAGE_ADDED).apply { addDataScheme("package") }
                      registerReceiver(dynamicReceiver, pkgFilter)
                  }
                  isPolling = true
                  mainHandler.post(pollRunnable)
                  NowLockMonitorService.startServiceSafely(this)
              }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  AppRepo.init(this)
                  val eventPkg = event.packageName?.toString() ?: ""
                  val cls = event.className?.toString() ?: ""
                  if (eventPkg == packageName && cls.contains("LockScreenActivity")) return
                  if (eventPkg.isNotEmpty() && AppRepo.evaluateForegroundPackage(eventPkg, packageName)) {
                      AppRepo.launchLockScreenIfNeeded(this, eventPkg)
                      return
                  }
                  val rootPkg = runCatching { rootInActiveWindow?.packageName?.toString() ?: "" }.getOrDefault("")
                  if (rootPkg.isNotEmpty() && rootPkg != eventPkg && AppRepo.evaluateForegroundPackage(rootPkg, packageName)) {
                      AppRepo.launchLockScreenIfNeeded(this, rootPkg)
                      return
                  }
                  if (event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED) {
                      runCatching {
                          for (window in windows) {
                              val wPkg = window.root?.packageName?.toString() ?: continue
                              if (wPkg == packageName && LockScreenActivity.isShowing) continue
                              if (AppRepo.evaluateForegroundPackage(wPkg, packageName)) {
                                  AppRepo.launchLockScreenIfNeeded(this, wPkg)
                                  break
                              }
                          }
                      }
                  }
              }
              override fun onInterrupt() {}
              override fun onDestroy() {
                  isPolling = false
                  mainHandler.removeCallbacks(pollRunnable)
                  runCatching { unregisterReceiver(dynamicReceiver) }
                  super.onDestroy()
              }
          }
          // Engine 2: Standalone UsageStats Foreground Service (Ensures locking works on reboot & even if Accessibility is off!)
          class NowLockMonitorService : Service() {
              private val handler = Handler(Looper.getMainLooper())
              private var isRunning = false
              private val pollRunnable = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      runCatching {
                          val (latestPkg, latestCls) = pollTopPackageViaUsageStats(this@NowLockMonitorService)
                          if (latestPkg.isNotEmpty() && !(latestPkg == packageName && latestCls.contains("LockScreenActivity"))) {
                              if (AppRepo.evaluateForegroundPackage(latestPkg, packageName)) {
                                  AppRepo.launchLockScreenIfNeeded(this@NowLockMonitorService, latestPkg)
                              }
                          }
                      }
                      handler.postDelayed(this, 200L)
                  }
              }
              private val dynamicReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_SCREEN_OFF -> AppRepo.clearAllUnlockedSessionsOnScreenOff()
                          Intent.ACTION_PACKAGE_ADDED -> {
                              if (!intent.getBooleanExtra(Intent.EXTRA_REPLACING, false)) {
                                  val pkg = intent.data?.schemeSpecificPart ?: return
                                  NewAppNotificationHelper.showLockPromptNotification(context, pkg)
                              }
                          }
                      }
                  }
              }
              override fun onCreate() {
                  super.onCreate()
                  AppRepo.init(this)
                  promoteToForeground()
                  runCatching {
                      registerReceiver(dynamicReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
                      val pkgFilter = IntentFilter(Intent.ACTION_PACKAGE_ADDED).apply { addDataScheme("package") }
                      registerReceiver(dynamicReceiver, pkgFilter)
                  }
                  isRunning = true
                  handler.post(pollRunnable)
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  AppRepo.init(this)
                  promoteToForeground()
                  if (!isRunning) {
                      isRunning = true
                      handler.post(pollRunnable)
                  }
                  return START_STICKY
              }
              private fun promoteToForeground() {
                  try {
                      val channelId = "nowlock_guard_channel"
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val channel = NotificationChannel(
                              channelId,
                              "NowLock Guard",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              setShowBadge(false)
                          }
                          nm.createNotificationChannel(channel)
                      }
                      val s = getStrings(AppRepo.getAppLang())
                      val pendingIntent = PendingIntent.getActivity(
                          this,
                          0,
                          Intent(this, MainActivity::class.java),
                          PendingIntent.FLAG_IMMUTABLE
                      )
                      val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          Notification.Builder(this, channelId)
                              .setContentTitle("NowLock")
                              .setContentText(s.statusActive)
                              .setSmallIcon(R.drawable.ic_nowlock_logo)
                              .setContentIntent(pendingIntent)
                              .setOngoing(true)
                              .build()
                      } else {
                          @Suppress("DEPRECATION")
                          Notification.Builder(this)
                              .setContentTitle("NowLock")
                              .setContentText(s.statusActive)
                              .setSmallIcon(R.drawable.ic_nowlock_logo)
                              .setContentIntent(pendingIntent)
                              .setOngoing(true)
                              .build()
                      }
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(1001, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                      } else {
                          startForeground(1001, notification)
                      }
                  } catch (t: Throwable) {
                      runCatching { stopSelf() }
                  }
              }
              override fun onDestroy() {
                  isRunning = false
                  handler.removeCallbacks(pollRunnable)
                  runCatching { unregisterReceiver(dynamicReceiver) }
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null
              companion object {
                  fun startServiceSafely(ctx: Context) {
                      runCatching {
                          val intent = Intent(ctx, NowLockMonitorService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              ctx.startForegroundService(intent)
                          } else {
                              ctx.startService(intent)
                          }
                      }
                  }
              }
          }
          class BootStartupReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  AppRepo.init(context)
                  NowLockMonitorService.startServiceSafely(context)
              }
          }
