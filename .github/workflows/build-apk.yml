          // Instant Overlay Lock Bridge (Attaches a visible SYSTEM_ALERT_WINDOW shield in 0ms so Android 14/15 ALWAYS allows LockScreenActivity to launch over third-party apps!)
          object OverlayLockBridge {
              private val mainHandler = Handler(Looper.getMainLooper())
              private var shieldView: FrameLayout? = null
              private var isShieldAttached = false
              fun showShieldAndLaunchLockActivity(ctx: Context, targetPkg: String) {
                  mainHandler.post {
                      val appCtx = ctx.applicationContext
                      if (Settings.canDrawOverlays(appCtx) && !isShieldAttached && !LockScreenActivity.isShowing) {
                          runCatching {
                              val wm = appCtx.getSystemService(Context.WINDOW_SERVICE) as? WindowManager
                              if (wm != null) {
                                  val isDark = AppRepo.isDarkEffective(appCtx)
                                  val bgColor = if (isDark) android.graphics.Color.parseColor("#181856") else android.graphics.Color.parseColor("#F2F3F9")
                                  val txtColor = if (isDark) android.graphics.Color.WHITE else android.graphics.Color.parseColor("#1C1E26")
                                  val dp = appCtx.resources.displayMetrics.density
                                  val root = FrameLayout(appCtx).apply {
                                      setBackgroundColor(bgColor)
                                      val col = LinearLayout(appCtx).apply {
                                          orientation = LinearLayout.VERTICAL
                                          gravity = Gravity.CENTER
                                          val img = ImageView(appCtx).apply {
                                              setImageResource(R.drawable.ic_nowlock_logo)
                                          }
                                          addView(img, LinearLayout.LayoutParams((76 * dp).toInt(), (76 * dp).toInt()))
                                          val title = TextView(appCtx).apply {
                                              text = "NowLock"
                                              textSize = 22f
                                              setTextColor(txtColor)
                                              gravity = Gravity.CENTER
                                              setPadding(0, (14 * dp).toInt(), 0, (18 * dp).toInt())
                                          }
                                          addView(title)
                                          val btn = AndroidButton(appCtx).apply {
                                              val s = getStrings(AppRepo.getAppLang())
                                              text = if (AppRepo.getComboMode() == LockComboMode.PATTERN_FINGERPRINT) s.lockPromptPattern else s.lockPromptPin
                                              setOnClickListener {
                                                  startLockActivityNow(appCtx, targetPkg)
                                              }
                                          }
                                          addView(btn, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                                      }
                                      addView(col, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT, Gravity.CENTER))
                                      setOnClickListener {
                                          startLockActivityNow(appCtx, targetPkg)
                                      }
                                  }
                                  val lp = WindowManager.LayoutParams(
                                      WindowManager.LayoutParams.MATCH_PARENT,
                                      WindowManager.LayoutParams.MATCH_PARENT,
                                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                                      PixelFormat.OPAQUE
                                  )
                                  wm.addView(root, lp)
                                  shieldView = root
                                  isShieldAttached = true
                              }
                          }
                      }
                      // Launch LockScreenActivity immediately (while our TYPE_APPLICATION_OVERLAY window is visible on screen, bypassing Android 14/15 BAL restrictions!)
                      startLockActivityNow(appCtx, targetPkg)
                      mainHandler.postDelayed({
                          if (!LockScreenActivity.isShowing && isShieldAttached) {
                              startLockActivityNow(appCtx, targetPkg)
                          }
                      }, 120L)
                  }
              }
              private fun startLockActivityNow(ctx: Context, targetPkg: String) {
                  val intent = Intent(ctx, LockScreenActivity::class.java).apply {
                      addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK or
                          Intent.FLAG_ACTIVITY_CLEAR_TOP or
                          Intent.FLAG_ACTIVITY_SINGLE_TOP or
                          Intent.FLAG_ACTIVITY_NO_ANIMATION or
                          Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS
                      )
                      putExtra("target_pkg", targetPkg)
                  }
                  runCatching {
                      val pi = PendingIntent.getActivity(
                          ctx,
                          targetPkg.hashCode(),
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      pi.send()
                  }
                  runCatching { ctx.startActivity(intent) }
              }
              fun dismissShield(ctx: Context) {
                  mainHandler.post {
                      val v = shieldView ?: return@post
                      if (isShieldAttached) {
                          runCatching {
                              val wm = ctx.applicationContext.getSystemService(Context.WINDOW_SERVICE) as? WindowManager
                              wm?.removeViewImmediate(v)
                          }
                      }
                      isShieldAttached = false
                      shieldView = null
                  }
              }
          }
          // Real Silent Front-Camera Intruder Photo Saver -> Saves directly to Phone Gallery (Pictures/NowLock_Intruders)
          object IntruderPhotoSaver {
              fun captureFrontCameraToGallery(context: Context, targetPkg: String) {
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      return
                  }
                  val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as? CameraManager ?: return
                  val frontCameraId = runCatching {
                      cameraManager.cameraIdList.firstOrNull { id ->
                          val chars = cameraManager.getCameraCharacteristics(id)
                          chars.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_FRONT
                      } ?: cameraManager.cameraIdList.firstOrNull()
                  }.getOrNull() ?: return
                  val bgThread = HandlerThread("NowLockIntruderCam").apply { start() }
                  val bgHandler = Handler(bgThread.looper)
                  runCatching {
                      val imageReader = ImageReader.newInstance(640, 480, ImageFormat.JPEG, 2)
                      val dummyTexture = SurfaceTexture(10).apply { setDefaultBufferSize(640, 480) }
                      val dummySurface = Surface(dummyTexture)
                      imageReader.setOnImageAvailableListener({ reader ->
                          val image = runCatching { reader.acquireLatestImage() }.getOrNull()
                          if (image != null) {
                              runCatching {
                                  val buffer = image.planes[0].buffer
                                  val bytes = ByteArray(buffer.remaining())
                                  buffer.get(bytes)
                                  saveJpegBytesToGallery(context, bytes, targetPkg)
                              }
                              runCatching { image.close() }
                          }
                          runCatching { dummySurface.release() }
                          runCatching { dummyTexture.release() }
                          runCatching { reader.close() }
                          runCatching { bgThread.quitSafely() }
                      }, bgHandler)
                      cameraManager.openCamera(frontCameraId, object : CameraDevice.StateCallback() {
                          override fun onOpened(camera: CameraDevice) {
                              runCatching {
                                  val targets = listOf(dummySurface, imageReader.surface)
                                  @Suppress("DEPRECATION")
                                  camera.createCaptureSession(targets, object : CameraCaptureSession.StateCallback() {
                                      override fun onConfigured(session: CameraCaptureSession) {
                                          runCatching {
                                              val previewReq = camera.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW).apply {
                                                  addTarget(dummySurface)
                                                  set(CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                                                  set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)
                                              }.build()
                                              session.setRepeatingRequest(previewReq, null, bgHandler)
                                              bgHandler.postDelayed({
                                                  runCatching {
                                                      val stillReq = camera.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE).apply {
                                                          addTarget(imageReader.surface)
                                                          set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)
                                                          set(CaptureRequest.JPEG_ORIENTATION, 270)
                                                      }.build()
                                                      session.capture(stillReq, object : CameraCaptureSession.CaptureCallback() {
                                                          override fun onCaptureCompleted(
                                                              s: CameraCaptureSession,
                                                              r: CaptureRequest,
                                                              res: android.hardware.camera2.TotalCaptureResult
                                                          ) {
                                                              bgHandler.postDelayed({ runCatching { camera.close() } }, 150L)
                                                          }
                                                      }, bgHandler)
                                                  }.onFailure { runCatching { camera.close() } }
                                              }, 350L)
                                          }.onFailure { runCatching { camera.close() } }
                                      }
                                      override fun onConfigureFailed(session: CameraCaptureSession) {
                                          runCatching { camera.close() }
                                          runCatching { bgThread.quitSafely() }
                                      }
                                  }, bgHandler)
                              }.onFailure {
                                  runCatching { camera.close() }
                                  runCatching { bgThread.quitSafely() }
                              }
                          }
                          override fun onDisconnected(camera: CameraDevice) {
                              runCatching { camera.close() }
                              runCatching { bgThread.quitSafely() }
                          }
                          override fun onError(camera: CameraDevice, error: Int) {
                              runCatching { camera.close() }
                              runCatching { bgThread.quitSafely() }
                          }
                      }, bgHandler)
                  }.onFailure {
                      runCatching { bgThread.quitSafely() }
                  }
              }
              private fun saveJpegBytesToGallery(context: Context, jpegBytes: ByteArray, targetPkg: String) {
                  val originalBmp = BitmapFactory.decodeByteArray(jpegBytes, 0, jpegBytes.size) ?: return
                  val finalBmp = if (originalBmp.width > originalBmp.height) {
                      val matrix = Matrix().apply { postRotate(270f) }
                      Bitmap.createBitmap(originalBmp, 0, 0, originalBmp.width, originalBmp.height, matrix, true)
                  } else {
                      originalBmp
                  }
                  val timestamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val filename = "NowLock_Intruder_${timestamp}.jpg"
                  val resolver = context.contentResolver
                  val contentValues = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, filename)
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      put(MediaStore.Images.Media.TITLE, "NowLock Intruder ($targetPkg)")
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/NowLock_Intruders")
                          put(MediaStore.Images.Media.IS_PENDING, 1)
                      }
                  }
                  val imageUri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, contentValues) ?: return
                  var outStream: OutputStream? = null
                  runCatching {
                      outStream = resolver.openOutputStream(imageUri)
                      outStream?.let { finalBmp.compress(Bitmap.CompressFormat.JPEG, 92, it) }
                  }
                  runCatching { outStream?.close() }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val updateValues = ContentValues().apply {
                          put(MediaStore.Images.Media.IS_PENDING, 0)
                      }
                      runCatching { resolver.update(imageUri, updateValues, null, null) }
                  }
              }
          }
