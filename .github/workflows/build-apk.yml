              fun applyLauncherAliasesState(ctx: Context) {
                  val pm = ctx.packageManager
                  val defaultAlias = ComponentName(ctx, "io.nowlock.app.LauncherDefaultAlias")
                  val calcAlias = ComponentName(ctx, "io.nowlock.app.LauncherCalculatorAlias")
                  if (isLauncherHidden()) {
                      // Both launcher aliases disabled + MainActivity is exported=false -> 0 exported launcher activities, so icon 100% vanishes from launcher!
                      pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                      pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                  } else {
                      val mode = getIconMode()
                      if (mode == AppIconMode.PADLOCK) {
                          pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
                          pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                      } else {
                          pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
                          pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                      }
                  }
              }
              fun toggleAppLock(pkg: String, lock: Boolean) {
                  reloadLockedPackagesFromPrefs()
                  if (lock) {
                      lockedMemorySet.add(pkg)
                      unlockedSession.remove(pkg)
                      unlockTimestamps.remove(pkg)
                  } else {
                      lockedMemorySet.remove(pkg)
                      unlockedSession.remove(pkg)
                      unlockTimestamps.remove(pkg)
                  }
                  val csv = lockedMemorySet.joinToString(",")
                  prefs.edit()
                      .putString(KEY_LOCKED_PKGS_CSV, csv)
                      .putStringSet(KEY_LOCKED_PKGS, HashSet(lockedMemorySet))
