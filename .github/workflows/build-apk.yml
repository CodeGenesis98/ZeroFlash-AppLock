              fsh.write(lzma.decompress(base64.b64decode("".join(SHIELD_3D_XZ_B64.split()))))
          with open("app/src/main/res/drawable-nodpi/ic_nowlock_capsule_3d.png", "wb") as fcap:
              fcap.write(lzma.decompress(base64.b64decode("".join(CAPSULE_3D_XZ_B64.split()))))
          # Extract and write the 4 modular Kotlin source files for parallel Gradle compilation (~20% faster build!)
          pkg_dir = "app/src/main/java/io/nowlock/app"
          os.makedirs(pkg_dir, exist_ok=True)
          unified_src = lzma.decompress(base64.b64decode(KT_XZ_B64.encode("ascii"))).decode("utf-8")
          parts = re.split(r"// === NOWLOCK_MODULE: ([A-Za-z0-9_.]+) ===\n", unified_src)
          shared_hdr = parts[0].rstrip()
          for idx in range(1, len(parts), 2):
              mod_filename = parts[idx].strip()
              mod_body = parts[idx + 1].strip()
              mod_path = os.path.join(pkg_dir, mod_filename)
              with open(mod_path, "w", encoding="utf-8") as mf:
                  mf.write(shared_hdr + "\n\n" + mod_body + "\n")
          print("NowLock v0.1.0 modular 4-file project (SecurityEngine.kt, LockServices.kt, ThemeAndStrings.kt, MainActivityUi.kt) generated cleanly!")
      - name: Compile Optimized Release APK with JDK 17, Android 16 (API 36) & Verified Gradle 8.7
        env:
          KEYSTORE_PATH: nowlock_signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip.sha256 -o /tmp/gradle-8.7.sha256
            echo "$(cat /tmp/gradle-8.7.sha256)  /tmp/gradle-8.7.zip" | sha256sum -c -
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --parallel --no-daemon --no-build-cache --console=plain
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'RELNOTES' > /tmp/release_notes.md
          ## 🛡️ NowLock v0.1.0 (Beta) — Complete UI Redesign, Private PeekGuard Vault & 4-File Modular Architecture

          **Your digital privacy deserves uncompromising protection that feels clean, modern, and effortless.**
          Engineered from the ground up with **100% Native Kotlin**, **Jetpack Compose**, and **Material 3**, **NowLock v0.1.0** introduces a complete visual and structural overhaul, a built-in private **PeekGuard** photo viewer, a **3D Holographic Wireframe Heartbeat Shield**, and a **Horizontal 3D Smoked-Glass Capsule Health Bar**.

          ### 🚀 What's New in NowLock v0.1.0 (Beta)

          - ✨ **Complete Material 3 UI Overhaul**
            Rebuilt all application screens from scratch with clean grouped containers, generous breathing room, indented hairline dividers, and a clutter-free visual hierarchy across Light, Dark, and pure AMOLED modes.

          - 🛡️ **3D Holographic Wireframe Heartbeat Shield & Smoked-Glass Capsule Bar**
            Redesigned security dashboard featuring a 4-quadrant 3D wireframe shield with a calm human-heartbeat pulse and X-crossed orbital energy ribbons, paired with a horizontal 3D smoked-glass liquid capsule bar.

          - 🖼️ **Built-In Private PeekGuard Vault Viewer**
            Intruder photos are now encrypted with `AES-256-GCM` exclusively inside the app's private storage and displayed directly inside the Security Report tab with single-tap deletion—zero public gallery leaks.

          - ⚡ **4-File Modular Architecture & Instant Performance**
            Split the codebase into 4 dedicated modules (`SecurityEngine.kt`, `LockServices.kt`, `ThemeAndStrings.kt`, `MainActivityUi.kt`) for faster parallel Gradle builds, instant Frame-0 app list loading, and seamless PIN/Pattern and Decoy switching.
          RELNOTES
          if gh release view v0.1.0-nowlock --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v0.1.0-nowlock NowLock.apk --clobber --repo "${{ github.repository }}"
            gh release edit v0.1.0-nowlock --repo "${{ github.repository }}" --title "🛡️ NowLock v0.1.0 (Beta) — Complete UI Redesign, Private PeekGuard Vault & Modular Engine" --notes-file /tmp/release_notes.md
          else
            gh release create v0.1.0-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "🛡️ NowLock v0.1.0 (Beta) — Complete UI Redesign, Private PeekGuard Vault & Modular Engine" --notes-file /tmp/release_notes.md
          fi
