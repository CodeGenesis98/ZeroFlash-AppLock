// Per-Character Soft Pastel RGB Animated Typography for "NowLock"
private val SOFT_RGB_PALETTE = listOf(
    Color(0xFF67E8F9),
    Color(0xFF818CF8),
    Color(0xFFC084FC),
    Color(0xFFF472B6),
    Color(0xFFFBBF24),
    Color(0xFF5EEAD4)
)
private fun sampleSmoothRgbPalette(position: Float): Color {
    val size = SOFT_RGB_PALETTE.size
    val pos = ((position % 1f) + 1f) % 1f * size
    val idx = floor(pos).toInt() % size
    val nextIdx = (idx + 1) % size
    val frac = pos - floor(pos)
    return lerp(SOFT_RGB_PALETTE[idx], SOFT_RGB_PALETTE[nextIdx], frac)
}
@Composable
fun AnimatedRgbBrandText(
    text: String,
    fontSize: TextUnit,
    modifier: Modifier = Modifier
) {
    val infiniteTransition = rememberInfiniteTransition(label = "nowlockRgbWave")
    val phase by infiniteTransition.animateFloat(
        initialValue = 0f,
        targetValue = 1f,
        animationSpec = infiniteRepeatable(
            animation = tween(durationMillis = 5200, easing = LinearEasing),
            repeatMode = RepeatMode.Restart
        ),
        label = "rgbWavePhase"
    )
    val annotated = buildAnnotatedString {
        text.forEachIndexed { idx, ch ->
            val charColor = sampleSmoothRgbPalette(phase + idx * 0.11f)
            withStyle(
                SpanStyle(
                    color = charColor,
                    fontSize = fontSize,
                    fontWeight = FontWeight.ExtraBold,
                    fontFamily = FontFamily.SansSerif,
                    letterSpacing = 1.1.sp
                )
            ) {
                append(ch)
            }
        }
    }
    Text(
        text = annotated,
        modifier = modifier
    )
}
