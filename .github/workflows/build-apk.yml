          // Helper to configure Notch / Display Cutout & Translucent Visible Status Bar
          fun configureNotchAndStatusBar(activity: Activity, isDark: Boolean) {
              val window = activity.window
              WindowCompat.setDecorFitsSystemWindows(window, false)
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                  window.attributes = window.attributes.apply {
                      layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
              }
              window.statusBarColor = android.graphics.Color.TRANSPARENT
              window.navigationBarColor = android.graphics.Color.TRANSPARENT
              val controller = WindowInsetsControllerCompat(window, window.decorView)
              controller.isAppearanceLightStatusBars = !isDark
              controller.isAppearanceLightNavigationBars = !isDark
          }
          // Real Silent Front-Camera Intruder Photo Saver -> Saves directly to Phone Gallery (Pictures/NowLock_Intruders)
          object IntruderPhotoSaver {
              fun captureFrontCameraToGallery(context: Context, targetPkg: String) {
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      return
                  }
                  val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as? CameraManager ?: return
                  val frontCameraId = runCatching {
                      cameraManager.cameraIdList.firstOrNull { id ->
                          val chars = cameraManager.getCameraCharacteristics(id)
                          chars.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_FRONT
                      } ?: cameraManager.cameraIdList.firstOrNull()
                  }.getOrNull() ?: return
                  val bgThread = HandlerThread("NowLockIntruderCam").apply { start() }
                  val bgHandler = Handler(bgThread.looper)
                  runCatching {
                      val imageReader = ImageReader.newInstance(640, 480, ImageFormat.JPEG, 2)
                      val dummyTexture = SurfaceTexture(10).apply { setDefaultBufferSize(640, 480) }
                      val dummySurface = Surface(dummyTexture)
                      imageReader.setOnImageAvailableListener({ reader ->
                          val image = runCatching { reader.acquireLatestImage() }.getOrNull()
                          if (image != null) {
                              runCatching {
                                  val buffer = image.planes[0].buffer
                                  val bytes = ByteArray(buffer.remaining())
                                  buffer.get(bytes)
                                  saveJpegBytesToGallery(context, bytes, targetPkg)
                              }
                              runCatching { image.close() }
                          }
                          runCatching { dummySurface.release() }
                          runCatching { dummyTexture.release() }
                          runCatching { reader.close() }
                          runCatching { bgThread.quitSafely() }
                      }, bgHandler)
                      cameraManager.openCamera(frontCameraId, object : CameraDevice.StateCallback() {
                          override fun onOpened(camera: CameraDevice) {
                              runCatching {
                                  val targets = listOf(dummySurface, imageReader.surface)
                                  @Suppress("DEPRECATION")
                                  camera.createCaptureSession(targets, object : CameraCaptureSession.StateCallback() {
                                      override fun onConfigured(session: CameraCaptureSession) {
                                          runCatching {
                                              val previewReq = camera.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW).apply {
                                                  addTarget(dummySurface)
                                                  set(CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                                                  set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)
                                              }.build()
                                              session.setRepeatingRequest(previewReq, null, bgHandler)
                                              // Wait 350ms for front camera auto-exposure to settle, then snap photo
                                              bgHandler.postDelayed({
                                                  runCatching {
                                                      val stillReq = camera.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE).apply {
                                                          addTarget(imageReader.surface)
                                                          set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)
                                                          set(CaptureRequest.JPEG_ORIENTATION, 270)
                                                      }.build()
                                                      session.capture(stillReq, object : CameraCaptureSession.CaptureCallback() {
                                                          override fun onCaptureCompleted(
                                                              s: CameraCaptureSession,
                                                              r: CaptureRequest,
                                                              res: android.hardware.camera2.TotalCaptureResult
                                                          ) {
                                                              bgHandler.postDelayed({ runCatching { camera.close() } }, 150L)
                                                          }
                                                      }, bgHandler)
                                                  }.onFailure { runCatching { camera.close() } }
                                              }, 350L)
                                          }.onFailure { runCatching { camera.close() } }
                                      }
                                      override fun onConfigureFailed(session: CameraCaptureSession) {
                                          runCatching { camera.close() }
                                          runCatching { bgThread.quitSafely() }
                                      }
                                  }, bgHandler)
                              }.onFailure {
                                  runCatching { camera.close() }
                                  runCatching { bgThread.quitSafely() }
                              }
                          }
                          override fun onDisconnected(camera: CameraDevice) {
                              runCatching { camera.close() }
                              runCatching { bgThread.quitSafely() }
                          }
                          override fun onError(camera: CameraDevice, error: Int) {
                              runCatching { camera.close() }
                              runCatching { bgThread.quitSafely() }
                          }
                      }, bgHandler)
                  }.onFailure {
                      runCatching { bgThread.quitSafely() }
                  }
              }
              private fun saveJpegBytesToGallery(context: Context, jpegBytes: ByteArray, targetPkg: String) {
                  val originalBmp = BitmapFactory.decodeByteArray(jpegBytes, 0, jpegBytes.size) ?: return
                  // Ensure upright portrait orientation if needed
                  val finalBmp = if (originalBmp.width > originalBmp.height) {
                      val matrix = Matrix().apply { postRotate(270f) }
                      Bitmap.createBitmap(originalBmp, 0, 0, originalBmp.width, originalBmp.height, matrix, true)
                  } else {
                      originalBmp
                  }
                  val timestamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val filename = "NowLock_Intruder_${timestamp}.jpg"
                  val resolver = context.contentResolver
                  val contentValues = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, filename)
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      put(MediaStore.Images.Media.TITLE, "NowLock Intruder ($targetPkg)")
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/NowLock_Intruders")
                          put(MediaStore.Images.Media.IS_PENDING, 1)
                      }
                  }
                  val imageUri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, contentValues) ?: return
                  var outStream: OutputStream? = null
                  runCatching {
                      outStream = resolver.openOutputStream(imageUri)
                      outStream?.let { finalBmp.compress(Bitmap.CompressFormat.JPEG, 92, it) }
                  }
                  runCatching { outStream?.close() }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val updateValues = ContentValues().apply {
                          put(MediaStore.Images.Media.IS_PENDING, 0)
                      }
                      runCatching { resolver.update(imageUri, updateValues, null, null) }
                  }
              }
          }
          object AppRepo {
              private const val PREFS_NAME = "nowlock_v65_prefs"
              private const val KEY_PIN_HASH = "nowlock_pin_hash"
              private const val KEY_PATTERN_HASH = "nowlock_pattern_hash"
              private const val KEY_COMBO_MODE = "nowlock_combo_mode"
              private const val KEY_FINGERPRINT_ENABLED = "nowlock_fp_enabled"
              private const val KEY_ICON_MODE = "nowlock_icon_mode"
              private const val KEY_RELOCK_MINUTES = "nowlock_relock_minutes"
              private const val KEY_LOCKED_PKGS = "nowlock_locked_pkgs"
              private const val KEY_THEME_MODE = "nowlock_theme_mode"
              private const val KEY_APP_LANG = "nowlock_app_lang"
              private const val KEY_VIBRATE = "nowlock_vibrate_on_error"
              private const val KEY_INTRUDER = "nowlock_intruder_selfie"
              private const val KEY_INTRUDER_COUNT = "nowlock_intruder_count"
              private const val KEY_UNINSTALL = "nowlock_uninstall_protect"
              private const val KEY_FIRST_RUN_PERM_ASKED = "nowlock_first_perm_asked"
              private lateinit var prefs: SharedPreferences
              val unlockedSession = ConcurrentHashMap.newKeySet<String>()
              val unlockTimestamps = ConcurrentHashMap<String, Long>()
              @Volatile var lastActivePackage: String = ""
              @Volatile var lastLockShownTime: Long = 0L
              fun init(ctx: Context) {
                  if (!::prefs.isInitialized) {
                      prefs = ctx.applicationContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  }
              }
              fun isFirstRunPermAsked(): Boolean = prefs.getBoolean(KEY_FIRST_RUN_PERM_ASKED, false)
              fun setFirstRunPermAsked() = prefs.edit().putBoolean(KEY_FIRST_RUN_PERM_ASKED, true).commit()
              fun getLockedPackages(): Set<String> {
                  return prefs.getStringSet(KEY_LOCKED_PKGS, emptySet()) ?: emptySet()
              }
              fun isPinSet(): Boolean = prefs.getString(KEY_PIN_HASH, null) != null
              fun isPatternSet(): Boolean = prefs.getString(KEY_PATTERN_HASH, null) != null
              fun isAnyPasswordSet(): Boolean = isPinSet() || isPatternSet()
              fun setPin(pin: String) {
                  prefs.edit().putString(KEY_PIN_HASH, sha256("pin_" + pin)).commit()
              }
              fun verifyPin(pin: String): Boolean {
                  val saved = prefs.getString(KEY_PIN_HASH, null) ?: return false
                  return sha256("pin_" + pin) == saved
              }
              fun setPattern(patternStr: String) {
                  prefs.edit().putString(KEY_PATTERN_HASH, sha256("pat_" + patternStr)).commit()
              }
              fun verifyPattern(patternStr: String): Boolean {
                  val saved = prefs.getString(KEY_PATTERN_HASH, null) ?: return false
                  return sha256("pat_" + patternStr) == saved
              }
              fun getComboMode(): LockComboMode =
                  runCatching {
                      LockComboMode.valueOf(prefs.getString(KEY_COMBO_MODE, LockComboMode.PIN_FINGERPRINT.name) ?: LockComboMode.PIN_FINGERPRINT.name)
                  }.getOrDefault(LockComboMode.PIN_FINGERPRINT)
              fun setComboMode(m: LockComboMode) {
                  prefs.edit().putString(KEY_COMBO_MODE, m.name).commit()
              }
              fun isFingerprintEnabled(): Boolean = prefs.getBoolean(KEY_FINGERPRINT_ENABLED, true)
              fun setFingerprintEnabled(enabled: Boolean) {
                  prefs.edit().putBoolean(KEY_FINGERPRINT_ENABLED, enabled).commit()
              }
              fun getRelockDelayMinutes(): Int = prefs.getInt(KEY_RELOCK_MINUTES, 0)
              fun setRelockDelayMinutes(minutes: Int) {
                  prefs.edit().putInt(KEY_RELOCK_MINUTES, minutes).commit()
              }
              fun getIconMode(): AppIconMode =
                  runCatching {
                      AppIconMode.valueOf(prefs.getString(KEY_ICON_MODE, AppIconMode.PADLOCK.name) ?: AppIconMode.PADLOCK.name)
                  }.getOrDefault(AppIconMode.PADLOCK)
              fun setIconMode(ctx: Context, mode: AppIconMode) {
                  prefs.edit().putString(KEY_ICON_MODE, mode.name).commit()
                  val pm = ctx.packageManager
                  val defaultAlias = ComponentName(ctx, "io.nowlock.app.LauncherDefaultAlias")
                  val calcAlias = ComponentName(ctx, "io.nowlock.app.LauncherCalculatorAlias")
                  if (mode == AppIconMode.PADLOCK) {
                      pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
                      pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                  } else {
                      pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
                      pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                  }
              }
              fun toggleAppLock(pkg: String, lock: Boolean) {
                  val current = getLockedPackages().toMutableSet()
                  if (lock) {
                      current.add(pkg)
                  } else {
                      current.remove(pkg)
                      unlockedSession.remove(pkg)
                      unlockTimestamps.remove(pkg)
                  }
                  prefs.edit().putStringSet(KEY_LOCKED_PKGS, current).commit()
              }
              fun markUnlocked(pkg: String) {
                  val now = System.currentTimeMillis()
                  unlockedSession.add(pkg)
                  unlockTimestamps[pkg] = now
                  prefs.edit().putLong("unlock_ts_$pkg", now).commit()
                  lastActivePackage = pkg
              }
              fun isWithinGracePeriod(pkg: String): Boolean {
                  val delayMin = getRelockDelayMinutes()
                  if (delayMin <= 0) {
                      return unlockedSession.contains(pkg)
                  }
                  val windowMs = delayMin * 60_000L
                  val lastTs = unlockTimestamps[pkg] ?: prefs.getLong("unlock_ts_$pkg", 0L)
                  if (lastTs <= 0L) return false
                  val valid = (System.currentTimeMillis() - lastTs) < windowMs
                  if (!valid) {
                      unlockedSession.remove(pkg)
                      unlockTimestamps.remove(pkg)
                  }
                  return valid
              }
              fun clearAllUnlockedSessionsOnScreenOff() {
                  if (getRelockDelayMinutes() <= 0) {
                      unlockedSession.clear()
                      unlockTimestamps.clear()
                      lastActivePackage = ""
                  }
              }
              // Evaluates whether a foreground package should be intercepted by the Lock Screen
              fun evaluateForegroundPackage(pkg: String, myPkg: String): Boolean {
                  if (pkg.isBlank()) return false
                  if (pkg.contains("systemui") || pkg.contains("inputmethod") || pkg.contains("keyboard") || pkg.contains("biometric") || pkg.contains("permissioncontroller")) {
                      return false
                  }
                  if (!isAnyPasswordSet()) return false
                  val delayMin = getRelockDelayMinutes()
                  // If user switched to another app or launcher
                  if (pkg != lastActivePackage && lastActivePackage.isNotEmpty()) {
                      val isHomeOrLauncher = pkg.contains("launcher") || pkg.contains("home") || pkg.contains("miui.home") || pkg.contains("sec.android.app.launcher")
                      if (delayMin <= 0) {
                          // Immediate relock mode: leaving the app or going to Home immediately relocks it
                          if (isHomeOrLauncher) {
                              unlockedSession.clear()
                          } else if (pkg != myPkg) {
                              unlockedSession.remove(lastActivePackage)
                          }
                      } else {
                          // Timed delay mode (2, 4, 6, 10 minutes): refresh exit timestamp so the timer counts for the full window
                          if (unlockedSession.contains(lastActivePackage)) {
                              val now = System.currentTimeMillis()
                              unlockTimestamps.putIfAbsent(lastActivePackage, now)
                          }
                      }
                  }
                  lastActivePackage = pkg
                  // Do not intercept LockScreenActivity itself if pkg == myPkg and LockScreenActivity is already showing
                  if (pkg == myPkg && LockScreenActivity.isShowing) {
                      return false
                  }
                  // Guard package installer / uninstaller when Uninstall Protection is enabled
                  if (isUninstallProtectionEnabled() && (pkg.contains("packageinstaller") || pkg.contains("uninstaller"))) {
                      return !isWithinGracePeriod(pkg)
                  }
                  val lockedSet = getLockedPackages()
                  if (!lockedSet.contains(pkg)) return false
                  return !isWithinGracePeriod(pkg)
              }
              fun launchLockScreenIfNeeded(ctx: Context, targetPkg: String) {
                  val now = System.currentTimeMillis()
                  if (now - lastLockShownTime < 350L && LockScreenActivity.activeTargetPkg == targetPkg && LockScreenActivity.isShowing) {
                      return
                  }
                  lastLockShownTime = now
                  val intent = Intent(ctx, LockScreenActivity::class.java).apply {
                      addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK or
                          Intent.FLAG_ACTIVITY_CLEAR_TOP or
                          Intent.FLAG_ACTIVITY_SINGLE_TOP or
                          Intent.FLAG_ACTIVITY_NO_ANIMATION or
                          Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS
                      )
                      putExtra("target_pkg", targetPkg)
                  }
                  runCatching { ctx.startActivity(intent) }
              }
              fun isVibrationEnabled(): Boolean = prefs.getBoolean(KEY_VIBRATE, true)
              fun setVibrationEnabled(v: Boolean) = prefs.edit().putBoolean(KEY_VIBRATE, v).commit()
              fun isIntruderSelfieEnabled(): Boolean = prefs.getBoolean(KEY_INTRUDER, true)
              fun setIntruderSelfieEnabled(v: Boolean) = prefs.edit().putBoolean(KEY_INTRUDER, v).commit()
              fun recordIntruderAttempt(ctx: Context, targetPkg: String) {
                  val c = prefs.getInt(KEY_INTRUDER_COUNT, 0) + 1
                  prefs.edit().putInt(KEY_INTRUDER_COUNT, c).commit()
                  IntruderPhotoSaver.captureFrontCameraToGallery(ctx.applicationContext, targetPkg)
              }
              fun getIntruderCount(): Int = prefs.getInt(KEY_INTRUDER_COUNT, 0)
              fun isUninstallProtectionEnabled(): Boolean = prefs.getBoolean(KEY_UNINSTALL, false)
              fun setUninstallProtectionEnabled(v: Boolean) = prefs.edit().putBoolean(KEY_UNINSTALL, v).commit()
              fun getThemeMode(): ThemeMode =
                  runCatching { ThemeMode.valueOf(prefs.getString(KEY_THEME_MODE, ThemeMode.SYSTEM.name) ?: ThemeMode.SYSTEM.name) }.getOrDefault(ThemeMode.SYSTEM)
              fun setThemeMode(m: ThemeMode) = prefs.edit().putString(KEY_THEME_MODE, m.name).commit()
              fun isPersian(): Boolean = prefs.getString(KEY_APP_LANG, "FA") == "FA"
              fun setPersian(isFa: Boolean) = prefs.edit().putString(KEY_APP_LANG, if (isFa) "FA" else "EN").commit()
              fun triggerShortVibration(ctx: Context, durationMs: Long = 55L) {
                  if (!isVibrationEnabled()) return
                  val vib = ctx.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vib.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      @Suppress("DEPRECATION")
                      vib.vibrate(durationMs)
                  }
              }
              private fun sha256(s: String): String =
                  MessageDigest.getInstance("SHA-256").digest(("nowlock_v65_salt_" + s).toByteArray()).joinToString("") { "%02x".format(it) }
          }
          fun isAccessibilityServiceEnabled(context: Context): Boolean {
              val expected = ComponentName(context, NowLockAccessibilityService::class.java).flattenToString()
              val enabledServices = Settings.Secure.getString(context.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
              val splitter = TextUtils.SimpleStringSplitter(':')
              splitter.setString(enabledServices)
              while (splitter.hasNext()) {
                  val component = splitter.next()
                  if (component.equals(expected, ignoreCase = true)) return true
              }
              return false
          }
          fun isUsageStatsPermissionGranted(context: Context): Boolean {
              val appOps = context.getSystemService(Context.APP_OPS_SERVICE) as? AppOpsManager ?: return false
              val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                  appOps.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), context.packageName)
              } else {
                  @Suppress("DEPRECATION")
                  appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), context.packageName)
              }
              return mode == AppOpsManager.MODE_ALLOWED
          }
          // Composable Translucent Faded/Blurred Status Bar & Notch Overlay
          @Composable
          fun NotchTranslucentStatusBarOverlay(isDark: Boolean) {
              val overlayBaseColor = if (isDark) Color(0xFF121212) else Color(0xFFFFFFFF)
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .windowInsetsTopHeight(WindowInsets.statusBars)
                      .background(
                          Brush.verticalGradient(
                              colors = listOf(
                                  overlayBaseColor.copy(alpha = 0.62f),
                                  overlayBaseColor.copy(alpha = 0.28f),
                                  Color.Transparent
                              )
                          )
                      )
                      .blur(radius = 8.dp)
              )
          }
          // Engine 1: Instant 0ms Accessibility Service
          class NowLockAccessibilityService : AccessibilityService() {
              private val screenOffReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == Intent.ACTION_SCREEN_OFF) {
                          AppRepo.clearAllUnlockedSessionsOnScreenOff()
                      }
                  }
              }
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  AppRepo.init(this)
                  registerReceiver(screenOffReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
                  NowLockMonitorService.startServiceIfNeeded(this)
              }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  AppRepo.init(this)
                  val pkg = event.packageName?.toString() ?: ""
                  val cls = event.className?.toString() ?: ""
                  if (pkg == packageName && cls.contains("LockScreenActivity")) return
                  if (pkg.isNotEmpty() && AppRepo.evaluateForegroundPackage(pkg, packageName)) {
                      AppRepo.launchLockScreenIfNeeded(this, pkg)
                      return
                  }
                  if (event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED) {
                      runCatching {
                          for (window in windows) {
                              val wPkg = window.root?.packageName?.toString() ?: continue
                              if (wPkg == packageName && LockScreenActivity.isShowing) continue
                              if (AppRepo.evaluateForegroundPackage(wPkg, packageName)) {
                                  AppRepo.launchLockScreenIfNeeded(this, wPkg)
                                  break
                              }
                          }
                      }
                  }
              }
              override fun onInterrupt() {}
              override fun onDestroy() {
                  runCatching { unregisterReceiver(screenOffReceiver) }
                  super.onDestroy()
              }
          }
          // Engine 2: UsageStatsManager Foreground Service Guard
          class NowLockMonitorService : Service() {
              private val handler = Handler(Looper.getMainLooper())
              private var isRunning = false
              private val pollRunnable = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      checkForegroundAppViaUsageStats()
                      handler.postDelayed(this, 220L)
                  }
              }
              private val screenReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == Intent.ACTION_SCREEN_OFF) {
                          AppRepo.clearAllUnlockedSessionsOnScreenOff()
                      }
                  }
              }
              override fun onCreate() {
                  super.onCreate()
                  AppRepo.init(this)
                  registerReceiver(screenReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
                  startForegroundNotification()
                  isRunning = true
                  handler.post(pollRunnable)
              }
              private fun startForegroundNotification() {
                  val channelId = "nowlock_guard_channel"
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "NowLock Protection Service",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          setShowBadge(false)
                          description = "Keeps NowLock active in the background"
                      }
                      nm.createNotificationChannel(channel)
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("NowLock")
                          .setContentText(if (AppRepo.isPersian()) "محافظ قفل برنامه‌ها فعال است" else "App protection is active")
                          .setSmallIcon(R.drawable.ic_nowlock_logo)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setContentTitle("NowLock")
                          .setContentText("App protection is active")
                          .setSmallIcon(R.drawable.ic_nowlock_logo)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build()
                  }
                  runCatching { startForeground(1001, notification) }
              }
              private fun checkForegroundAppViaUsageStats() {
                  if (!isUsageStatsPermissionGranted(this)) return
                  val usm = getSystemService(Context.USAGE_STATS_SERVICE) as? UsageStatsManager ?: return
                  val now = System.currentTimeMillis()
                  val events = usm.queryEvents(now - 3000L, now) ?: return
                  val event = UsageEvents.Event()
                  var latestPkg = ""
                  var latestClass = ""
                  var latestTime = 0L
                  while (events.hasNextEvent()) {
                      events.getNextEvent(event)
                      if (event.eventType == UsageEvents.Event.ACTIVITY_RESUMED ||
                          event.eventType == UsageEvents.Event.MOVE_TO_FOREGROUND
                      ) {
                          if (event.timeStamp >= latestTime) {
                              latestTime = event.timeStamp
                              latestPkg = event.packageName ?: ""
                              latestClass = event.className ?: ""
                          }
                      }
                  }
                  if (latestPkg == packageName && latestClass.contains("LockScreenActivity")) return
                  if (latestPkg.isNotEmpty() && AppRepo.evaluateForegroundPackage(latestPkg, packageName)) {
                      AppRepo.launchLockScreenIfNeeded(this, latestPkg)
                  }
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onDestroy() {
                  isRunning = false
                  handler.removeCallbacks(pollRunnable)
                  runCatching { unregisterReceiver(screenReceiver) }
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null
              companion object {
                  fun startServiceIfNeeded(ctx: Context) {
                      val intent = Intent(ctx, NowLockMonitorService::class.java)
                      runCatching {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              ctx.startForegroundService(intent)
                          } else {
                              ctx.startService(intent)
                          }
                      }
                  }
              }
          }
          class BootStartupReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  AppRepo.init(context)
                  NowLockMonitorService.startServiceIfNeeded(context)
              }
          }
          class UninstallProtectionReceiver : DeviceAdminReceiver() {
              override fun onDisableRequested(context: Context, intent: Intent): CharSequence {
                  return "NowLock: غیرفعال کردن این گزینه باعث حذف محافظ برنامه می‌شود."
              }
          }
