name: Build ZeroFlash One UI 9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Android Project & 4 Wallpapers
        run: python3 -c "import base64,lzma,io,zipfile,subprocess; zipfile.ZipFile(io.BytesIO(lzma.decompress(base64.b64decode('')))).extractall('.'); subprocess.run(['python3','gen_wp.py'],check=True); print('Project Ready!')"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Preinstalled Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ZeroFlash-OneUI9-AppLock.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroFlash-OneUI9-AppLock-APK
          path: ZeroFlash-OneUI9-AppLock.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v3.4-oneui9
          name: "ZeroFlash One UI 9 AppLock (Ready-to-Install APK)"
          body: "فایل نصبی آماده (ZeroFlash-OneUI9-AppLock.apk) برای گوشی‌های سامسونگ One UI 9 با پشتیبانی از تم تاریک/روشن خودکار، زبان فارسی و انگلیسی، و ۴ تم چرخشی."
          files: ZeroFlash-OneUI9-AppLock.apk
