                            "۴. مالکیت داده‌ها و عدم ردیابی (Zero Telemetry & Ads)" to
                                "این برنامه فاقد هرگونه ردیاب تبلیغاتی (Ad Trackers)، کتابخانه‌های تحلیل رفتار کاربر (Analytics) یا تبلیغات مزاحم است. عکس‌های ثبت‌شده توسط سیستم فضول‌گیر مستقیماً در گالری گوشی شما ذخیره شده و مدیریت یا حذف آن‌ها کاملاً در اختیار شماست.",
