                              statusMessage = if (isFa) "۳ تلاش ناموفق! عکس سلفی در گالری ذخیره شد 📸" else "3 Failed Attempts! Intruder Selfie Saved to Gallery 📸"
                          } else {
                              statusMessage = if (isFa) "رمز اشتباه است، دوباره تلاش کنید" else "Incorrect password, try again"
                          }
                      }
                      LaunchedEffect(Unit) {
                          if (fpEnabled) {
                              delay(120)
                              telegramBiometricPulse = true
                              triggerFingerprintPrompt(
