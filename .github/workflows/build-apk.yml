name: Build ZeroFlash One UI 9 APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Generate Samsung Secure Folder Project
        shell: python3 {0}
        run: |
          import os
          def w(p, t):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              open(p, "w", encoding="utf-8").write(t.strip() + "\n")
          w("settings.gradle.kts", '''
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeroFlashSecureFolder"
          include(":app")
          ''')
          w("build.gradle.kts", '''
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ''')
          w("gradle.properties", '''
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''')
          w("app/build.gradle.kts", '''
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "io.zenzy.zeroflash.applock"
              compileSdk = 34
              defaultConfig {
                  applicationId = "io.zenzy.zeroflash.applock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 8
                  versionName = "4.0-SecureFolder"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
          }
          ''')
          w("app/src/main/res/values/strings.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Secure Folder Lock</string>
              <string name="accessibility_service_label">ZeroFlash Secure Folder Service</string>
              <string name="accessibility_service_desc">Instant Samsung One UI 9 Secure Folder app lock interceptor.</string>
          </resources>
          ''')
          w("app/src/main/res/values-fa/strings.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">قفل پوشه امن</string>
              <string name="accessibility_service_label">سرویس قفل آنی پوشه امن</string>
              <string name="accessibility_service_desc">نمایش آنی صفحه قفل به سبک پوشه امن سامسونگ (One UI 9) قبل از باز شدن برنامه‌ها.</string>
          </resources>
          ''')
          w("app/src/main/res/xml/accessibility_service_config.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="0"
              android:description="@string/accessibility_service_desc" />
          ''')
          w("app/src/main/AndroidManifest.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.DayNight">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="uiMode|locale|layoutDirection|orientation|screenSize"
                      android:launchMode="singleTop"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ZeroFlashAccessibilityService"
                      android:exported="true"
                      android:label="@string/accessibility_service_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          ''')
          w("app/src/main/java/io/zenzy/zeroflash/applock/ZeroFlashApp.kt", r'''
          package io.zenzy.zeroflash.applock
          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.ApplicationInfo
          import android.graphics.Color as AndroidColor
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button as AndroidButton
          import android.widget.FrameLayout
          import android.widget.GridLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.security.MessageDigest
          import java.util.concurrent.ConcurrentHashMap
          enum class ThemeMode { SYSTEM, DARK, LIGHT }
          enum class AppLanguage(val displayName: String, val dir: LayoutDirection) {
              FA("فارسی", LayoutDirection.Rtl),
              EN("English", LayoutDirection.Ltr)
          }
          object AppRepo {
              private lateinit var prefs: SharedPreferences
              private val lockedPkgs = ConcurrentHashMap.newKeySet<String>()
              private val unlockedSession = ConcurrentHashMap.newKeySet<String>()
              fun init(ctx: Context) {
                  if (::prefs.isInitialized) return
                  prefs = ctx.applicationContext.getSharedPreferences("knox_oneui9_prefs", Context.MODE_PRIVATE)
                  lockedPkgs.addAll(prefs.getStringSet("locked", emptySet()) ?: emptySet())
                  if (prefs.getString("pin_hash", null) == null) setPin("1234")
              }
              fun shouldIntercept(pkg: String, myPkg: String): Boolean {
                  if (pkg == myPkg || pkg.contains("systemui") || pkg.contains("inputmethod")) return false
                  if (!lockedPkgs.contains(pkg)) {
                      unlockedSession.clear()
                      return false
                  }
                  return !unlockedSession.contains(pkg)
              }
              fun markUnlocked(pkg: String) { unlockedSession.add(pkg) }
              fun clearUnlocked() { unlockedSession.clear() }
              fun toggleApp(pkg: String, lock: Boolean) {
                  if (lock) lockedPkgs.add(pkg) else lockedPkgs.remove(pkg)
                  prefs.edit().putStringSet("locked", lockedPkgs.toSet()).apply()
              }
              fun getLockedSet(): Set<String> = lockedPkgs.toSet()
              fun getThemeMode(): ThemeMode = runCatching { ThemeMode.valueOf(prefs.getString("tmode", "SYSTEM") ?: "SYSTEM") }.getOrDefault(ThemeMode.SYSTEM)
              fun setThemeMode(m: ThemeMode) = prefs.edit().putString("tmode", m.name).apply()
              fun getLang(): AppLanguage = runCatching { AppLanguage.valueOf(prefs.getString("lang", "FA") ?: "FA") }.getOrDefault(AppLanguage.FA)
              fun setLang(l: AppLanguage) = prefs.edit().putString("lang", l.name).apply()
              fun isRandomPad(): Boolean = prefs.getBoolean("rpad", true)
              fun setRandomPad(v: Boolean) = prefs.edit().putBoolean("rpad", v).apply()
              fun isPanicFlip(): Boolean = prefs.getBoolean("pflip", true)
              fun setPanicFlip(v: Boolean) = prefs.edit().putBoolean("pflip", v).apply()
              fun setPin(raw: String) = prefs.edit().putString("pin_hash", sha256(raw)).apply()
              fun verifyPin(raw: String): Boolean = sha256(raw) == (prefs.getString("pin_hash", sha256("1234")) ?: sha256("1234"))
              private fun sha256(s: String): String =
                  MessageDigest.getInstance("SHA-256").digest(("knox_salt_" + s).toByteArray()).joinToString("") { "%02x".format(it) }
          }
          class ZeroFlashAccessibilityService : AccessibilityService(), SensorEventListener {
              private lateinit var wm: WindowManager
              private var rootOverlay: FrameLayout? = null
              private var isAttached = false
              private var targetPkg = ""
              private var enteredPin = ""
              private var sensorManager: SensorManager? = null
              private val lp = WindowManager.LayoutParams(
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED or
                      WindowManager.LayoutParams.FLAG_SECURE or
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED,
                  PixelFormat.OPAQUE
              ).apply {
                  gravity = Gravity.TOP or Gravity.START
                  windowAnimations = 0
              }
              private val screenOffReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == Intent.ACTION_SCREEN_OFF) {
                          AppRepo.clearUnlocked()
                          hideOverlay()
                      }
                  }
              }
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  AppRepo.init(this)
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  registerReceiver(screenOffReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as? SensorManager
                  sensorManager?.getDefaultSensor(Sensor.TYPE_GRAVITY)?.let {
                      sensorManager?.registerListener(this, it, SensorManager.SENSOR_DELAY_NORMAL)
                  }
              }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return
                  if (AppRepo.shouldIntercept(pkg, packageName)) {
                      showSecureFolderLock(pkg)
                  }
              }
              private fun dp(v: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics).toInt()
              private fun showSecureFolderLock(pkg: String) {
                  targetPkg = pkg
                  enteredPin = ""
                  val isFa = AppRepo.getLang() == AppLanguage.FA
                  val digits = if (AppRepo.isRandomPad()) (0..9).shuffled() else (0..9).toList()
                  val container = FrameLayout(this).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(0xFF0C1E3E.toInt(), 0xFF071126.toInt(), 0xFF030712.toInt())
                      )
                  }
                  val mainCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(24), dp(56), dp(24), dp(36))
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                  }
                  val shieldBadge = TextView(this).apply {
                      text = "🛡️"
                      textSize = 34f
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = dp(24).toFloat()
                          setColor(0x33387AFF)
                          setStroke(dp(1), 0x80387AFF.toInt())
                      }
                  }
                  mainCol.addView(shieldBadge, LinearLayout.LayoutParams(dp(76), dp(76)))
                  val titleView = TextView(this).apply {
                      text = if (isFa) "پوشه امن سامسونگ (One UI 9)" else "Samsung Secure Folder"
                      setTextColor(AndroidColor.WHITE)
                      textSize = 21f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(18), 0, dp(6))
                  }
                  mainCol.addView(titleView)
                  val subView = TextView(this).apply {
                      text = pkg
                      setTextColor(0xFF8EA4C8.toInt())
                      textSize = 13f
                      gravity = Gravity.CENTER
                  }
                  mainCol.addView(subView)
                  mainCol.addView(View(this), LinearLayout.LayoutParams(1, 0, 1f))
                  val cardCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(20), dp(24), dp(20), dp(24))
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          cornerRadius = dp(32).toFloat()
                          setColor(0xCC0F1D36.toInt())
                          setStroke(dp(1), 0x33FFFFFF)
                      }
                  }
                  val promptText = TextView(this).apply {
                      text = if (isFa) "پین پوشه امن را وارد کنید" else "Enter Secure Folder PIN"
                      setTextColor(0xFFD8E2F3.toInt())
                      textSize = 14f
                      gravity = Gravity.CENTER
                  }
                  cardCol.addView(promptText)
                  val dotsView = TextView(this).apply {
                      text = "○   ○   ○   ○"
                      setTextColor(0xFF387AFF.toInt())
                      textSize = 20f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(14), 0, dp(20))
                  }
                  cardCol.addView(dotsView)
                  fun updateDots() {
                      dotsView.text = (0 until 4).joinToString("   ") { if (it < enteredPin.length) "●" else "○" }
                  }
                  val grid = GridLayout(this).apply {
                      columnCount = 3
                      rowCount = 4
                      layoutDirection = View.LAYOUT_DIRECTION_LTR
                  }
                  fun makeKey(label: String, onClick: () -> Unit): AndroidButton {
                      return AndroidButton(this).apply {
                          text = label
                          setTextColor(AndroidColor.WHITE)
                          textSize = 21f
                          isAllCaps = false
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(0x33FFFFFF)
                              setStroke(dp(1), 0x26FFFFFF)
                          }
                          setOnClickListener { onClick() }
                      }
                  }
                  fun pressDigit(d: Int) {
                      if (enteredPin.length < 4) {
                          enteredPin += d.toString()
                          updateDots()
                          if (enteredPin.length == 4) {
                              if (AppRepo.verifyPin(enteredPin)) {
                                  AppRepo.markUnlocked(targetPkg)
                                  hideOverlay()
                              } else {
                                  vibrateError()
                                  enteredPin = ""
                                  updateDots()
                                  promptText.text = if (isFa) "پین نادرست است" else "Incorrect PIN"
                                  promptText.setTextColor(0xFFFF8A80.toInt())
                              }
                          }
                      }
                  }
                  for (i in 0 until 9) {
                      val d = digits[i]
                      grid.addView(makeKey(d.toString()) { pressDigit(d) }, GridLayout.LayoutParams().apply {
                          width = dp(72); height = dp(72); setMargins(dp(10), dp(8), dp(10), dp(8))
                      })
                  }
                  grid.addView(makeKey(if (isFa) "خروج" else "Exit") {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      hideOverlay()
                  }.apply { textSize = 13f }, GridLayout.LayoutParams().apply {
                      width = dp(72); height = dp(72); setMargins(dp(10), dp(8), dp(10), dp(8))
                  })
                  grid.addView(makeKey(digits[9].toString()) { pressDigit(digits[9]) }, GridLayout.LayoutParams().apply {
                      width = dp(72); height = dp(72); setMargins(dp(10), dp(8), dp(10), dp(8))
                  })
                  grid.addView(makeKey("⌫") {
                      if (enteredPin.isNotEmpty()) {
                          enteredPin = enteredPin.dropLast(1)
                          updateDots()
                      }
                  }, GridLayout.LayoutParams().apply {
                      width = dp(72); height = dp(72); setMargins(dp(10), dp(8), dp(10), dp(8))
                  })
                  cardCol.addView(grid)
                  mainCol.addView(cardCol, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  container.addView(mainCol)
                  hideOverlay()
                  rootOverlay = container
                  runCatching {
                      wm.addView(container, lp)
                      isAttached = true
                  }
              }
              private fun hideOverlay() {
                  val v = rootOverlay ?: return
                  if (isAttached) {
                      runCatching { wm.removeViewImmediate(v); isAttached = false }
                  }
                  rootOverlay = null
              }
              private fun vibrateError() {
                  val vib = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vib.vibrate(VibrationEffect.createOneShot(110L, VibrationEffect.DEFAULT_AMPLITUDE))
                  }
              }
              override fun onSensorChanged(event: SensorEvent?) {
                  if (!AppRepo.isPanicFlip()) return
                  if (event?.sensor?.type == Sensor.TYPE_GRAVITY && event.values[2] < -9.2f) {
                      AppRepo.clearUnlocked()
                      hideOverlay()
                      performGlobalAction(GLOBAL_ACTION_HOME)
                  }
              }
              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) = Unit
              override fun onInterrupt() { hideOverlay() }
              override fun onDestroy() {
                  runCatching {
                      unregisterReceiver(screenOffReceiver)
                      sensorManager?.unregisterListener(this)
                  }
                  super.onDestroy()
              }
          }
          data class AppItem(val label: String, val pkg: String, val locked: Boolean)
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  AppRepo.init(this)
                  setContent {
                      var themeMode by remember { mutableStateOf(AppRepo.getThemeMode()) }
                      var lang by remember { mutableStateOf(AppRepo.getLang()) }
                      var showPreview by remember { mutableStateOf(false) }
                      val sysDark = isSystemInDarkTheme()
                      val isDark = when (themeMode) {
                          ThemeMode.SYSTEM -> sysDark
                          ThemeMode.DARK -> true
                          ThemeMode.LIGHT -> false
                      }
                      val bg = if (isDark) Color(0xFF000000) else Color(0xFFF2F2F7)
                      val card = if (isDark) Color(0xFF171A21) else Color(0xFFFFFFFF)
                      val border = if (isDark) Color(0x26FFFFFF) else Color(0x14000000)
                      val blue = if (isDark) Color(0xFF387AFF) else Color(0xFF0072DE)
                      val txt = if (isDark) Color.White else Color(0xFF0D0F14)
                      val sub = if (isDark) Color(0xFF8E97A8) else Color(0xFF636B78)
                      val isFa = lang == AppLanguage.FA
                      var apps by remember { mutableStateOf(loadInstalledApps()) }
                      var randomPad by remember { mutableStateOf(AppRepo.isRandomPad()) }
                      var panicFlip by remember { mutableStateOf(AppRepo.isPanicFlip()) }
                      CompositionLocalProvider(LocalLayoutDirection provides lang.dir) {
                          MaterialTheme {
                              if (showPreview) {
                                  SecureFolderPreviewScreen(isFa = isFa, onClose = { showPreview = false })
                              } else {
                                  LazyColumn(
                                      modifier = Modifier.fillMaxSize().background(bg).padding(horizontal = 16.dp),
                                      verticalArrangement = Arrangement.spacedBy(14.dp),
                                      contentPadding = PaddingValues(top = 42.dp, bottom = 36.dp)
                                  ) {
                                      item {
                                          Column(Modifier.fillMaxWidth().padding(vertical = 18.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                              Surface(shape = RoundedCornerShape(50), color = blue.copy(alpha = 0.15f)) {
                                                  Text(
                                                      text = "🛡️ Samsung Secure Folder • One UI 9",
                                                      color = blue,
                                                      fontSize = 12.sp,
                                                      fontWeight = FontWeight.SemiBold,
                                                      modifier = Modifier.padding(horizontal = 14.dp, vertical = 6.dp)
                                                  )
                                              }
                                              Spacer(Modifier.height(10.dp))
                                              Text(
                                                  text = if (isFa) "قفل آنی پوشه امن" else "Secure Folder App Lock",
                                                  color = txt,
                                                  fontSize = 30.sp,
                                                  fontWeight = FontWeight.Light
                                              )
                                              Spacer(Modifier.height(4.dp))
                                              Text(
                                                  text = if (isFa) "${apps.count { it.locked }} برنامه قفل‌شده • رمز پیش‌فرض: 1234" else "${apps.count { it.locked }} Locked Apps • Default PIN: 1234",
                                                  color = sub,
                                                  fontSize = 13.sp
                                              )
                                          }
                                      }
                                      item {
                                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                              Button(
                                                  onClick = {
                                                      if (!Settings.canDrawOverlays(this@MainActivity)) {
                                                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                                                      }
                                                  },
                                                  modifier = Modifier.weight(1f).height(48.dp),
                                                  shape = RoundedCornerShape(24.dp),
                                                  colors = ButtonDefaults.buttonColors(containerColor = card),
                                                  border = BorderStroke(1.dp, border)
                                              ) {
                                                  Text(if (isFa) "۱. مجوز لایه شناور" else "1. Overlay Permission", color = txt, fontSize = 12.sp)
                                              }
                                              Button(
                                                  onClick = { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) },
                                                  modifier = Modifier.weight(1f).height(48.dp),
                                                  shape = RoundedCornerShape(24.dp),
                                                  colors = ButtonDefaults.buttonColors(containerColor = blue)
                                              ) {
                                                  Text(if (isFa) "۲. سرویس تشخیص آنی" else "2. Instant Service", color = Color.White, fontSize = 12.sp)
                                              }
                                          }
                                      }
                                      item {
                                          Surface(shape = RoundedCornerShape(28.dp), color = card, border = BorderStroke(1.dp, border), modifier = Modifier.fillMaxWidth()) {
                                              Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                                  Text(if (isFa) "حالت تم برنامه (پیروی از گوشی)" else "App Theme Mode (Follow Phone)", color = txt, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                                      listOf(
                                                          ThemeMode.SYSTEM to (if (isFa) "خودکار سیستم" else "System Auto"),
                                                          ThemeMode.LIGHT to (if (isFa) "روشن" else "Light"),
                                                          ThemeMode.DARK to (if (isFa) "تاریک" else "Dark")
                                                      ).forEach { (m, label) ->
                                                          val sel = themeMode == m
                                                          Surface(
                                                              shape = RoundedCornerShape(20.dp),
                                                              color = if (sel) blue else blue.copy(alpha = 0.12f),
                                                              modifier = Modifier.weight(1f).height(40.dp).clickable {
                                                                  themeMode = m
                                                                  AppRepo.setThemeMode(m)
                                                              }
                                                          ) {
                                                              Box(contentAlignment = Alignment.Center) {
                                                                  Text(label, color = if (sel) Color.White else txt, fontSize = 12.sp, fontWeight = FontWeight.Medium)
                                                              }
                                                          }
                                                      }
                                                  }
                                                  Text(if (isFa) "زبان برنامه (Language)" else "App Language (زبان)", color = txt, fontWeight = FontWeight.SemiBold, fontSize = 14.sp)
                                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                                      AppLanguage.entries.forEach { l ->
                                                          val sel = lang == l
                                                          Surface(
                                                              shape = RoundedCornerShape(20.dp),
                                                              color = if (sel) blue else blue.copy(alpha = 0.12f),
                                                              modifier = Modifier.weight(1f).height(40.dp).clickable {
                                                                  lang = l
                                                                  AppRepo.setLang(l)
                                                              }
                                                          ) {
                                                              Box(contentAlignment = Alignment.Center) {
                                                                  Text(l.displayName, color = if (sel) Color.White else txt, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                                              }
                                                          }
                                                      }
                                                  }
                                                  Button(
                                                      onClick = { showPreview = true },
                                                      modifier = Modifier.fillMaxWidth().height(46.dp),
                                                      shape = RoundedCornerShape(22.dp),
                                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0C1E3E))
                                                  ) {
                                                      Text(
                                                          text = if (isFa) "🛡️ پیش‌نمایش صفحه قفل Secure Folder" else "🛡️ Preview Secure Folder Lock Screen",
                                                          color = Color.White,
                                                          fontSize = 13.sp
                                                      )
                                                  }
                                              }
                                          }
                                      }
                                      item {
                                          Surface(shape = RoundedCornerShape(28.dp), color = card, border = BorderStroke(1.dp, border), modifier = Modifier.fillMaxWidth()) {
                                              Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                                      Text(if (isFa) "صفحه‌کلید تصادفی ضد رد انگشت" else "Anti-Smudge Randomized Keypad", color = txt, fontSize = 14.sp, modifier = Modifier.weight(1f))
                                                      Switch(checked = randomPad, onCheckedChange = { randomPad = it; AppRepo.setRandomPad(it) })
                                                  }
                                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                                      Text(if (isFa) "قفل اضطراری با برگرداندن گوشی (Panic Flip)" else "Panic Flip-to-Lock (Face Down)", color = txt, fontSize = 14.sp, modifier = Modifier.weight(1f))
                                                      Switch(checked = panicFlip, onCheckedChange = { panicFlip = it; AppRepo.setPanicFlip(it) })
                                                  }
                                              }
                                          }
                                      }
                                      items(apps, key = { it.pkg }) { item ->
                                          Surface(shape = RoundedCornerShape(24.dp), color = card, border = BorderStroke(1.dp, border), modifier = Modifier.fillMaxWidth()) {
                                              Row(Modifier.fillMaxWidth().padding(horizontal = 18.dp, vertical = 14.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                                  Column(Modifier.weight(1f)) {
                                                      Text(item.label, color = txt, fontWeight = FontWeight.SemiBold, fontSize = 15.sp)
                                                      Text(item.pkg, color = sub, fontSize = 12.sp)
                                                  }
                                                  Switch(
                                                      checked = item.locked,
                                                      onCheckedChange = { locked ->
                                                          AppRepo.toggleApp(item.pkg, locked)
                                                          apps = apps.map { if (it.pkg == item.pkg) it.copy(locked = locked) else it }
                                                      }
                                                  )
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
              private fun loadInstalledApps(): List<AppItem> {
                  val locked = AppRepo.getLockedSet()
                  return packageManager.getInstalledApplications(0)
                      .filter { (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 || it.packageName.contains("settings") || it.packageName.contains("gallery") }
                      .map { AppItem(packageManager.getApplicationLabel(it).toString(), it.packageName, locked.contains(it.packageName)) }
                      .sortedBy { it.label }
              }
          }
          @Composable
          private fun SecureFolderPreviewScreen(isFa: Boolean, onClose: () -> Unit) {
              var pin by remember { mutableStateOf("") }
              val digits = remember { (0..9).shuffled() }
              Box(
                  modifier = Modifier.fillMaxSize().background(
                      Brush.verticalGradient(listOf(Color(0xFF0C1E3E), Color(0xFF071126), Color(0xFF030712)))
                  ).padding(24.dp)
              ) {
                  Column(
                      modifier = Modifier.fillMaxSize(),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.padding(top = 28.dp)) {
                          Surface(shape = RoundedCornerShape(24.dp), color = Color(0x33387AFF), border = BorderStroke(1.dp, Color(0x80387AFF)), modifier = Modifier.size(76.dp)) {
                              Box(contentAlignment = Alignment.Center) { Text("🛡️", fontSize = 34.sp) }
                          }
                          Spacer(Modifier.height(16.dp))
                          Text(if (isFa) "پوشه امن سامسونگ (One UI 9)" else "Samsung Secure Folder", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Medium)
                      }
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                          Surface(shape = RoundedCornerShape(32.dp), color = Color(0xCC0F1D36), border = BorderStroke(1.dp, Color(0x33FFFFFF)), modifier = Modifier.fillMaxWidth()) {
                              Column(Modifier.padding(22.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(if (isFa) "پین پوشه امن را وارد کنید" else "Enter Secure Folder PIN", color = Color(0xFFD8E2F3), fontSize = 14.sp)
                                  Spacer(Modifier.height(14.dp))
                                  Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                                      repeat(4) { i ->
                                          Box(Modifier.size(14.dp).clip(CircleShape).background(if (i < pin.length) Color(0xFF387AFF) else Color(0x44FFFFFF)))
                                      }
                                  }
                                  Spacer(Modifier.height(20.dp))
                                  val rows = listOf(digits.subList(0, 3), digits.subList(3, 6), digits.subList(6, 9))
                                  rows.forEach { r ->
                                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                                          r.forEach { d ->
                                              Button(
                                                  onClick = {
                                                      pin += d.toString()
                                                      if (pin.length == 4) onClose()
                                                  },
                                                  modifier = Modifier.size(68.dp),
                                                  shape = CircleShape,
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0x33FFFFFF))
                                              ) { Text(d.toString(), color = Color.White, fontSize = 21.sp) }
                                          }
                                      }
                                      Spacer(Modifier.height(10.dp))
                                  }
                                  Button(onClick = onClose, shape = RoundedCornerShape(20.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF387AFF))) {
                                      Text(if (isFa) "بستن پیش‌نمایش" else "Close Preview")
                                  }
                              }
                          }
                      }
                  }
              }
          }
          ''')
          print("All Samsung Secure Folder files generated cleanly!")
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Accept Preinstalled Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compile Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ZeroFlash-OneUI9-AppLock.apk
      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroFlash-OneUI9-AppLock-APK
          path: ZeroFlash-OneUI9-AppLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v4.0-securefolder
          name: "Samsung Secure Folder AppLock One UI 9 (APK)"
          body: "فایل نصبی آماده (ZeroFlash-OneUI9-AppLock.apk) با تم ثابت پوشه امن سامسونگ (Samsung Secure Folder One UI 9)، پشتیبانی از تم تاریک/روشن خودکار گوشی و زبان فارسی/انگلیسی."
          files: ZeroFlash-OneUI9-AppLock.apk
