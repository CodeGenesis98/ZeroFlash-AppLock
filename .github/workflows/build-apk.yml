      - name: Compile Optimized Release APK with JDK 17, Android 16 (API 36) & Gradle 8.7
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon --no-build-cache --console=plain
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.0.7-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          cat << 'RELNOTES' > /tmp/release_notes.md
          ## 🛡️ NowLock v0.0.7 (Beta) — 3D Cyber-Shield & Radar UI, Expressive Motion & Ultra-Compact APK

          **Your digital privacy deserves uncompromising protection that never slows you down.**
          Engineered from the ground up with **100% Native Kotlin**, **Jetpack Compose**, and **Material 3**, **NowLock v0.0.7** introduces an interactive **3D Cyber-Shield & Live Radar Core**, **Material 3 Expressive spring physics**, **specular glass borders**, **0% screen-off standby battery consumption**, and **R8 code/resource shrinking**.

          ### 🚀 What's New in NowLock v0.0.7 (Beta)

          - 🛡️ **Interactive 3D Cyber-Shield & Live Radar Hub**
            Redesigned security status core featuring a sculpted 3D heraldic shield, rotating 4-segment radar scanner, dual staggered sonar waves, live Security Health Score meter (`0%–100%`), and distinct 3D emblems for **Safe (Emerald Checkmark)**, **Warning (Amber Diamond Beacon)**, and **Danger (Crimson Hazard Core)**.

          - ✨ **Specular Glass Borders & Material 3 Expressive Motion**
            Upgraded cards, tactile selector pills, frosted glass dialpad keys, dual-pass neon pattern trajectories, and a 2×2 Security Permission Module grid with spring-physics press animations.

          - 📦 **Ultra-Compact APK & Zero Screen-Off Battery Drain**
            Enabled R8 code/resource shrinking with locale filtering (`en`, `fa`) and lossless icon compression to minimize APK size, while automatically pausing background UsageStats polling when the screen turns off (`ACTION_SCREEN_OFF`) and resuming in `0ms` on wakeup.

          - 🔐 **Direct Boot & Hardware-Vault Security Hardening**
            Full `DeviceProtectedStorage` migration for seamless `LOCKED_BOOT_COMPLETED` protection before first unlock, immediate RAM wiping (`clearPassword()`) after `PBKDF2-HMAC-SHA256` key derivation, and strict BroadcastReceiver intent verification.
          RELNOTES
          gh release create v0.0.7-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "🛡️ NowLock v0.0.7 (Beta) — 3D Cyber-Shield & Radar UI, Expressive Motion & Ultra-Compact APK" --notes-file /tmp/release_notes.md
