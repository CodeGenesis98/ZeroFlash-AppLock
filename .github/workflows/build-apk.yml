          // Full-Screen Lock Activity (Clean Top Header: ONLY Small Padlock + RGB "NowLock", Intruder Selfie on Failed Fingerprint Too)
          class LockScreenActivity : FragmentActivity() {
              companion object {
                  @Volatile var isShowing = false
                  @Volatile var activeTargetPkg = ""
              }
              override fun onResume() {
                  super.onResume()
                  isShowing = true
                  OverlayLockBridge.dismissShield(this)
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  overridePendingTransition(0, 0)
                  AppRepo.init(this)
                  if (AppRepo.isRecentsPrivacyEnabled()) {
                      runCatching { window.addFlags(WindowManager.LayoutParams.FLAG_SECURE) }
                  }
                  configureNotchAndGlassBars(this, AppRepo.isDarkEffective(this))
                  val targetPkg = intent.getStringExtra("target_pkg") ?: ""
                  activeTargetPkg = targetPkg
                  isShowing = true
                  OverlayLockBridge.dismissShield(this)
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          navigateHomeAndClose()
                      }
                  })
                  setContent {
                      val lang = AppRepo.getAppLang()
                      val s = getStrings(lang)
                      val themeMode = AppRepo.getThemeMode()
                      val sysDark = isSystemInDarkTheme()
                      val isDark = when (themeMode) {
                          ThemeMode.SYSTEM -> sysDark
                          ThemeMode.DARK -> true
                          ThemeMode.LIGHT -> false
                      }
                      SideEffect {
                          configureNotchAndGlassBars(this@LockScreenActivity, isDark)
                      }
                      val config = LocalConfiguration.current
                      val isCompactScreen = config.screenHeightDp < 700
                      val primaryTextColor = if (isDark) Color(0xFFF5F6FA) else Color(0xFF1C1E26)
                      val secondaryTextColor = if (isDark) Color(0xFFA9A6D4) else Color(0xFF72768C)
                      val accentBlue = if (isDark) Color(0xFF6B63FF) else Color(0xFF5D56F5)
                      val comboMode = AppRepo.getComboMode()
                      val usePattern = (comboMode == LockComboMode.PATTERN_FINGERPRINT && AppRepo.isPatternSet()) ||
                          (!AppRepo.isPinSet() && AppRepo.isPatternSet())
                      val fpEnabled = AppRepo.isFingerprintEnabled() && canUseFingerprint(this)
                      var enteredPin by remember { mutableStateOf("") }
                      var failedAttempts by remember { mutableStateOf(0) }
                      val defaultPrompt = if (usePattern) s.lockPromptPattern else s.lockPromptPin
                      var statusMessage by remember(lang, usePattern) { mutableStateOf(defaultPrompt) }
                      var isErrorState by remember { mutableStateOf(false) }
                      var isUnlockingFade by remember { mutableStateOf(false) }
                      var telegramBiometricPulse by remember { mutableStateOf(false) }
                      val screenAlpha by animateFloatAsState(
                          targetValue = if (isUnlockingFade) 0f else 1f,
                          animationSpec = tween(durationMillis = 180, easing = FastOutSlowInEasing),
                          finishedListener = {
                              if (isUnlockingFade) {
                                  isShowing = false
                                  OverlayLockBridge.dismissShield(this@LockScreenActivity)
                                  finish()
                                  overridePendingTransition(0, android.R.anim.fade_out)
                              }
                          },
                          label = "unlockFade"
                      )
                      val scope = rememberCoroutineScope()
                      fun onSuccessfulUnlock() {
                          AppRepo.markUnlocked(targetPkg)
                          OverlayLockBridge.dismissShield(this@LockScreenActivity)
                          isUnlockingFade = true
                      }
                      fun onWrongAttempt() {
                          failedAttempts++
                          isErrorState = true
                          AppRepo.triggerShortVibration(this@LockScreenActivity, 65L)
                          // Captures silent intruder selfie after 3 failed attempts (PIN, Pattern, OR Fingerprint!)
                          if (failedAttempts >= 3 && AppRepo.isIntruderSelfieEnabled()) {
                              AppRepo.recordIntruderAttempt(this@LockScreenActivity, targetPkg)
                          }
                          statusMessage = s.lockWrongAttempt
                      }
                      LaunchedEffect(Unit) {
                          if (fpEnabled) {
                              delay(180)
                              telegramBiometricPulse = true
                              triggerFingerprintPrompt(
                                  s = s,
                                  onSuccess = { onSuccessfulUnlock() },
                                  onFailedAttempt = { onWrongAttempt() },
                                  onCancelOrError = { telegramBiometricPulse = false }
                              )
                          }
                      }
                      HappAmbientBackground(
                          isDark = isDark,
                          modifier = Modifier
                              .fillMaxSize()
                              .alpha(screenAlpha)
                      ) {
                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .windowInsetsPadding(WindowInsets.systemBars.union(WindowInsets.displayCutout))
                                  .padding(horizontal = 24.dp, vertical = if (isCompactScreen) 12.dp else 22.dp),
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.SpaceBetween
                          ) {
                              // Clean Header: ONLY Small Padlock + Animated RGB "NowLock" (Removed big duplicate padlock and white NowLock below it!)
                              Column(
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  modifier = Modifier.padding(top = if (isCompactScreen) 18.dp else 32.dp)
                              ) {
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                                  ) {
                                      Image(
                                          painter = painterResource(id = R.drawable.ic_nowlock_logo),
                                          contentDescription = "NowLock",
                                          modifier = Modifier
                                              .size(32.dp)
                                              .clip(RoundedCornerShape(9.dp))
                                      )
                                      AnimatedRgbBrandText(
                                          text = "NowLock",
                                          fontSize = 24.sp
                                      )
                                  }
                                  Spacer(Modifier.height(16.dp))
                                  Text(
                                      text = statusMessage,
                                      color = if (isErrorState) Color(0xFFEF4444) else secondaryTextColor,
                                      fontSize = 13.5.sp,
                                      textAlign = TextAlign.Center
                                  )
                                  if (!usePattern) {
                                      Spacer(Modifier.height(24.dp))
                                      Row(
                                          horizontalArrangement = Arrangement.spacedBy(18.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          repeat(4) { idx ->
                                              val filled = idx < enteredPin.length
                                              val dotScale by animateFloatAsState(
                                                  targetValue = if (filled) 1.18f else 1.0f,
                                                  animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy),
                                                  label = "dotScale"
                                              )
                                              Box(
                                                  modifier = Modifier
                                                      .size(14.dp)
                                                      .scale(dotScale)
                                                      .clip(CircleShape)
                                                      .background(
                                                          when {
                                                              isErrorState -> Color(0xFFEF4444)
                                                              filled -> primaryTextColor
                                                              else -> Color.Transparent
                                                          }
                                                      )
                                                      .border(
                                                          width = 1.5.dp,
                                                          color = if (isErrorState) Color(0xFFEF4444) else primaryTextColor.copy(alpha = 0.55f),
                                                          shape = CircleShape
                                                      )
                                              )
                                          }
                                      }
                                  }
                              }
                              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                                  if (usePattern) {
                                      Column(
                                          horizontalAlignment = Alignment.CenterHorizontally,
                                          modifier = Modifier.padding(bottom = 12.dp)
                                      ) {
                                          InteractivePatternLockView(
                                              gridSizeDp = if (isCompactScreen) 240 else 276,
                                              dotColor = primaryTextColor,
                                              lineColor = accentBlue,
                                              errorColor = Color(0xFFEF4444),
                                              onPatternCompleted = { patternStr, resetPatternCallback ->
                                                  if (AppRepo.verifyPattern(patternStr)) {
                                                      onSuccessfulUnlock()
                                                  } else {
                                                      onWrongAttempt()
                                                      scope.launch {
                                                          delay(350)
                                                          resetPatternCallback()
                                                          isErrorState = false
                                                          statusMessage = defaultPrompt
                                                      }
                                                  }
                                              }
                                          )
                                          Spacer(Modifier.height(14.dp))
                                          Row(
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .padding(horizontal = 24.dp),
                                              horizontalArrangement = Arrangement.SpaceBetween,
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              TextButton(onClick = { navigateHomeAndClose() }) {
                                                  Text(
                                                      text = s.lockExitBtn,
                                                      color = secondaryTextColor,
                                                      fontSize = 15.sp
                                                  )
                                              }
                                              if (fpEnabled) {
                                                  TelegramFingerprintButton(
                                                      isActivePulse = telegramBiometricPulse,
                                                      tintColor = primaryTextColor,
                                                      accentColor = accentBlue,
                                                      onClick = {
                                                          telegramBiometricPulse = true
                                                          triggerFingerprintPrompt(
                                                              s = s,
                                                              onSuccess = { onSuccessfulUnlock() },
                                                              onFailedAttempt = { onWrongAttempt() },
                                                              onCancelOrError = { telegramBiometricPulse = false }
                                                          )
                                                      }
                                                  )
                                              }
                                          }
                                      }
                                  } else {
                                      SamsungOneUiDialpad(
                                          isCompact = isCompactScreen,
                                          primaryTextColor = primaryTextColor,
                                          secondaryTextColor = secondaryTextColor,
                                          accentColor = accentBlue,
                                          showFingerprintKey = fpEnabled,
                                          isFingerprintPulsing = telegramBiometricPulse,
                                          onDigitClick = { digit ->
                                              if (enteredPin.length < 4) {
                                                  isErrorState = false
                                                  enteredPin += digit.toString()
                                                  if (enteredPin.length == 4) {
                                                      if (AppRepo.verifyPin(enteredPin)) {
                                                          onSuccessfulUnlock()
                                                      } else {
                                                          onWrongAttempt()
                                                          scope.launch {
                                                              delay(260)
                                                              enteredPin = ""
                                                          }
                                                      }
                                                  }
                                              }
                                          },
                                          onBackspaceClick = {
                                              if (enteredPin.isNotEmpty()) {
                                                  isErrorState = false
                                                  enteredPin = enteredPin.dropLast(1)
                                              }
                                          },
                                          onFingerprintClick = {
                                              telegramBiometricPulse = true
                                              triggerFingerprintPrompt(
                                                  s = s,
                                                  onSuccess = { onSuccessfulUnlock() },
                                                  onFailedAttempt = { onWrongAttempt() },
                                                  onCancelOrError = { telegramBiometricPulse = false }
                                              )
                                          }
                                      )
                                  }
                              }
                          }
                          NotchTranslucentStatusBarOverlay(isDark = isDark)
                          GlassyNavigationBarOverlay(isDark = isDark, modifier = Modifier.align(Alignment.BottomCenter))
                      }
                  }
              }
              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  val pkg = intent.getStringExtra("target_pkg") ?: ""
                  if (pkg.isNotEmpty()) activeTargetPkg = pkg
                  OverlayLockBridge.dismissShield(this)
              }
              override fun onDestroy() {
                  isShowing = false
                  OverlayLockBridge.dismissShield(this)
                  super.onDestroy()
              }
              private fun navigateHomeAndClose() {
                  OverlayLockBridge.dismissShield(this)
                  val home = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK
                  }
                  runCatching { startActivity(home) }
                  isShowing = false
                  finish()
              }
              private fun triggerFingerprintPrompt(
                  s: UiStrings,
                  onSuccess: () -> Unit,
                  onFailedAttempt: () -> Unit,
                  onCancelOrError: () -> Unit
              ) {
                  val executor = ContextCompat.getMainExecutor(this)
                  val prompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                          super.onAuthenticationSucceeded(result)
                          onSuccess()
                      }
                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                          super.onAuthenticationError(errorCode, errString)
                          if (errorCode == BiometricPrompt.ERROR_LOCKOUT || errorCode == BiometricPrompt.ERROR_LOCKOUT_PERMANENT) {
                              onFailedAttempt()
                          }
                          onCancelOrError()
                      }
                      override fun onAuthenticationFailed() {
                          super.onAuthenticationFailed()
                          // Every wrong fingerprint attempt triggers vibration and counts toward Intruder Selfie!
                          onFailedAttempt()
                      }
                  })
                  val promptInfo = BiometricPrompt.PromptInfo.Builder()
                      .setTitle("NowLock")
                      .setSubtitle(s.biometricSubtitle)
                      .setNegativeButtonText(
                          if (AppRepo.getComboMode() == LockComboMode.PATTERN_FINGERPRINT) s.biometricUsePattern else s.biometricUsePin
                      )
                      .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.BIOMETRIC_WEAK)
                      .build()
                  runCatching { prompt.authenticate(promptInfo) }.onFailure { onCancelOrError() }
              }
          }
          fun canUseFingerprint(context: Context): Boolean {
              val bm = BiometricManager.from(context)
              return bm.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.BIOMETRIC_WEAK) == BiometricManager.BIOMETRIC_SUCCESS
          }
          @Composable
          fun SamsungOneUiDialpad(
              isCompact: Boolean = false,
              primaryTextColor: Color,
              secondaryTextColor: Color,
              accentColor: Color,
              showFingerprintKey: Boolean,
              isFingerprintPulsing: Boolean,
