      - name: Compile Optimized Release APK with JDK 17, Android 16 (API 36) & Gradle 8.7
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon --no-build-cache --stacktrace
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v9.0.3-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          cat << 'RELNOTES' > /tmp/release_notes.md
          ## 🛡️ NowLock v9.0.3 — Flagship Privacy, Hardware-Vault Cryptography & On-Device AI Recovery

          **Your digital privacy deserves uncompromising protection that never slows you down.**
          Engineered from the ground up with **100% Native Kotlin**, **Jetpack Compose**, and **Material 3**, **NowLock** delivers instantaneous app protection with a silky-smooth interface, dynamic frosted-glass aesthetics, and virtually zero battery impact across phones, tablets, and foldables.

          ### 🚀 What Makes NowLock v9.0.3 Extraordinary

          - 🔐 **Hardware-Vault Credential Security (`AndroidKeyStore TEE`)**
            Your PINs, patterns, and recovery secrets are fortified with **128-bit cryptographic salts**, **12,000-round `PBKDF2-HMAC-SHA256` key stretching**, and **`AES-256-GCM` hardware encryption** bound directly to your device's Trusted Execution Environment. Even if device files are inspected externally, your credentials remain mathematically untouchable.

          - 🧠 **On-Device Semantic AI Password Recovery**
            Humans remember meanings, not rigid strings. NowLock's built-in Natural Language & Fuzzy Semantic Engine understands synonyms, conversational phrasing, and cross-lingual concepts across 5 languages—allowing you to effortlessly recover your lock credentials without ever connecting to the cloud.

          - 🕵️ **Active Stealth Defense & Realistic System Decoy**
            Outsmart snoopers before they even know an app is locked. Trigger a convincing English system error screen using your Decoy credential, silently capture intruder selfies to your private gallery after failed attempts, and monitor tamper events in the live Security Command Center.

          - 🎨 **True Pitch-Black AMOLED & Dynamic Frosted Glass**
            Experience a refined lock screen layout with balanced typography, adaptive app-tinted frosted glass, and a pure `#000000` AMOLED theme that eliminates dark-blue halos and transition flashes.

          - ✅ **Play Protect & App Store Certified Footprint**
            Engineered with minimal permissions and zero screen-content inspection (`canRetrieveWindowContent="false"`), ensuring seamless harmony with **Google Play Protect**, **Samsung Auto Blocker**, **Cafe Bazaar**, and **Myket**.

          ### 🔒 100% Offline. Zero Ads. Zero Telemetry.
          NowLock operates strictly on-device with no internet permission and is signed with our persistent release certificate for effortless in-place upgrades.
          RELNOTES
          gh release create v9.0.3-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "🛡️ NowLock v9.0.3 — Hardware-Vault Security, On-Device AI Recovery & AMOLED Perfection" --notes-file /tmp/release_notes.md
