              try:
                  from PIL import Image, ImageFilter
                  for fn, target_sz in [("ic_nowlock_shield_3d.png", 448), ("ic_nowlock_logo.png", 384), ("ic_nowlock_calculator.png", 384), ("ic_nowlock_fingerprint.png", 384)]:
