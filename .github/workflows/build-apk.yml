                      im = Image.open(p).convert("RGBA")
                      rgb = im.convert("RGB").resize((target_sz, target_sz), Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(radius=0.45)).filter(ImageFilter.UnsharpMask(radius=1.1, percent=135, threshold=2))
