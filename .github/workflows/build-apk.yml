          // Direct Deep-Link Permission Helpers (Takes user directly to NowLock's specific toggle switch!)
          fun openDirectAccessibilitySettings(context: Context) {
              val comp = ComponentName(context.packageName, NowLockAccessibilityService::class.java).flattenToString()
              val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply {
                  val bundle = Bundle()
                  bundle.putString(":settings:fragment_args_key", comp)
                  putExtra(":settings:fragment_args_key", comp)
                  putExtra(":settings:show_fragment_args", bundle)
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }
              runCatching { context.startActivity(intent) }
          }
          fun openDirectUsageAccessSettings(context: Context) {
              val directIntent = Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS).apply {
                  data = Uri.fromParts("package", context.packageName, null)
                  putExtra(":settings:fragment_args_key", context.packageName)
                  val bundle = Bundle()
                  bundle.putString(":settings:fragment_args_key", context.packageName)
                  putExtra(":settings:show_fragment_args", bundle)
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }
              runCatching {
                  context.startActivity(directIntent)
              }.onFailure {
                  val fallback = Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS).apply {
                      putExtra(":settings:fragment_args_key", context.packageName)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  runCatching { context.startActivity(fallback) }
              }
          }
          fun openDirectOverlaySettings(context: Context) {
              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:${context.packageName}")).apply {
                  putExtra(":settings:fragment_args_key", context.packageName)
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }
              runCatching { context.startActivity(intent) }
          }
          fun openDirectAppDetailsSettings(context: Context) {
              val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.fromParts("package", context.packageName, null)).apply {
                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              }
              runCatching { context.startActivity(intent) }
