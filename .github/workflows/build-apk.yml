          enum class ThemeMode { SYSTEM, DARK, LIGHT }

          enum class AppLanguage(val code: String, val displayName: String, val layoutDirection: LayoutDirection) {
              FA("fa", "فارسی", LayoutDirection.Rtl),
              EN("en", "English", LayoutDirection.Ltr)
          }

          enum class WallpaperCategory(
              val titleFa: String,
              val titleEn: String,
              val badgeFa: String,
              val badgeEn: String,
              @DrawableRes val resId: Int,
              val accentHex: Int,
              val glassHex: Int
          ) {
              MISTY_FOREST("جنگل مه‌آلود سپیده‌دم", "Misty Pine Forest", "🌲 طبیعت و جنگل مه‌آلود", "🌲 Misty Pine Forest", R.drawable.bg_misty_forest, 0xFF6EE7B7.toInt(), 0xCC11221C.toInt()),
              COZY_WOOD_CAFE("کافی‌شاپ چوبی بارانی", "Cozy Wooden Cafe", "☕ کافی‌شاپ با تم چوبی", "☕ Cozy Wooden Cafe", R.drawable.bg_cozy_wood_cafe, 0xFFFBBF24.toInt(), 0xCC26170F.toInt()),
              WITCHER_3("ویچر ۳ (کائر مورهن)", "The Witcher 3 (Kaer Morhen)", "⚔️ ویچر ۳ • کائر مورهن", "⚔️ The Witcher 3 • Kaer Morhen", R.drawable.bg_witcher_wilderness, 0xFFFB923C.toInt(), 0xCC151922.toInt()),
              LORD_OF_THE_RINGS("ارباب حلقه‌ها (ریوندل)", "Lord of the Rings (Rivendell)", "💍 ارباب حلقه‌ها • ریوندل", "💍 Lord of the Rings • Rivendell", R.drawable.bg_lotr_rivendell, 0xFFFACC15.toInt(), 0xCC1A1726.toInt());

              fun title(lang: AppLanguage): String = if (lang == AppLanguage.FA) titleFa else titleEn
              fun badge(lang: AppLanguage): String = if (lang == AppLanguage.FA) badgeFa else badgeEn
          }

          object AppLockRepository {
              private const val PREFS_NAME = "zeroflash_oneui9_prefs"
              private val lockedPackagesRam = ConcurrentHashMap.newKeySet<String>()
              private val unlockedSessionPackages = ConcurrentHashMap.newKeySet<String>()
              private val enabledCategoriesRam = ConcurrentHashMap.newKeySet<WallpaperCategory>()
              @Volatile private var lastThemeOrdinal = -1
              @Volatile private var isInitialized = false
              private lateinit var prefs: SharedPreferences

              fun init(context: Context) {
                  if (isInitialized) return
                  prefs = context.applicationContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  lockedPackagesRam.addAll(prefs.getStringSet("locked_pkgs", emptySet()) ?: emptySet())
                  val savedCats = prefs.getStringSet("enabled_cats", WallpaperCategory.entries.map { it.name }.toSet()) ?: emptySet()
                  savedCats.forEach { name ->
                      runCatching { WallpaperCategory.valueOf(name) }.getOrNull()?.let { enabledCategoriesRam.add(it) }
                  }
                  if (enabledCategoriesRam.isEmpty()) enabledCategoriesRam.addAll(WallpaperCategory.entries)
                  if (prefs.getString("pin_hash", null) == null) setPin("1234")
                  isInitialized = true
              }

              fun nextTheme(): WallpaperCategory {
                  val pool = WallpaperCategory.entries.filter { enabledCategoriesRam.contains(it) }.ifEmpty { WallpaperCategory.entries }
                  if (pool.size == 1) return pool.first()
                  val candidates = pool.filter { it.ordinal != lastThemeOrdinal }.ifEmpty { pool }
                  val picked = candidates.random()
                  lastThemeOrdinal = picked.ordinal
                  return picked
              }

              fun shouldIntercept(pkg: String, myPkg: String): Boolean {
                  if (pkg == myPkg || pkg.contains("systemui") || pkg.contains("inputmethod")) return false
                  if (!lockedPackagesRam.contains(pkg)) {
                      unlockedSessionPackages.clear()
                      return false
                  }
                  return !unlockedSessionPackages.contains(pkg)
              }

              fun markUnlocked(pkg: String) { unlockedSessionPackages.add(pkg) }
              fun clearUnlocked() { unlockedSessionPackages.clear() }

              fun togglePackageLock(pkg: String, locked: Boolean) {
                  if (locked) lockedPackagesRam.add(pkg) else lockedPackagesRam.remove(pkg)
                  prefs.edit().putStringSet("locked_pkgs", lockedPackagesRam.toSet()).apply()
              }

              fun getLockedPackages(): Set<String> = lockedPackagesRam.toSet()
              fun getEnabledCategories(): Set<WallpaperCategory> = enabledCategoriesRam.toSet()

              fun toggleCategory(cat: WallpaperCategory, enabled: Boolean) {
                  if (enabled) enabledCategoriesRam.add(cat)
                  else if (enabledCategoriesRam.size > 1) enabledCategoriesRam.remove(cat)
                  prefs.edit().putStringSet("enabled_cats", enabledCategoriesRam.map { it.name }.toSet()).apply()
              }

              fun getThemeMode(): ThemeMode =
                  runCatching { ThemeMode.valueOf(prefs.getString("theme_mode", ThemeMode.SYSTEM.name) ?: ThemeMode.SYSTEM.name) }.getOrDefault(ThemeMode.SYSTEM)
              fun setThemeMode(m: ThemeMode) = prefs.edit().putString("theme_mode", m.name).apply()

              fun getAppLanguage(): AppLanguage =
                  runCatching { AppLanguage.valueOf(prefs.getString("app_lang", AppLanguage.FA.name) ?: AppLanguage.FA.name) }.getOrDefault(AppLanguage.FA)
              fun setAppLanguage(l: AppLanguage) = prefs.edit().putString("app_lang", l.name).apply()

              fun isRandomKeypadEnabled(): Boolean = prefs.getBoolean("random_keypad", true)
              fun setRandomKeypadEnabled(v: Boolean) = prefs.edit().putBoolean("random_keypad", v).apply()

              fun isFakeCrashEnabled(): Boolean = prefs.getBoolean("fake_crash", false)
              fun setFakeCrashEnabled(v: Boolean) = prefs.edit().putBoolean("fake_crash", v).apply()

              fun isPanicFlipEnabled(): Boolean = prefs.getBoolean("panic_flip", true)
              fun setPanicFlipEnabled(v: Boolean) = prefs.edit().putBoolean("panic_flip", v).apply()

              fun isStealthCalcEnabled(): Boolean = prefs.getBoolean("stealth_calc", false)
              fun setStealthCalcEnabled(v: Boolean) = prefs.edit().putBoolean("stealth_calc", v).apply()

              fun isHideNotifEnabled(): Boolean = prefs.getBoolean("hide_notif", true)
              fun setHideNotifEnabled(v: Boolean) = prefs.edit().putBoolean("hide_notif", v).apply()

              fun setPin(raw: String) = prefs.edit().putString("pin_hash", sha256(raw)).apply()
              fun verifyPin(raw: String): Boolean = sha256(raw) == (prefs.getString("pin_hash", sha256("1234")) ?: sha256("1234"))

              private fun sha256(input: String): String {
                  val bytes = MessageDigest.getInstance("SHA-256").digest(("zeroflash_v1_" + input).toByteArray())
                  return bytes.joinToString("") { "%02x".format(it) }
              }
          }

          /**
           * Ultra-Fast (<2ms) Hardware-Accelerated Native One UI 9 WindowManager Overlay.
           * Uses native Android Views inside AccessibilityService so it attaches in <1 frame with zero overhead.
           */
          class ZeroFlashAccessibilityService : AccessibilityService(), SensorEventListener {
              private lateinit var windowManager: WindowManager
              private var rootOverlay: FrameLayout? = null
              private var isAttached = false
              private var currentTargetPkg = ""
              private var enteredPin = ""
              private var sensorManager: SensorManager? = null

              private val layoutParams = WindowManager.LayoutParams(
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.TYPE_APPLICATION
