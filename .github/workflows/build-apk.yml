                  runCatching {
                      val imm = ctx.getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager
                      imm?.enabledInputMethodList?.forEach { imi ->
                          if (imi.packageName.isNotEmpty()) dynamicImePackages.add(imi.packageName)
