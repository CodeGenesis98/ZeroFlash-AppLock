      - name: Compile Optimized Release APK with JDK 17, Android 16 (API 36) & Gradle 8.7
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon --no-build-cache --stacktrace
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v9.0.2-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          cat << 'RELNOTES' > /tmp/release_notes.md
          ## 🛡️ NowLock v9.0.2 — Next-Gen Privacy & App Security for Android

          **NowLock** is a fast, ultra-lightweight, 100% offline Android privacy shield engineered with **Kotlin**, **Jetpack Compose**, and **Material 3**. Designed to protect sensitive apps with zero foreground lag and minimal battery impact across phones, tablets, and foldables.

          ### ✨ Highlights in v9.0.2
          - 🔑 **Interactive Security Question Recovery**: Added an in-app password recovery flow in Settings featuring lighthearted predefined questions and encrypted one-way answer storage—allowing you to safely reset your primary PIN and Pattern if forgotten while keeping your answer permanently hidden after setup.
          - 🕵️ **Unified 3-Step Decoy Credential Flow**: Managing your Fake Crash Decoy PIN and Decoy Pattern now follows the same 3-step verification flow (verify current credential ➔ enter new ➔ confirm new) as your primary lock credentials.
          - 🎨 **Refined 2×2 Theme Grid & True AMOLED Mode**: Reorganized the theme selector into a clean 2×2 grid (`System`, `Light`, `Dark`, `AMOLED Black`) and eliminated the brief navigation bar flash when resuming from Recent Apps.
          - 🚨 **Smart Security Incident Center**: Unified real-time tracking for failed unlock attempts, decoy triggers, lockouts, permission changes, and Device Admin tamper attempts—dynamically translated across all 5 supported languages (`English`, `فارسی`, `آذری`, `لری`, `مازندرانی`).

          ### 🔒 Privacy & Architecture
          - **100% Offline & Local-First**: Zero internet permissions, zero ads, and zero cloud telemetry. All credentials and security answers are hashed locally with `SHA-256`.
          - **Seamless Upgrade**: Signed with NowLock's persistent release key so you can install directly over previous versions without losing your settings or locked app list.
          RELNOTES
          gh release create v9.0.2-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "🛡️ NowLock v9.0.2 — Smart Security Recovery, AMOLED Polish & Active Defense" --notes-file /tmp/release_notes.md
