              fsh.write(lzma.decompress(base64.b64decode("".join(SHIELD_3D_XZ_B64.split()))))
          # Extract and write the 4 modular Kotlin source files for parallel Gradle compilation (~20% faster build!)
          pkg_dir = "app/src/main/java/io/nowlock/app"
          os.makedirs(pkg_dir, exist_ok=True)
          unified_src = lzma.decompress(base64.b64decode(KT_XZ_B64.encode("ascii"))).decode("utf-8")
          parts = re.split(r"// === NOWLOCK_MODULE: ([A-Za-z0-9_.]+) ===\n", unified_src)
          shared_hdr = parts[0].rstrip()
          for idx in range(1, len(parts), 2):
              mod_filename = parts[idx].strip()
              mod_body = parts[idx + 1].strip()
              mod_path = os.path.join(pkg_dir, mod_filename)
              with open(mod_path, "w", encoding="utf-8") as mf:
                  mf.write(shared_hdr + "\n\n" + mod_body + "\n")
          print("NowLock v0.1.0 modular 4-file project (SecurityEngine.kt, LockServices.kt, ThemeAndStrings.kt, MainActivityUi.kt) generated cleanly!")
      - name: Compile Optimized Release APK with JDK 17, Android 16 (API 36) & Verified Gradle 8.7
        env:
          KEYSTORE_PATH: nowlock_signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip.sha256 -o /tmp/gradle-8.7.sha256
            echo "$(cat /tmp/gradle-8.7.sha256)  /tmp/gradle-8.7.zip" | sha256sum -c -
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --parallel --no-daemon --no-build-cache --console=plain
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'RELNOTES' > /tmp/release_notes.md
          ## 🛡️ NowLock v0.1.0 (Beta) — Stage 2 Professional UI Refinement, Private PeekGuard Vault & 4-File Modular Architecture

          **Your digital privacy deserves uncompromising protection that feels clean, modern, and effortless.**
          Engineered from the ground up with **100% Native Kotlin**, **Jetpack Compose**, and **Material 3**, **NowLock v0.1.0** introduces Stage 2 Professional UI Refinement, a built-in private **PeekGuard** photo viewer, a **3D Holographic Heartbeat Shield** with cardiac pulse wave rings and floating micro-particles, and a 3-column operational security summary.

          ### 🚀 What's New in NowLock v0.1.0 (Beta)

          - ✨ **Stage 2 Professional Material 3 UI Refinement**
            Unified grouped app containers, high-contrast typography (`#A3B3C9` secondary slate on `#0A0E17` deep navy), indented hairline dividers, and zero nested-card clutter across Light, Dark, and pure AMOLED modes.

          - 🛡️ **3D Holographic Heartbeat Shield & Practical 3-Column Security Strip**
            Proportional studio 3D wireframe shield with multi-ring cardiac pulse shockwaves, 48 luminous micro-particles, and an immediate 3-column operational status strip (Locked Apps, Core Permissions, Intruder Logs).

          - 🖼️ **Built-In Private PeekGuard Vault Viewer**
            Intruder photos are encrypted with `AES-256-GCM` exclusively inside the app's private storage and displayed directly inside the Security Report tab with single-tap deletion—zero public gallery leaks.

          - ⚡ **4-File Modular Architecture & Sub-500KB Workflow**
            Split the codebase into 4 dedicated modules (`SecurityEngine.kt`, `LockServices.kt`, `ThemeAndStrings.kt`, `MainActivityUi.kt`) for faster parallel Gradle builds while keeping `build-apk.yml` compact (`~390 KB`, well under the 500 KB limit).
          RELNOTES
          if gh release view v0.1.0-nowlock --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v0.1.0-nowlock NowLock.apk --clobber --repo "${{ github.repository }}"
            gh release edit v0.1.0-nowlock --repo "${{ github.repository }}" --title "🛡️ NowLock v0.1.0 (Beta) — Stage 2 Professional UI, Private PeekGuard Vault & Modular Engine" --notes-file /tmp/release_notes.md
          else
            gh release create v0.1.0-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "🛡️ NowLock v0.1.0 (Beta) — Stage 2 Professional UI, Private PeekGuard Vault & Modular Engine" --notes-file /tmp/release_notes.md
          fi
