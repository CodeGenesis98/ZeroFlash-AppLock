            ThemeMode.DARK -> true
            ThemeMode.LIGHT -> false
            ThemeMode.SYSTEM -> {
                val nightFlags = ctx.resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK
                nightFlags == Configuration.UI_MODE_NIGHT_YES
            }
        }
    }
    fun triggerShortVibration(ctx: Context, durationMs: Long = 55L) {
        if (!isVibrationEnabled()) return
        val vib = ctx.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            vib.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
        } else {
            @Suppress("DEPRECATION")
            vib.vibrate(durationMs)
        }
    }
    private fun sha256(s: String): String =
        MessageDigest.getInstance("SHA-256").digest(("nowlock_v65_salt_" + s).toByteArray()).joinToString("") { "%02x".format(it) }
}
fun isAccessibilityServiceEnabled(context: Context): Boolean {
    val expected = ComponentName(context, NowLockAccessibilityService::class.java).flattenToString()
    val enabledServices = Settings.Secure.getString(context.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
    val splitter = TextUtils.SimpleStringSplitter(':')
    splitter.setString(enabledServices)
    while (splitter.hasNext()) {
        val component = splitter.next()
        if (component.equals(expected, ignoreCase = true)) return true
    }
    return false
}
fun isUsageStatsPermissionGranted(context: Context): Boolean {
    val appOps = context.getSystemService(Context.APP_OPS_SERVICE) as? AppOpsManager ?: return false
    val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
        appOps.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), context.packageName)
    } else {
        @Suppress("DEPRECATION")
        appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), context.packageName)
    }
    return mode == AppOpsManager.MODE_ALLOWED
}
fun pollTopPackageViaUsageStats(context: Context): Pair<String, String> {
    if (!isUsageStatsPermissionGranted(context)) return "" to ""
    val usm = context.getSystemService(Context.USAGE_STATS_SERVICE) as? UsageStatsManager ?: return "" to ""
    val now = System.currentTimeMillis()
    val events = usm.queryEvents(now - 2500L, now)
    var latestPkg = ""
    var latestClass = ""
    var latestTime = 0L
    if (events != null) {
        val event = UsageEvents.Event()
        while (events.hasNextEvent()) {
            events.getNextEvent(event)
            if (event.eventType == UsageEvents.Event.ACTIVITY_RESUMED ||
                event.eventType == UsageEvents.Event.MOVE_TO_FOREGROUND
            ) {
                val p = event.packageName ?: ""
                if (p.isNotEmpty() && p != context.packageName && event.timeStamp >= latestTime) {
                    latestTime = event.timeStamp
                    latestPkg = p
                    latestClass = event.className ?: ""
                }
            }
        }
    }
    return latestPkg to latestClass
}
// Helper to post "New App Installed: Lock with NowLock?" notification
object NewAppNotificationHelper {
    private const val CHANNEL_ID = "nowlock_new_app_prompt"
    fun showLockPromptNotification(context: Context, newPkg: String) {
        AppRepo.init(context)
        if (newPkg == context.packageName || AppRepo.getLockedPackages().contains(newPkg)) return
        val pm = context.packageManager
        val appLabel = runCatching {
            val ai = pm.getApplicationInfo(newPkg, 0)
            pm.getApplicationLabel(ai).toString()
        }.getOrNull() ?: return
        val s = getStrings(AppRepo.getAppLang())
        val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager ?: return
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val chan = NotificationChannel(
                CHANNEL_ID,
                "NowLock New App Prompt",
                NotificationManager.IMPORTANCE_HIGH
            )
            nm.createNotificationChannel(chan)
        }
        val notifId = newPkg.hashCode().and(0x7FFFFFFF)
        val lockIntent = Intent(context, NewAppLockActionReceiver::class.java).apply {
            action = "io.nowlock.app.ACTION_LOCK_NEW_APP"
            putExtra("target_pkg", newPkg)
            putExtra("notif_id", notifId)
        }
        val dismissIntent = Intent(context, NewAppLockActionReceiver::class.java).apply {
            action = "io.nowlock.app.ACTION_DISMISS_NEW_APP"
            putExtra("notif_id", notifId)
        }
        val lockPi = PendingIntent.getBroadcast(
            context,
            notifId,
            lockIntent,
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        )
        val dismissPi = PendingIntent.getBroadcast(
            context,
            notifId + 1,
            dismissIntent,
            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
        )
        val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            Notification.Builder(context, CHANNEL_ID)
        } else {
            @Suppress("DEPRECATION")
            Notification.Builder(context)
        }
        val notification = builder
            .setSmallIcon(R.drawable.ic_nowlock_logo)
            .setContentTitle(s.newAppNotifTitle + appLabel)
            .setContentText(s.newAppNotifBody)
            .setAutoCancel(true)
            .addAction(Notification.Action.Builder(R.drawable.ic_nowlock_logo, s.newAppActionLock, lockPi).build())
            .addAction(Notification.Action.Builder(R.drawable.ic_nowlock_logo, s.newAppActionDismiss, dismissPi).build())
            .build()
        runCatching { nm.notify(notifId, notification) }
    }
}
class NewAppInstallReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context?, intent: Intent?) {
        val ctx = context ?: return
        if (intent?.action != Intent.ACTION_PACKAGE_ADDED) return
        if (intent.getBooleanExtra(Intent.EXTRA_REPLACING, false)) return
        val pkg = intent.data?.schemeSpecificPart ?: return
        NewAppNotificationHelper.showLockPromptNotification(ctx, pkg)
    }
}
class NewAppLockActionReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context?, intent: Intent?) {
        val ctx = context ?: return
        AppRepo.init(ctx)
        val notifId = intent?.getIntExtra("notif_id", 0) ?: 0
        val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
        if (notifId != 0) nm?.cancel(notifId)
        if (intent?.action == "io.nowlock.app.ACTION_LOCK_NEW_APP") {
            val pkg = intent.getStringExtra("target_pkg") ?: return
            AppRepo.toggleAppLock(pkg, true)
            val s = getStrings(AppRepo.getAppLang())
            Toast.makeText(ctx, "🔒 ${s.filterLocked}: $pkg", Toast.LENGTH_SHORT).show()
        }
    }
}
// Engine 1: Instant 0ms Accessibility + UsageStats Hybrid Service (Auto-started by Android OS on boot!)
class NowLockAccessibilityService : AccessibilityService() {
    private val mainHandler = Handler(Looper.getMainLooper())
    private var isPolling = false
    private val pollRunnable = object : Runnable {
        override fun run() {
            if (!isPolling) return
            runCatching {
                val (latestPkg, latestCls) = pollTopPackageViaUsageStats(this@NowLockAccessibilityService)
                if (latestPkg.isNotEmpty() && !(latestPkg == packageName && latestCls.contains("LockScreenActivity"))) {
                    if (AppRepo.evaluateForegroundPackage(latestPkg, packageName)) {
                        AppRepo.launchLockScreenIfNeeded(this@NowLockAccessibilityService, latestPkg)
                    }
                }
            }
            mainHandler.postDelayed(this, 200L)
        }
    }
    private val dynamicReceiver = object : BroadcastReceiver() {
        override fun onReceive(context: Context?, intent: Intent?) {
            val ctx = context ?: return
            when (intent?.action) {
                Intent.ACTION_SCREEN_OFF -> AppRepo.clearAllUnlockedSessionsOnScreenOff()
                Intent.ACTION_PACKAGE_ADDED -> {
                    if (!intent.getBooleanExtra(Intent.EXTRA_REPLACING, false)) {
                        val pkg = intent.data?.schemeSpecificPart ?: return
                        NewAppNotificationHelper.showLockPromptNotification(ctx, pkg)
                    }
                }
            }
        }
    }
    override fun onServiceConnected() {
        super.onServiceConnected()
        AppRepo.init(this)
        runCatching {
            registerReceiver(dynamicReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
            val pkgFilter = IntentFilter(Intent.ACTION_PACKAGE_ADDED).apply { addDataScheme("package") }
            registerReceiver(dynamicReceiver, pkgFilter)
        }
        isPolling = true
        mainHandler.post(pollRunnable)
        NowLockMonitorService.startServiceSafely(this)
    }
    override fun onAccessibilityEvent(event: AccessibilityEvent?) {
        if (event == null) return
        if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
        AppRepo.init(this)
        val eventPkg = event.packageName?.toString() ?: return
        val cls = event.className?.toString() ?: ""
        if (eventPkg == packageName) return
        if (cls.startsWith("android.widget.") || cls.startsWith("android.view.")) return
        if (AppRepo.evaluateForegroundPackage(eventPkg, packageName)) {
            AppRepo.launchLockScreenIfNeeded(this, eventPkg)
        }
    }
    override fun onInterrupt() {}
    override fun onDestroy() {
        isPolling = false
        mainHandler.removeCallbacks(pollRunnable)
        runCatching { unregisterReceiver(dynamicReceiver) }
        super.onDestroy()
    }
}
// Engine 2: Standalone UsageStats Foreground Service (Ensures locking works on reboot & even if Accessibility is off!)
class NowLockMonitorService : Service() {
    private val handler = Handler(Looper.getMainLooper())
    private var isRunning = false
    private val pollRunnable = object : Runnable {
        override fun run() {
            if (!isRunning) return
            runCatching {
                val (latestPkg, latestCls) = pollTopPackageViaUsageStats(this@NowLockMonitorService)
                if (latestPkg.isNotEmpty() && !(latestPkg == packageName && latestCls.contains("LockScreenActivity"))) {
                    if (AppRepo.evaluateForegroundPackage(latestPkg, packageName)) {
                        AppRepo.launchLockScreenIfNeeded(this@NowLockMonitorService, latestPkg)
                    }
                }
            }
            handler.postDelayed(this, 200L)
        }
    }
    private val dynamicReceiver = object : BroadcastReceiver() {
        override fun onReceive(context: Context?, intent: Intent?) {
            val ctx = context ?: return
            when (intent?.action) {
                Intent.ACTION_SCREEN_OFF -> AppRepo.clearAllUnlockedSessionsOnScreenOff()
                Intent.ACTION_PACKAGE_ADDED -> {
                    if (!intent.getBooleanExtra(Intent.EXTRA_REPLACING, false)) {
                        val pkg = intent.data?.schemeSpecificPart ?: return
                        NewAppNotificationHelper.showLockPromptNotification(ctx, pkg)
                    }
                }
            }
        }
    }
    override fun onCreate() {
        super.onCreate()
        AppRepo.init(this)
        // Cancel any legacy ongoing notification from older versions so the notification bar stays 100% clean!
        runCatching {
            val nm = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
            nm?.cancel(1001)
        }
        runCatching {
            registerReceiver(dynamicReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
            val pkgFilter = IntentFilter(Intent.ACTION_PACKAGE_ADDED).apply { addDataScheme("package") }
            registerReceiver(dynamicReceiver, pkgFilter)
        }
        isRunning = true
        handler.post(pollRunnable)
    }
    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
        AppRepo.init(this)
        if (!isRunning) {
            isRunning = true
            handler.post(pollRunnable)
        }
        return START_STICKY
    }
    override fun onDestroy() {
        isRunning = false
        handler.removeCallbacks(pollRunnable)
        runCatching { unregisterReceiver(dynamicReceiver) }
        super.onDestroy()
    }
    override fun onBind(intent: Intent?): IBinder? = null
    companion object {
        fun startServiceSafely(ctx: Context) {
            runCatching {
                val intent = Intent(ctx, NowLockMonitorService::class.java)
                ctx.startService(intent)
            }
        }
    }
}
class BootStartupReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context?, intent: Intent?) {
        val ctx = context ?: return
        AppRepo.init(ctx)
        NowLockMonitorService.startServiceSafely(ctx)
    }
}
