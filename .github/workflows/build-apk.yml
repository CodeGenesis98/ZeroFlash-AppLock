              private var hasOverlayState = mutableStateOf(false)
              private var hasAccState = mutableStateOf(false)
              private var hasUsageState = mutableStateOf(false)
              private var hasCameraState = mutableStateOf(false)
              private var isPausedInRecentsState = mutableStateOf(false)
              override fun onPause() {
                  super.onPause()
                  isPausedInRecentsState.value = true
              }
              override fun onResume() {
                  super.onResume()
                  isPausedInRecentsState.value = false
                  hasOverlayState.value = Settings.canDrawOverlays(this)
                  hasAccState.value = isAccessibilityServiceEnabled(this)
                  hasUsageState.value = isUsageStatsPermissionGranted(this)
                  hasCameraState.value = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                  applyRecentsSecureFlag(AppRepo.isRecentsPrivacyEnabled())
                  NowLockMonitorService.startServiceSafely(this)
                  if (AppRepo.isAnyPasswordSet() &&
                      AppRepo.getLockedPackages().contains(packageName) &&
                      !AppRepo.isWithinGracePeriod(packageName) &&
                      !LockScreenActivity.isShowing
                  ) {
                      AppRepo.launchLockScreenIfNeeded(this, packageName)
                  }
              }
              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  hasCameraState.value = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
              }
              private fun requestCameraPermissionSafely() {
                  runCatching {
                      val perms = mutableListOf(Manifest.permission.CAMERA)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      ActivityCompat.requestPermissions(this, perms.toTypedArray(), 1001)
                  }.onFailure {
                      openDirectAppDetailsSettings(this)
                  }
              }
              private fun applyRecentsSecureFlag(enabled: Boolean) {
