@Composable
fun TelegramFingerprintButton(
    sizeDp: Int = 78,
    isActivePulse: Boolean,
    tintColor: Color,
    accentColor: Color,
    onClick: () -> Unit
) {
    val infiniteTransition = rememberInfiniteTransition(label = "fpPulse")
    val pulseScale by infiniteTransition.animateFloat(
        initialValue = 1.0f,
        targetValue = if (isActivePulse) 1.14f else 1.0f,
        animationSpec = infiniteRepeatable(
            animation = tween(750, easing = FastOutSlowInEasing),
            repeatMode = RepeatMode.Reverse
        ),
        label = "fpPulseScale"
    )
    val interactionSource = remember { MutableInteractionSource() }
    val isPressed by interactionSource.collectIsPressedAsState()
    val pressScale by animateFloatAsState(
        targetValue = if (isPressed) 0.85f else 1f,
        animationSpec = spring(stiffness = Spring.StiffnessHigh),
        label = "fpPress"
    )
    Box(
        contentAlignment = Alignment.Center,
        modifier = Modifier
            .size(sizeDp.dp)
            .scale(pulseScale * pressScale)
            .clip(CircleShape)
            .background(
                if (isActivePulse) accentColor.copy(alpha = 0.18f)
                else if (isPressed) tintColor.copy(alpha = 0.14f)
                else Color.Transparent
            )
            .clickable(
                interactionSource = interactionSource,
                indication = null,
                onClick = onClick
            )
    ) {
        ComposeCanvas(modifier = Modifier.size(32.dp)) {
            val stroke = 2.4.dp.toPx()
            val c = if (isActivePulse) accentColor else tintColor
            drawArc(
                color = c,
                startAngle = 195f,
                sweepAngle = 150f,
                useCenter = false,
                style = androidx.compose.ui.graphics.drawscope.Stroke(width = stroke, cap = StrokeCap.Round)
            )
            drawArc(
                color = c,
                startAngle = 180f,
                sweepAngle = 180f,
                useCenter = false,
                topLeft = Offset(size.width * 0.15f, size.height * 0.15f),
                size = androidx.compose.ui.geometry.Size(size.width * 0.7f, size.height * 0.75f),
                style = androidx.compose.ui.graphics.drawscope.Stroke(width = stroke, cap = StrokeCap.Round)
            )
            drawArc(
                color = c,
                startAngle = 170f,
                sweepAngle = 195f,
                useCenter = false,
                topLeft = Offset(size.width * 0.3f, size.height * 0.3f),
                size = androidx.compose.ui.geometry.Size(size.width * 0.4f, size.height * 0.55f),
                style = androidx.compose.ui.graphics.drawscope.Stroke(width = stroke, cap = StrokeCap.Round)
            )
            drawLine(
                color = c,
                start = Offset(size.width * 0.5f, size.height * 0.48f),
                end = Offset(size.width * 0.5f, size.height * 0.85f),
                strokeWidth = stroke,
                cap = StrokeCap.Round
            )
        }
    }
}
@Composable
fun InteractivePatternLockView(
    gridSizeDp: Int = 276,
    dotColor: Color,
    lineColor: Color,
    errorColor: Color,
    onPatternCompleted: (String, () -> Unit) -> Unit
) {
    val selectedDots = remember { mutableStateListOf<Int>() }
    var currentTouchPos by remember { mutableStateOf<Offset?>(null) }
    var isError by remember { mutableStateOf(false) }
    var boxSize by remember { mutableStateOf(IntSize.Zero) }
    fun nodeCenter(index: Int): Offset {
        val row = (index - 1) / 3
        val col = (index - 1) % 3
        val cellW = boxSize.width / 3f
        val cellH = boxSize.height / 3f
        return Offset(cellW * (col + 0.5f), cellH * (row + 0.5f))
    }
    fun checkHitNode(pos: Offset): Int? {
        if (boxSize.width == 0) return null
        val hitRadius = (boxSize.width / 6f) * 0.68f
        for (i in 1..9) {
            val c = nodeCenter(i)
            if (hypot(pos.x - c.x, pos.y - c.y) <= hitRadius) {
                return i
            }
        }
        return null
    }
    fun finishPatternAttempt() {
        if (selectedDots.size >= 4) {
            val patternStr = selectedDots.joinToString("-")
            onPatternCompleted(patternStr) {
                selectedDots.clear()
                currentTouchPos = null
                isError = false
            }
            isError = true
        } else if (selectedDots.isNotEmpty()) {
            selectedDots.clear()
            currentTouchPos = null
        }
    }
    Box(
        modifier = Modifier
            .size(gridSizeDp.dp)
            .onSizeChanged { boxSize = it }
            .pointerInput(Unit) {
                detectDragGestures(
                    onDragStart = { offset ->
                        if (isError) {
                            selectedDots.clear()
                            isError = false
                        }
                        checkHitNode(offset)?.let { node ->
                            if (!selectedDots.contains(node)) selectedDots.add(node)
                        }
                        currentTouchPos = offset
                    },
                    onDrag = { change, _ ->
                        change.consume()
                        currentTouchPos = change.position
                        checkHitNode(change.position)?.let { node ->
                            if (!selectedDots.contains(node)) {
                                selectedDots.add(node)
                            }
                        }
                    },
                    onDragEnd = {
                        currentTouchPos = null
                        finishPatternAttempt()
                    },
                    onDragCancel = {
                        currentTouchPos = null
                        selectedDots.clear()
                    }
                )
            }
            .pointerInput(Unit) {
                detectTapGestures { offset ->
                    if (isError) {
                        selectedDots.clear()
                        isError = false
                    }
                    checkHitNode(offset)?.let { node ->
                        if (!selectedDots.contains(node)) {
                            selectedDots.add(node)
                            if (selectedDots.size >= 4) {
                                finishPatternAttempt()
                            }
                        }
                    }
                }
            }
    ) {
        ComposeCanvas(modifier = Modifier.fillMaxSize()) {
            val activeLineColor = if (isError) errorColor else lineColor
            for (i in 0 until selectedDots.size - 1) {
                val start = nodeCenter(selectedDots[i])
                val end = nodeCenter(selectedDots[i + 1])
                drawLine(
                    color = activeLineColor,
                    start = start,
                    end = end,
                    strokeWidth = 4.5.dp.toPx(),
                    cap = StrokeCap.Round
                )
            }
            if (selectedDots.isNotEmpty() && currentTouchPos != null && !isError) {
                drawLine(
                    color = activeLineColor.copy(alpha = 0.65f),
                    start = nodeCenter(selectedDots.last()),
                    end = currentTouchPos!!,
                    strokeWidth = 3.5.dp.toPx(),
                    cap = StrokeCap.Round
                )
            }
            for (i in 1..9) {
                val center = nodeCenter(i)
                val isSelected = selectedDots.contains(i)
                if (isSelected) {
                    drawCircle(
                        color = activeLineColor.copy(alpha = 0.24f),
                        radius = 22.dp.toPx(),
                        center = center
                    )
                    drawCircle(
                        color = activeLineColor,
                        radius = 9.dp.toPx(),
                        center = center
                    )
                } else {
                    drawCircle(
                        color = dotColor.copy(alpha = 0.55f),
                        radius = 6.5.dp.toPx(),
                        center = center
                    )
                }
            }
        }
    }
}
data class RealAppItem(
    val label: String,
    val packageName: String,
    val iconBitmap: Bitmap,
    val isLocked: Boolean,
    val isSelfApp: Boolean = false
)
fun drawableToBitmap(drawable: Drawable): Bitmap {
    if (drawable is BitmapDrawable && drawable.bitmap != null) return drawable.bitmap
    val w = drawable.intrinsicWidth.coerceAtLeast(1)
    val h = drawable.intrinsicHeight.coerceAtLeast(1)
    val bitmap = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
    val canvas = Canvas(bitmap)
    drawable.setBounds(0, 0, canvas.width, canvas.height)
    drawable.draw(canvas)
    return bitmap
}
class MainActivity : FragmentActivity() {
    private var hasOverlayState = mutableStateOf(false)
    private var hasAccState = mutableStateOf(false)
    private var hasUsageState = mutableStateOf(false)
    private var hasCameraState = mutableStateOf(false)
    private var isPausedInRecentsState = mutableStateOf(false)
    private var isSelfLockedState = mutableStateOf(false)
    override fun onPause() {
        super.onPause()
        isPausedInRecentsState.value = true
    }
    override fun onStop() {
        super.onStop()
        if (!isChangingConfigurations && !AppRepo.isSelfSettingsGraceActive()) {
            if (AppRepo.getRelockDelayMinutes() <= 0) {
                AppRepo.unlockedSession.remove(packageName)
                AppRepo.unlockTimestamps.remove(packageName)
            }
        }
    }
    override fun onResume() {
        super.onResume()
        isPausedInRecentsState.value = false
        hasOverlayState.value = Settings.canDrawOverlays(this)
        hasAccState.value = isAccessibilityServiceEnabled(this)
        hasUsageState.value = isUsageStatsPermissionGranted(this)
        hasCameraState.value = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
        applyRecentsSecureFlag(AppRepo.isRecentsPrivacyEnabled())
        NowLockMonitorService.startServiceSafely(this)
        if (AppRepo.isAnyPasswordSet() &&
            AppRepo.getLockedPackages().contains(packageName) &&
            !AppRepo.isSelfSettingsGraceActive() &&
            !AppRepo.isWithinGracePeriod(packageName)
        ) {
            isSelfLockedState.value = true
        } else {
            isSelfLockedState.value = false
        }
    }
    override fun onWindowFocusChanged(hasFocus: Boolean) {
        super.onWindowFocusChanged(hasFocus)
        if (hasFocus) {
            hasOverlayState.value = Settings.canDrawOverlays(this)
            hasAccState.value = isAccessibilityServiceEnabled(this)
            hasUsageState.value = isUsageStatsPermissionGranted(this)
            hasCameraState.value = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
        }
    }
