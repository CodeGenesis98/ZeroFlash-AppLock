// Instant Overlay Lock Bridge (Attaches a visible SYSTEM_ALERT_WINDOW shield in 0ms so Android 14/15 ALWAYS allows LockScreenActivity to launch over third-party apps!)
object OverlayLockBridge {
    private val mainHandler = Handler(Looper.getMainLooper())
    private var shieldView: FrameLayout? = null
    private var isShieldAttached = false
    fun showShieldAndLaunchLockActivity(ctx: Context, targetPkg: String) {
        if (AppRepo.isWithinGracePeriod(targetPkg) || LockScreenActivity.isShowing) return
        mainHandler.post {
            if (AppRepo.isWithinGracePeriod(targetPkg) || LockScreenActivity.isShowing) return@post
            val appCtx = ctx.applicationContext
            // Attach a tiny 1x1 invisible overlay token for 150ms solely to grant Android 14/15 BAL exemption without blocking touches!
            if (Settings.canDrawOverlays(appCtx) && !isShieldAttached) {
                runCatching {
                    val wm = appCtx.getSystemService(Context.WINDOW_SERVICE) as? WindowManager
                    if (wm != null) {
                        val tokenView = FrameLayout(appCtx)
                        val lp = WindowManager.LayoutParams(
                            1,
                            1,
                            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                                WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                            PixelFormat.TRANSLUCENT
                        ).apply {
                            gravity = Gravity.TOP or Gravity.START
                        }
                        wm.addView(tokenView, lp)
                        shieldView = tokenView
                        isShieldAttached = true
                    }
                }
            }
            startLockActivityNow(ctx, targetPkg)
            mainHandler.postDelayed({
                dismissShield(appCtx)
            }, 220L)
        }
    }
    private fun startLockActivityNow(ctx: Context, targetPkg: String) {
        val intent = Intent(ctx, LockScreenActivity::class.java).apply {
            addFlags(
                Intent.FLAG_ACTIVITY_NEW_TASK or
                Intent.FLAG_ACTIVITY_CLEAR_TOP or
                Intent.FLAG_ACTIVITY_SINGLE_TOP or
                Intent.FLAG_ACTIVITY_NO_ANIMATION or
                Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS
            )
            putExtra("target_pkg", targetPkg)
        }
        runCatching {
            val pi = PendingIntent.getActivity(
                ctx,
                targetPkg.hashCode(),
                intent,
                PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
            )
            pi.send()
        }
        runCatching { ctx.startActivity(intent) }
    }
    fun dismissShield(ctx: Context) {
        mainHandler.post {
            val v = shieldView ?: return@post
            if (isShieldAttached) {
                runCatching {
                    val wm = ctx.applicationContext.getSystemService(Context.WINDOW_SERVICE) as? WindowManager
                    wm?.removeViewImmediate(v)
                }
            }
            isShieldAttached = false
            shieldView = null
        }
    }
}
// Real Silent Front-Camera Intruder Photo Saver -> Saves directly to Phone Gallery (Pictures/NowLock_Intruders)
object IntruderPhotoSaver {
    fun captureFrontCameraToGallery(context: Context, targetPkg: String) {
        if (ContextCompat.checkSelfPermission(context, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
            return
        }
        val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as? CameraManager ?: return
        val frontCameraId = runCatching {
            cameraManager.cameraIdList.firstOrNull { id ->
                val chars = cameraManager.getCameraCharacteristics(id)
                chars.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_FRONT
            } ?: cameraManager.cameraIdList.firstOrNull()
        }.getOrNull() ?: return
        val bgThread = HandlerThread("NowLockIntruderCam").apply { start() }
        val bgHandler = Handler(bgThread.looper)
        runCatching {
            val imageReader = ImageReader.newInstance(640, 480, ImageFormat.JPEG, 2)
            val dummyTexture = SurfaceTexture(10).apply { setDefaultBufferSize(640, 480) }
            val dummySurface = Surface(dummyTexture)
            imageReader.setOnImageAvailableListener({ reader ->
                val image = runCatching { reader.acquireLatestImage() }.getOrNull()
                if (image != null) {
                    runCatching {
                        val buffer = image.planes[0].buffer
                        val bytes = ByteArray(buffer.remaining())
                        buffer.get(bytes)
                        saveJpegBytesToGallery(context, bytes, targetPkg)
                    }
                    runCatching { image.close() }
                }
                runCatching { dummySurface.release() }
                runCatching { dummyTexture.release() }
                runCatching { reader.close() }
                runCatching { bgThread.quitSafely() }
            }, bgHandler)
            cameraManager.openCamera(frontCameraId, object : CameraDevice.StateCallback() {
                override fun onOpened(camera: CameraDevice) {
                    runCatching {
                        val targets = listOf(dummySurface, imageReader.surface)
                        @Suppress("DEPRECATION")
                        camera.createCaptureSession(targets, object : CameraCaptureSession.StateCallback() {
                            override fun onConfigured(session: CameraCaptureSession) {
                                runCatching {
                                    val previewReq = camera.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW).apply {
                                        addTarget(dummySurface)
                                        set(CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                                        set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)
                                    }.build()
                                    session.setRepeatingRequest(previewReq, null, bgHandler)
                                    bgHandler.postDelayed({
                                        runCatching {
                                            val stillReq = camera.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE).apply {
                                                addTarget(imageReader.surface)
                                                set(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_ON)
                                                set(CaptureRequest.JPEG_ORIENTATION, 270)
                                            }.build()
                                            session.capture(stillReq, object : CameraCaptureSession.CaptureCallback() {
                                                override fun onCaptureCompleted(
                                                    s: CameraCaptureSession,
                                                    r: CaptureRequest,
                                                    res: android.hardware.camera2.TotalCaptureResult
                                                ) {
                                                    bgHandler.postDelayed({ runCatching { camera.close() } }, 150L)
                                                }
                                            }, bgHandler)
                                        }.onFailure { runCatching { camera.close() } }
                                    }, 350L)
                                }.onFailure { runCatching { camera.close() } }
                            }
                            override fun onConfigureFailed(session: CameraCaptureSession) {
                                runCatching { camera.close() }
                                runCatching { bgThread.quitSafely() }
                            }
                        }, bgHandler)
                    }.onFailure {
                        runCatching { camera.close() }
                        runCatching { bgThread.quitSafely() }
                    }
                }
                override fun onDisconnected(camera: CameraDevice) {
                    runCatching { camera.close() }
                    runCatching { bgThread.quitSafely() }
                }
                override fun onError(camera: CameraDevice, error: Int) {
                    runCatching { camera.close() }
                    runCatching { bgThread.quitSafely() }
                }
            }, bgHandler)
        }.onFailure {
            runCatching { bgThread.quitSafely() }
        }
    }
    private fun saveJpegBytesToGallery(context: Context, jpegBytes: ByteArray, targetPkg: String) {
        val originalBmp = BitmapFactory.decodeByteArray(jpegBytes, 0, jpegBytes.size) ?: return
        val finalBmp = if (originalBmp.width > originalBmp.height) {
            val matrix = Matrix().apply { postRotate(270f) }
            Bitmap.createBitmap(originalBmp, 0, 0, originalBmp.width, originalBmp.height, matrix, true)
        } else {
            originalBmp
        }
        val timestamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
        val filename = "NowLock_Intruder_${timestamp}.jpg"
        val resolver = context.contentResolver
        val contentValues = ContentValues().apply {
            put(MediaStore.Images.Media.DISPLAY_NAME, filename)
            put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
            put(MediaStore.Images.Media.TITLE, "NowLock Intruder ($targetPkg)")
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/NowLock_Intruders")
                put(MediaStore.Images.Media.IS_PENDING, 1)
            }
        }
        val imageUri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, contentValues) ?: return
        var outStream: OutputStream? = null
        runCatching {
            outStream = resolver.openOutputStream(imageUri)
            outStream?.let { finalBmp.compress(Bitmap.CompressFormat.JPEG, 92, it) }
        }
        runCatching { outStream?.close() }
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
            val updateValues = ContentValues().apply {
                put(MediaStore.Images.Media.IS_PENDING, 0)
            }
            runCatching { resolver.update(imageUri, updateValues, null, null) }
        }
    }
}
object AppRepo {
    private const val PREFS_NAME = "nowlock_v65_prefs"
    private const val KEY_PIN_HASH = "nowlock_pin_hash"
    private const val KEY_PATTERN_HASH = "nowlock_pattern_hash"
    private const val KEY_COMBO_MODE = "nowlock_combo_mode"
    private const val KEY_FINGERPRINT_ENABLED = "nowlock_fp_enabled"
    private const val KEY_ICON_MODE = "nowlock_icon_mode"
    private const val KEY_RELOCK_MINUTES = "nowlock_relock_minutes"
    private const val KEY_RECENTS_PRIVACY = "nowlock_recents_privacy"
    private const val KEY_LOCKED_PKGS = "nowlock_locked_pkgs"
    private const val KEY_LOCKED_PKGS_CSV = "nowlock_locked_pkgs_csv"
    private const val KEY_THEME_MODE = "nowlock_theme_mode"
    private const val KEY_APP_LANG = "nowlock_app_lang_v76"
    private const val KEY_VIBRATE = "nowlock_vibrate_on_error"
    private const val KEY_INTRUDER = "nowlock_intruder_selfie"
    private const val KEY_INTRUDER_COUNT = "nowlock_intruder_count"
    private const val KEY_UNINSTALL = "nowlock_uninstall_protect"
    private lateinit var prefs: SharedPreferences
    private val lockedMemorySet = ConcurrentHashMap.newKeySet<String>()
    val unlockedSession = ConcurrentHashMap.newKeySet<String>()
    val unlockTimestamps = ConcurrentHashMap<String, Long>()
    @Volatile var lastActivePackage: String = ""
    @Volatile var lastLockShownTime: Long = 0L
    @Volatile var settingsNavigationGraceUntil: Long = 0L
    fun markLeavingForSettings(ctx: Context) {
        val now = System.currentTimeMillis()
        settingsNavigationGraceUntil = now + 90_000L
        unlockedSession.add(ctx.packageName)
        unlockTimestamps[ctx.packageName] = now
    }
    fun isSelfSettingsGraceActive(): Boolean = System.currentTimeMillis() < settingsNavigationGraceUntil
    fun init(ctx: Context) {
        if (!::prefs.isInitialized) {
            val storageCtx = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && ctx.isDeviceProtectedStorage) {
                ctx
            } else {
                ctx.applicationContext ?: ctx
            }
            prefs = storageCtx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
            reloadLockedPackagesFromPrefs()
        }
    }
    private fun reloadLockedPackagesFromPrefs() {
        val csv = prefs.getString(KEY_LOCKED_PKGS_CSV, null)
        if (csv != null) {
            lockedMemorySet.clear()
            csv.split(",").map { it.trim() }.filter { it.isNotEmpty() }.forEach { lockedMemorySet.add(it) }
        } else {
            val legacy = prefs.getStringSet(KEY_LOCKED_PKGS, emptySet()) ?: emptySet()
            lockedMemorySet.clear()
            lockedMemorySet.addAll(legacy)
            if (legacy.isNotEmpty()) {
                prefs.edit().putString(KEY_LOCKED_PKGS_CSV, legacy.joinToString(",")).commit()
            }
        }
    }
    fun getLockedPackages(): Set<String> {
        reloadLockedPackagesFromPrefs()
        return lockedMemorySet.toSet()
    }
    fun isPinSet(): Boolean = prefs.getString(KEY_PIN_HASH, null) != null
    fun isPatternSet(): Boolean = prefs.getString(KEY_PATTERN_HASH, null) != null
    fun isAnyPasswordSet(): Boolean = isPinSet() || isPatternSet()
    fun setPin(pin: String) {
        prefs.edit().putString(KEY_PIN_HASH, sha256("pin_" + pin)).commit()
    }
    fun verifyPin(pin: String): Boolean {
        val saved = prefs.getString(KEY_PIN_HASH, null) ?: return false
        return sha256("pin_" + pin) == saved
    }
    fun setPattern(patternStr: String) {
        prefs.edit().putString(KEY_PATTERN_HASH, sha256("pat_" + patternStr)).commit()
    }
    fun verifyPattern(patternStr: String): Boolean {
        val saved = prefs.getString(KEY_PATTERN_HASH, null) ?: return false
        return sha256("pat_" + patternStr) == saved
    }
    fun getComboMode(): LockComboMode =
        runCatching {
            LockComboMode.valueOf(prefs.getString(KEY_COMBO_MODE, LockComboMode.PIN_FINGERPRINT.name) ?: LockComboMode.PIN_FINGERPRINT.name)
        }.getOrDefault(LockComboMode.PIN_FINGERPRINT)
    fun setComboMode(m: LockComboMode) {
        prefs.edit().putString(KEY_COMBO_MODE, m.name).commit()
    }
    fun isFingerprintEnabled(): Boolean = prefs.getBoolean(KEY_FINGERPRINT_ENABLED, true)
    fun setFingerprintEnabled(enabled: Boolean) {
        prefs.edit().putBoolean(KEY_FINGERPRINT_ENABLED, enabled).commit()
    }
    fun getRelockDelayMinutes(): Int = prefs.getInt(KEY_RELOCK_MINUTES, 0)
    fun setRelockDelayMinutes(minutes: Int) {
        prefs.edit().putInt(KEY_RELOCK_MINUTES, minutes).commit()
    }
    fun isRecentsPrivacyEnabled(): Boolean = prefs.getBoolean(KEY_RECENTS_PRIVACY, true)
    fun setRecentsPrivacyEnabled(enabled: Boolean) {
        prefs.edit().putBoolean(KEY_RECENTS_PRIVACY, enabled).commit()
    }
    fun getIconMode(): AppIconMode =
        runCatching {
            AppIconMode.valueOf(prefs.getString(KEY_ICON_MODE, AppIconMode.PADLOCK.name) ?: AppIconMode.PADLOCK.name)
        }.getOrDefault(AppIconMode.PADLOCK)
    fun setIconMode(ctx: Context, mode: AppIconMode) {
        prefs.edit().putString(KEY_ICON_MODE, mode.name).commit()
        val pm = ctx.packageManager
        val defaultAlias = ComponentName(ctx, "io.nowlock.app.LauncherDefaultAlias")
        val calcAlias = ComponentName(ctx, "io.nowlock.app.LauncherCalculatorAlias")
        if (mode == AppIconMode.PADLOCK) {
            pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
            pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
        } else {
            pm.setComponentEnabledSetting(calcAlias, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP)
            pm.setComponentEnabledSetting(defaultAlias, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
        }
    }
    fun toggleAppLock(pkg: String, lock: Boolean) {
        reloadLockedPackagesFromPrefs()
        if (lock) {
            lockedMemorySet.add(pkg)
            unlockedSession.remove(pkg)
            unlockTimestamps.remove(pkg)
        } else {
            lockedMemorySet.remove(pkg)
            unlockedSession.remove(pkg)
            unlockTimestamps.remove(pkg)
        }
        val csv = lockedMemorySet.joinToString(",")
        prefs.edit()
            .putString(KEY_LOCKED_PKGS_CSV, csv)
            .putStringSet(KEY_LOCKED_PKGS, HashSet(lockedMemorySet))
            .commit()
    }
    fun markUnlocked(pkg: String) {
        val now = System.currentTimeMillis()
        unlockedSession.add(pkg)
        unlockTimestamps[pkg] = now
        prefs.edit().putLong("unlock_ts_$pkg", now).commit()
        if (pkg.isNotEmpty()) {
            lastActivePackage = pkg
        }
    }
    fun isWithinGracePeriod(pkg: String): Boolean {
        if (pkg.isEmpty()) return true
        val now = System.currentTimeMillis()
        val lastTs = unlockTimestamps[pkg] ?: prefs.getLong("unlock_ts_$pkg", 0L)
        // Always grant a 4.5-second post-unlock transition immunity so closing the lock screen never re-locks the app!
        if (lastTs > 0L && (now - lastTs) < 4500L) {
            unlockedSession.add(pkg)
            return true
        }
        val delayMin = getRelockDelayMinutes()
        if (delayMin <= 0) {
            return unlockedSession.contains(pkg)
        }
        val windowMs = delayMin * 60_000L
        if (lastTs <= 0L) return false
        val valid = (now - lastTs) < windowMs
        if (!valid) {
            unlockedSession.remove(pkg)
            unlockTimestamps.remove(pkg)
        }
        return valid
    }
    fun clearAllUnlockedSessionsOnScreenOff() {
        if (getRelockDelayMinutes() <= 0) {
            unlockedSession.clear()
            unlockTimestamps.clear()
            lastActivePackage = ""
        }
    }
    fun isIgnoredSystemOrOverlayPackage(pkg: String, myPkg: String): Boolean {
        if (pkg.isBlank() || pkg == myPkg || pkg == "android") return true
        val lower = pkg.lowercase()
        return lower.contains("systemui") ||
            lower.contains("inputmethod") ||
            lower.contains("keyboard") ||
            lower.contains("honeyboard") ||
            lower.contains("biometric") ||
            lower.contains("permissioncontroller") ||
            lower.contains("cocktailbarservice") ||
            lower.contains("packageinstaller") ||
            lower.contains("FloatingFeature".lowercase()) ||
            lower.contains("samsung.android.app.aodservice") ||
            lower.contains("sec.android.app.SmartClip")
    }
    fun isHomeLauncherPackage(pkg: String): Boolean {
        val lower = pkg.lowercase()
        return lower.contains("launcher") ||
            lower.contains("miui.home") ||
            lower.contains("oppo.launcher") ||
            lower.contains("huawei.android.launcher") ||
            lower == "com.sec.android.app.launcher" ||
            lower == "com.google.android.apps.nexuslauncher"
    }
    fun evaluateForegroundPackage(pkg: String, myPkg: String): Boolean {
        // Never evaluate NowLock itself or system overlays in background services!
        // NowLock's own lock screen is handled directly inside MainActivity without task switching.
        if (isIgnoredSystemOrOverlayPackage(pkg, myPkg)) {
            return false
        }
        if (LockScreenActivity.isShowing) {
            return false
        }
        if (!isAnyPasswordSet()) return false
        val now = System.currentTimeMillis()
        val delayMin = getRelockDelayMinutes()
        val prevPkg = lastActivePackage
        if (prevPkg.isNotEmpty() && prevPkg != pkg) {
            val prevUnlockTs = unlockTimestamps[prevPkg] ?: prefs.getLong("unlock_ts_$prevPkg", 0L)
            val isPastTransitionImmunity = (now - prevUnlockTs) >= 4500L
            if (delayMin <= 0 && isPastTransitionImmunity) {
                if (isHomeLauncherPackage(pkg)) {
                    // Clear unlocked third-party apps whose 4.5s transition immunity has passed
                    val toRemove = unlockedSession.filter { itemPkg ->
                        val ts = unlockTimestamps[itemPkg] ?: 0L
                        (now - ts) >= 4500L
                    }
                    unlockedSession.removeAll(toRemove.toSet())
                } else {
                    unlockedSession.remove(prevPkg)
                }
            }
        }
        if (!isHomeLauncherPackage(pkg)) {
            lastActivePackage = pkg
        }
        val lockedSet = getLockedPackages()
        if (!lockedSet.contains(pkg)) return false
        return !isWithinGracePeriod(pkg)
    }
    fun launchLockScreenIfNeeded(ctx: Context, targetPkg: String) {
        val now = System.currentTimeMillis()
        if (now - lastLockShownTime < 300L && LockScreenActivity.activeTargetPkg == targetPkg && LockScreenActivity.isShowing) {
            return
        }
        lastLockShownTime = now
        if (targetPkg == ctx.packageName) {
            val intent = Intent(ctx, LockScreenActivity::class.java).apply {
                addFlags(
                    Intent.FLAG_ACTIVITY_NEW_TASK or
                    Intent.FLAG_ACTIVITY_CLEAR_TOP or
                    Intent.FLAG_ACTIVITY_SINGLE_TOP or
                    Intent.FLAG_ACTIVITY_NO_ANIMATION
                )
                putExtra("target_pkg", targetPkg)
            }
            runCatching { ctx.startActivity(intent) }
        } else {
            OverlayLockBridge.showShieldAndLaunchLockActivity(ctx, targetPkg)
        }
    }
