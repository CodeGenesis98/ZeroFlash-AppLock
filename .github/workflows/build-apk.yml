                                          "• Accessibility & Usage Access: Used exclusively to detect when a protected app enters the foreground so the lock screen can be displayed immediately.\n• Camera Permission: Used only when Intruder Selfie is enabled to save a photo to your local Gallery after 3 failed password or fingerprint attempts.",
                                      "4. Zero Telemetry, Zero Ads & Full Data Ownership" to
                                          "NowLock contains no third-party analytics, no advertising SDKs, and no background telemetry. Intruder photos are stored locally in your device's Gallery under your complete control.",
                                      "5. Terms of Use & Security Updates" to
                                          "Users are responsible for remembering their configured PIN or Pattern. Official updates are signed with a persistent cryptographic key so updates install seamlessly without erasing your settings."
                                  )
                              }
                              sections.forEach { (heading, body) ->
                                  Text(heading, color = accentBlue, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                                  Text(body, color = subColor, fontSize = 12.5.sp, lineHeight = 20.sp)
                              }
                          }
                          Spacer(Modifier.height(12.dp))
                          Button(
                              onClick = onDismiss,
                              modifier = Modifier.fillMaxWidth().height(46.dp),
                              shape = RoundedCornerShape(14.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = accentBlue)
                          ) {
                              Text(s.btnClose, color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }
          @Composable
          fun MinimalSectionCard(
              title: String,
              cardColor: Color,
              borderColor: Color,
              txtColor: Color,
              content: @Composable ColumnScope.() -> Unit
          ) {
