              private val appPaletteCache = ConcurrentHashMap<String, List<Color>>()
              fun getOrExtractAppColorPalette(ctx: Context, pkg: String): List<Color> {
                  val key = if (pkg.isBlank()) ctx.packageName else pkg
                  appPaletteCache[key]?.let { return it }
                  val extracted = runCatching {
                      val d = ctx.packageManager.getApplicationIcon(key)
                      val bmp = Bitmap.createBitmap(28, 28, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bmp)
                      d.setBounds(0, 0, 28, 28)
                      d.draw(canvas)
                      val hsv = FloatArray(3)
                      val distinctHues = mutableListOf<Pair<Float, Color>>()
                      for (y in 2 until 26 step 2) {
                          for (x in 2 until 26 step 2) {
                              val px = bmp.getPixel(x, y)
                              val a = android.graphics.Color.alpha(px)
                              if (a < 150) continue
                              android.graphics.Color.colorToHSV(px, hsv)
                              val sat = hsv[1]
                              val v = hsv[2]
                              if (v < 0.16f || (sat < 0.14f && v > 0.88f)) continue
                              hsv[1] = (sat * 1.28f).coerceIn(0.58f, 0.95f)
                              hsv[2] = v.coerceIn(0.62f, 0.90f)
                              val c = Color(android.graphics.Color.HSVToColor(hsv))
                              distinctHues.add(hsv[0] to c)
                          }
                      }
                      if (distinctHues.isEmpty()) {
                          listOf(Color(0xFF10B981), Color(0xFF059669), Color(0xFF34D399), Color(0xFF0D9488))
                      } else {
                          val sorted = distinctHues.sortedBy { it.first }
                          val baseH = sorted[sorted.size / 2].first
                          val c1 = sorted.first().second
                          val c2 = sorted[sorted.size / 2].second
                          val c3 = sorted.last().second
                          // Add rich harmonic neighbor hues derived from the app's dominant color so movement is always vivid and visible!
                          val harmonic1 = Color(android.graphics.Color.HSVToColor(floatArrayOf((baseH + 42f) % 360f, 0.78f, 0.84f)))
                          val harmonic2 = Color(android.graphics.Color.HSVToColor(floatArrayOf((baseH + 315f) % 360f, 0.82f, 0.72f)))
                          listOf(c1, c2, harmonic1, harmonic2, c3).distinct()
                      }
                  }.getOrDefault(listOf(Color(0xFF10B981), Color(0xFF059669), Color(0xFF34D399), Color(0xFF0D9488)))
                  appPaletteCache[key] = extracted
                  return extracted
              }
