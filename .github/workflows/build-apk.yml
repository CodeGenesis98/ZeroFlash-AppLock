              fsh.write(lzma.decompress(base64.b64decode("".join(SHIELD_3D_XZ_B64.split()))))
          # Extract and write the 4 modular Kotlin source files for parallel Gradle compilation (~20% faster build!)
          pkg_dir = "app/src/main/java/io/nowlock/app"
          os.makedirs(pkg_dir, exist_ok=True)
          unified_src = lzma.decompress(base64.b64decode(KT_XZ_B64.encode("ascii"))).decode("utf-8")
          parts = re.split(r"// === NOWLOCK_MODULE: ([A-Za-z0-9_.]+) ===\n", unified_src)
          shared_hdr = parts[0].rstrip()
          for idx in range(1, len(parts), 2):
              mod_filename = parts[idx].strip()
              mod_body = parts[idx + 1].strip()
              mod_path = os.path.join(pkg_dir, mod_filename)
              with open(mod_path, "w", encoding="utf-8") as mf:
                  mf.write(shared_hdr + "\n\n" + mod_body + "\n")
          print("NowLock v0.1.1 modular 4-file project (SecurityEngine.kt, LockServices.kt, ThemeAndStrings.kt, MainActivityUi.kt) generated cleanly!")

      - name: Build Signed Release APK with Gradle 8.7
        env:
          KEYSTORE_PATH: nowlock_signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.NOWLOCK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOWLOCK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOWLOCK_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip.sha256 -o /tmp/gradle-8.7.sha256
            echo "$(cat /tmp/gradle-8.7.sha256)  /tmp/gradle-8.7.zip" | sha256sum -c -
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --parallel --no-daemon --no-build-cache --console=plain
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk

      - name: Upload NowLock-Release-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowLock-Release-APK
          path: NowLock.apk
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.1-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.1.0-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          cat << 'RELNOTES' > /tmp/release_notes.md
          ## 🛡️ NowLock v0.1.1 (Beta) — Native Android Material 3 Settings UI, Frameless 3D Security Shield & Stable Apps List

          - ✨ **Authentic Native Android Material 3 Settings UI**: Calm dark slate (`#0F1115`) and matte grouped settings cards (`#1B1F26`), unified Android System Blue (`#669DF6` / `#4285F4`), standard Material 3 switches, and clean borderless Lock Screen pattern/PIN controls.
          - 🛡️ **Frameless Sculpted 3D Security Shield**: Removed the outer box and card frame around the Security Report shield; redesigned as a multi-faceted vector shield floating directly on the screen.
          - 🧭 **Dynamic Bottom Navigation Bar Icons**: Added dedicated vector icons above all 4 tabs (`Apps`, `Settings`, `Security Report`, `About`) that smoothly transition from Outlined (inactive) to Filled + Material 3 pill indicator (active).
          - ⚡ **Fixed Apps List Jumping & Viewport Bugs**: Eliminated list re-sorting on toggle so apps stay in place when locked/unlocked, made full app rows clickable, moved routine/filter headers inside the scrollable list for full-screen scrolling, and prevented UI thread blocking on startup.
          RELNOTES
          gh release create v0.1.1-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "🛡️ NowLock v0.1.1 (Beta) — Native Android Material 3 UI, Frameless Shield & Stable Apps List" --notes-file /tmp/release_notes.md --latest
