          @Composable
          fun PinSetupDialog(
              s: UiStrings,
              isDecoySetup: Boolean = false,
              onDismiss: () -> Unit,
              onSavePin: (String) -> Unit
          ) {
              val context = LocalContext.current
              val hasOldPin = remember { if (isDecoySetup) false else AppRepo.isPinSet() }
              // step 0 = verify old PIN, step 1 = enter new PIN, step 2 = confirm new PIN
              var step by remember { mutableStateOf(if (hasOldPin) 0 else 1) }
              var pinInput by remember { mutableStateOf("") }
              var firstNewPin by remember { mutableStateOf("") }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              val titleText = when (step) {
                  0 -> s.dlgPinVerifyOldTitle
                  1 -> s.dlgPinTitle
                  else -> s.dlgPinConfirmTitle
              }
              val subText = errorMsg ?: when (step) {
                  0 -> s.dlgPinVerifyOldSub
                  1 -> s.dlgPinSub
                  else -> s.dlgPinConfirmSub
              }
              fun handleAction() {
                  if (pinInput.length != 4) return
                  when (step) {
                      0 -> {
                          if (AppRepo.verifyPin(pinInput)) {
                              errorMsg = null
                              pinInput = ""
                              step = 1
                          } else {
                              AppRepo.triggerShortVibration(context, 60L)
                              errorMsg = s.lockWrongAttempt
                              pinInput = ""
                          }
                      }
                      1 -> {
                          if (isDecoySetup && AppRepo.verifyPin(pinInput)) {
                              AppRepo.triggerShortVibration(context, 60L)
                              errorMsg = s.dlgMismatchError
                              pinInput = ""
                          } else {
                              firstNewPin = pinInput
                              errorMsg = null
                              pinInput = ""
                              step = 2
                          }
                      }
                      2 -> {
                          if (pinInput == firstNewPin) {
                              AppRepo.resetFailedAttempts()
                              onSavePin(pinInput)
                          } else {
                              AppRepo.triggerShortVibration(context, 60L)
                              errorMsg = s.dlgMismatchError
                              firstNewPin = ""
                              pinInput = ""
                              step = 1
                          }
                      }
                  }
              }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Text(titleText, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                  },
                  text = {
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                          Text(
                              text = subText,
                              color = if (errorMsg != null) Color(0xFFEF4444) else Color.Unspecified,
                              fontSize = 12.sp,
                              textAlign = TextAlign.Center
                          )
                          Spacer(Modifier.height(12.dp))
                          Text(
                              text = pinInput.padEnd(4, '○'),
                              fontSize = 26.sp,
                              fontWeight = FontWeight.Bold,
                              color = if (errorMsg != null) Color(0xFFEF4444) else Color(0xFF5D56F5)
                          )
                          Spacer(Modifier.height(12.dp))
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              val rows = listOf(listOf(1, 2, 3), listOf(4, 5, 6), listOf(7, 8, 9))
                              rows.forEach { r ->
                                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.padding(vertical = 4.dp)) {
                                      r.forEach { d ->
                                          OutlinedButton(
                                              onClick = {
                                                  if (pinInput.length < 4) {
                                                      errorMsg = null
                                                      pinInput += d.toString()
                                                  }
                                              },
                                              modifier = Modifier.size(52.dp),
                                              shape = CircleShape,
                                              contentPadding = PaddingValues(0.dp)
                                          ) {
                                              Text(d.toString(), fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.padding(top = 4.dp)) {
                                  OutlinedButton(
                                      onClick = {
                                          if (pinInput.isNotEmpty()) {
                                              errorMsg = null
                                              pinInput = pinInput.dropLast(1)
                                          }
                                      },
                                      modifier = Modifier.size(52.dp),
                                      shape = CircleShape,
                                      contentPadding = PaddingValues(0.dp)
                                  ) {
                                      Text("⌫", fontSize = 16.sp)
                                  }
                                  OutlinedButton(
                                      onClick = {
                                          if (pinInput.length < 4) {
                                              errorMsg = null
                                              pinInput += "0"
                                          }
                                      },
                                      modifier = Modifier.size(52.dp),
                                      shape = CircleShape,
                                      contentPadding = PaddingValues(0.dp)
                                  ) {
                                      Text("0", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.size(52.dp))
                              }
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          enabled = pinInput.length == 4,
                          onClick = { handleAction() }
                      ) {
                          Text(if (step == 2) s.btnSave else s.btnNext)
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text(s.btnCancel)
                      }
                  }
              )
          }
          // 3-Step Continuous Touch-Drag Pattern Setup Dialog (Verify Old -> Draw New -> Confirm New)
          @Composable
          fun PatternSetupDialog(
              s: UiStrings,
              isDecoySetup: Boolean = false,
              onDismiss: () -> Unit,
              onSavePattern: (String) -> Unit
          ) {
              val context = LocalContext.current
              val hasOldPattern = remember { if (isDecoySetup) false else AppRepo.isPatternSet() }
              var step by remember { mutableStateOf(if (hasOldPattern) 0 else 1) }
              val selectedNodes = remember { mutableStateListOf<Int>() }
              var firstNewPattern by remember { mutableStateOf("") }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              var currentTouchPos by remember { mutableStateOf<Offset?>(null) }
              var boxSize by remember { mutableStateOf(IntSize.Zero) }
              val titleText = when (step) {
                  0 -> s.dlgPatternVerifyOldTitle
                  1 -> s.dlgPatternTitle
                  else -> s.dlgPatternConfirmTitle
              }
              val subText = errorMsg ?: when (step) {
                  0 -> s.dlgPatternVerifyOldSub
                  1 -> "${s.dlgPatternSub} (${selectedNodes.size})"
                  else -> "${s.dlgPatternConfirmSub} (${selectedNodes.size})"
              }
              fun nodeCenter(index: Int): Offset {
                  val row = (index - 1) / 3
                  val col = (index - 1) % 3
                  val cellW = boxSize.width / 3f
                  val cellH = boxSize.height / 3f
                  return Offset(cellW * (col + 0.5f), cellH * (row + 0.5f))
              }
              fun checkHitNode(pos: Offset): Int? {
                  if (boxSize.width == 0) return null
                  val hitRadius = (boxSize.width / 6f) * 0.68f
                  for (i in 1..9) {
                      val c = nodeCenter(i)
                      if (hypot(pos.x - c.x, pos.y - c.y) <= hitRadius) {
                          return i
                      }
                  }
                  return null
              }
              fun handlePatternAction() {
                  if (selectedNodes.size < 4) return
                  val patStr = selectedNodes.joinToString("-")
                  when (step) {
                      0 -> {
                          if (AppRepo.verifyPattern(patStr)) {
                              errorMsg = null
                              selectedNodes.clear()
                              currentTouchPos = null
                              step = 1
                          } else {
                              AppRepo.triggerShortVibration(context, 60L)
                              errorMsg = s.lockWrongAttempt
                              selectedNodes.clear()
                              currentTouchPos = null
                          }
                      }
                      1 -> {
                          if (isDecoySetup && AppRepo.verifyPattern(patStr)) {
                              AppRepo.triggerShortVibration(context, 60L)
                              errorMsg = s.dlgMismatchError
                              selectedNodes.clear()
                              currentTouchPos = null
                          } else {
                              firstNewPattern = patStr
                              errorMsg = null
                              selectedNodes.clear()
                              currentTouchPos = null
                              step = 2
                          }
                      }
                      2 -> {
                          if (patStr == firstNewPattern) {
                              AppRepo.resetFailedAttempts()
                              onSavePattern(patStr)
                          } else {
                              AppRepo.triggerShortVibration(context, 60L)
                              errorMsg = s.dlgMismatchError
                              firstNewPattern = ""
                              selectedNodes.clear()
                              currentTouchPos = null
                              step = 1
                          }
                      }
                  }
              }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Text(titleText, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                  },
                  text = {
                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                          Text(
                              text = subText,
                              color = if (errorMsg != null) Color(0xFFEF4444) else Color.Unspecified,
                              fontSize = 12.sp,
                              textAlign = TextAlign.Center
                          )
                          Spacer(Modifier.height(14.dp))
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              Box(
                                  modifier = Modifier
                                      .size(230.dp)
                                      .onSizeChanged { boxSize = it }
                                      .pointerInput(Unit) {
                                          detectDragGestures(
                                              onDragStart = { offset ->
                                                  errorMsg = null
                                                  selectedNodes.clear()
                                                  checkHitNode(offset)?.let { node ->
                                                      if (!selectedNodes.contains(node)) selectedNodes.add(node)
                                                  }
                                                  currentTouchPos = offset
                                              },
                                              onDrag = { change, _ ->
                                                  change.consume()
                                                  currentTouchPos = change.position
                                                  checkHitNode(change.position)?.let { node ->
                                                      if (!selectedNodes.contains(node)) {
                                                          selectedNodes.add(node)
                                                      }
                                                  }
                                              },
                                              onDragEnd = {
                                                  currentTouchPos = null
                                                  if (selectedNodes.size < 4) {
                                                      selectedNodes.clear()
                                                  }
                                              },
                                              onDragCancel = {
                                                  currentTouchPos = null
                                              }
                                          )
                                      }
                              ) {
                                  val lineColor = if (errorMsg != null) Color(0xFFEF4444) else Color(0xFF5D56F5)
                                  val dotColor = Color(0xFF64748B)
                                  ComposeCanvas(modifier = Modifier.fillMaxSize()) {
                                      for (i in 0 until selectedNodes.size - 1) {
                                          val start = nodeCenter(selectedNodes[i])
                                          val end = nodeCenter(selectedNodes[i + 1])
                                          drawLine(
                                              color = lineColor,
                                              start = start,
                                              end = end,
                                              strokeWidth = 4.5.dp.toPx(),
                                              cap = StrokeCap.Round
                                          )
                                      }
                                      if (selectedNodes.isNotEmpty() && currentTouchPos != null) {
                                          drawLine(
                                              color = lineColor.copy(alpha = 0.65f),
                                              start = nodeCenter(selectedNodes.last()),
                                              end = currentTouchPos!!,
                                              strokeWidth = 3.5.dp.toPx(),
                                              cap = StrokeCap.Round
                                          )
                                      }
                                      for (i in 1..9) {
                                          val center = nodeCenter(i)
                                          val isSelected = selectedNodes.contains(i)
                                          if (isSelected) {
                                              drawCircle(
                                                  color = lineColor.copy(alpha = 0.24f),
                                                  radius = 20.dp.toPx(),
                                                  center = center
                                              )
                                              drawCircle(
                                                  color = lineColor,
                                                  radius = 8.5.dp.toPx(),
                                                  center = center
                                              )
                                          } else {
                                              drawCircle(
                                                  color = dotColor.copy(alpha = 0.55f),
                                                  radius = 6.dp.toPx(),
                                                  center = center
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                          TextButton(onClick = { selectedNodes.clear(); currentTouchPos = null; errorMsg = null }) {
                              Text(s.btnClear)
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          enabled = selectedNodes.size >= 4,
                          onClick = { handlePatternAction() }
                      ) {
                          Text(if (step == 2) s.btnSave else s.btnNext)
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text(s.btnCancel)
                      }
                  }
              )
          }

          ''')
          print("NowLock v7.5 project generated cleanly!")
      - name: Compile Optimized Release APK with JDK 17, Android 16 (API 36) & Gradle 8.7
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon --no-build-cache --stacktrace
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk
      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v9.0.1-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          gh release create v9.0.1-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "NowLock v9.0.1 - True AMOLED Theme, Persistent Multi-Language Security Logs & Triangle Pulse Emblem" --notes "## What's New in NowLock v9.0.1
          - **True AMOLED Pitch-Black Theme**: Added a dedicated AMOLED (#000000) theme option that applies pure black across both the main application interface and the lock screen.
          - **Persistent & Dynamically Translated Security Logs**: Security incidents (failed PIN/Pattern/Fingerprint attempts, Decoy triggers, 10+ attempt lockouts, permission revocations, and Device Admin disable attempts) now persist until explicitly cleared by the user and translate dynamically across all 5 languages.
          - **Triangular Pulse Waves for Danger Emblem**: Updated the Red Danger Triangle emblem animation to emit concentric triangular pulse waves matching its geometry.
          - **Independent Decoy Credential Setup**: Setting a Decoy PIN or Decoy Pattern no longer prompts for the primary password first.
          - **Transparent Navigation Bar in Full Privacy Modal**: Fixed the full Privacy Policy & Terms modal so the system navigation bar remains translucent and never obscures the bottom Close button."

