          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.front" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:hasFragileUserData="false"
                  android:icon="@drawable/ic_nowlock_logo"
                  android:roundIcon="@drawable/ic_nowlock_logo"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.NowLock">
                  <!-- Main Activity -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="uiMode|locale|layoutDirection|orientation|screenSize|smallestScreenSize|screenLayout|density"
                      android:launchMode="singleTop" />
                  <!-- Default Yellow Padlock Launcher Alias -->
                  <activity-alias
                      android:name=".LauncherDefaultAlias"
                      android:enabled="true"
                      android:exported="true"
                      android:icon="@drawable/ic_nowlock_logo"
                      android:roundIcon="@drawable/ic_nowlock_logo"
                      android:label="@string/app_name"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <!-- Disguised Blue Calculator Launcher Alias -->
                  <activity-alias
                      android:name=".LauncherCalculatorAlias"
                      android:enabled="false"
                      android:exported="true"
                      android:icon="@drawable/ic_nowlock_calculator"
                      android:roundIcon="@drawable/ic_nowlock_calculator"
                      android:label="@string/calc_alias_name"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <!-- Fullscreen Lock Screen Activity -->
                  <activity
                      android:name=".LockScreenActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:showOnLockScreen="true"
                      android:resizeableActivity="true"
                      android:configChanges="uiMode|locale|layoutDirection|orientation|screenSize|smallestScreenSize|screenLayout|density"
                      android:theme="@style/Theme.NowLock" />
                  <!-- Engine 1: Accessibility + UsageStats Hybrid Service -->
                  <service
                      android:name=".NowLockAccessibilityService"
                      android:exported="true"
                      android:directBootAware="true"
                      android:label="@string/accessibility_service_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
                  <!-- Engine 2: Standalone UsageStats Foreground Service (Reboot & Background Guard) -->
                  <service
                      android:name=".NowLockMonitorService"
                      android:exported="false"
                      android:directBootAware="true"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="app_lock_foreground_detection" />
                  </service>
                  <!-- Automatic Reboot & Package Update Startup Receiver -->
                  <receiver
                      android:name=".BootStartupReceiver"
                      android:directBootAware="true"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
                  <!-- New App Installed Receiver (Prompts user to lock newly installed apps) -->
                  <receiver
                      android:name=".NewAppInstallReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.PACKAGE_ADDED" />
                          <data android:scheme="package" />
                      </intent-filter>
                  </receiver>
                  <!-- Notification Action Receiver for Locking Newly Installed App -->
                  <receiver
                      android:name=".NewAppLockActionReceiver"
                      android:enabled="true"
                      android:exported="false" />
                  <!-- Control Center / Quick Settings Tile Service (Allows opening NowLock even when hidden from Launcher!) -->
                  <service
                      android:name=".NowLockControlCenterTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_qs_lock_tile"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
                  <!-- Uninstall Protection Device Admin Receiver -->
                  <receiver
                      android:name=".UninstallProtectionReceiver"
                      android:description="@string/device_admin_desc"
                      android:exported="true"
                      android:label="@string/device_admin_label"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin_receiver" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                          <action android:name="android.app.action.DEVICE_ADMIN_DISABLE_REQUESTED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
