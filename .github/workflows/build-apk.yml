              onBackspaceClick: () -> Unit,
              onFingerprintClick: () -> Unit
          ) {
              val dialpadRows = listOf(
                  listOf(Triple(1, "➿", ""), Triple(2, "ABC", ""), Triple(3, "DEF", "")),
                  listOf(Triple(4, "GHI", ""), Triple(5, "JKL", ""), Triple(6, "MNO", "")),
                  listOf(Triple(7, "PQRS", ""), Triple(8, "TUV", ""), Triple(9, "WXYZ", ""))
              )
              val keySizeDp = if (isCompact) 72 else 82
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(bottom = if (isCompact) 8.dp else 16.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(if (isCompact) 6.dp else 10.dp)
              ) {
                  dialpadRows.forEach { row ->
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceEvenly,
