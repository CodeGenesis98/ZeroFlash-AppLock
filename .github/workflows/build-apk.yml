name: Build ZeroFlash One UI 9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python & Pillow for HD Wallpaper Generation
        run: |
          pip install --quiet Pillow
          python3 - << 'PYEOF'
          import os, math, random
          from PIL import Image, ImageDraw, ImageFilter

          os.makedirs("app/src/main/res/drawable-nodpi", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/values-fa", exist_ok=True)
          os.makedirs("app/src/main/java/io/zenzy/zeroflash/applock/theme", exist_ok=True)
          os.makedirs("app/src/main/java/io/zenzy/zeroflash/applock/data", exist_ok=True)
          os.makedirs("app/src/main/java/io/zenzy/zeroflash/applock/overlay", exist_ok=True)
          os.makedirs("app/src/main/java/io/zenzy/zeroflash/applock/service", exist_ok=True)
          os.makedirs("app/src/main/java/io/zenzy/zeroflash/applock/security", exist_ok=True)
          os.makedirs("app/src/main/java/io/zenzy/zeroflash/applock/receiver", exist_ok=True)
          os.makedirs("app/src/main/java/io/zenzy/zeroflash/applock/ui", exist_ok=True)

          def create_wallpaper(path, top_c, mid_c, bot_c, glow_c, style):
              W, H = 720, 1280
              img = Image.new("RGB", (W, H))
              draw = ImageDraw.Draw(img)
              for y in range(H):
                  t = y / float(H - 1)
                  if t < 0.55:
                      u = t / 0.55
                      r = int(top_c[0]*(1-u) + mid_c[0]*u)
                      g = int(top_c[1]*(1-u) + mid_c[1]*u)
                      b = int(top_c[2]*(1-u) + mid_c[2]*u)
                  else:
                      u = (t - 0.55) / 0.45
                      r = int(mid_c[0]*(1-u) + bot_c[0]*u)
                      g = int(mid_c[1]*(1-u) + bot_c[1]*u)
                      b = int(mid_c[2]*(1-u) + bot_c[2]*u)
                  draw.line([(0, y), (W, y)], fill=(r, g, b))

              overlay = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              odraw = ImageDraw.Draw(overlay)
              random.seed(style)

              if style == "forest":
                  # Calm layered misty pine silhouettes & soft fog
                  for layer, base_y, col in [(0, 620, (22, 44, 38, 150)), (1, 780, (14, 30, 25, 200)), (2, 940, (8, 18, 15, 240))]:
                      for tx in range(-40, W + 60, 75):
                          th = random.randint(180, 320)
                          top_y = base_y - th
                          for branch in range(6):
                              by = top_y + branch * (th // 6)
                              bw = 18 + branch * 14
                              odraw.polygon([(tx, by - 28), (tx - bw, by + 24), (tx + bw, by + 24)], fill=col)
                  odraw.rectangle([0, 520, W, 820], fill=(210, 230, 225, 38))
              elif style == "cafe":
                  # Warm walnut wood table & soft amber bokeh lights
                  for _ in range(14):
                      bx = random.randint(60, W - 60)
                      by = random.randint(120, 680)
                      br = random.randint(28, 75)
                      odraw.ellipse([bx - br, by - br, bx + br, by + br], fill=(glow_c[0], glow_c[1], glow_c[2], 48))
                  odraw.rectangle([0, 860, W, H], fill=(42, 24, 14, 215))
                  for plank in range(860, H, 36):
                      odraw.line([(0, plank), (W, plank)], fill=(24, 13, 7, 140), width=2)
              elif style == "witcher":
                  # Mountain fortress silhouette & glowing Igni runes
                  pts = [(0, 760), (140, 580), (260, 630), (390, 440), (430, 440), (460, 380), (500, 380), (520, 460), (620, 540), (W, 720), (W, H), (0, H)]
                  odraw.polygon(pts, fill=(12, 15, 22, 220))
                  for _ in range(28):
                      ex = random.randint(100, W - 100)
                      ey = random.randint(450, 980)
                      er = random.randint(4, 10)
                      odraw.ellipse([ex - er, ey - er, ex + er, ey + er], fill=(251, 146, 60, 140))
              elif style == "lotr":
                  # Elven valley cliffs, misty waterfall & golden lanterns
                  odraw.polygon([(0, 320), (220, 480), (260, 950), (0, H)], fill=(18, 16, 28, 210))
                  odraw.polygon([(W, 280), (480, 460), (440, 950), (W, H)], fill=(18, 16, 28, 210))
                  odraw.rectangle([310, 460, 390, 940], fill=(220, 230, 255, 42))
                  for lx, ly in [(180, 740), (350, 710), (520, 740)]:
                      odraw.ellipse([lx - 26, ly - 26, lx + 26, ly + 26], fill=(250, 204, 21, 95))

              overlay = overlay.filter(ImageFilter.GaussianBlur(radius=6))
              final_img = Image.alpha_composite(img.convert("RGBA"), overlay).convert("RGB")
              final_img.save(path, format="JPEG", quality=85, optimize=True)

          create_wallpaper("app/src/main/res/drawable-nodpi/bg_misty_forest.jpg", (54, 78, 72), (24, 46, 40), (8, 18, 15), (110, 231, 183), "forest")
          create_wallpaper("app/src/main/res/drawable-nodpi/bg_cozy_wood_cafe.jpg", (48, 30, 20), (68, 42, 26), (22, 12, 8), (251, 191, 36), "cafe")
          create_wallpaper("app/src/main/res/drawable-nodpi/bg_witcher_wilderness.jpg", (34, 42, 56), (20, 25, 36), (9, 11, 16), (251, 146, 60), "witcher")
          create_wallpaper("app/src/main/res/drawable-nodpi/bg_lotr_rivendell.jpg", (58, 46, 74), (32, 28, 48), (12, 10, 20), (250, 204, 21), "lotr")

          def write_clean(path, content):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          write_clean("settings.gradle.kts", '''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZeroFlashAppLockOneUI9"
          include(":app")
          ''')

          write_clean("build.gradle.kts", '''
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ''')

          write_clean("gradle.properties", '''
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''')

          write_clean("app/build.gradle.kts", '''
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "io.zenzy.zeroflash.applock"
              compileSdk = 34

              defaultConfig {
                  applicationId = "io.zenzy.zeroflash.applock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.1.0-OneUI9"
                  vectorDrawables { useSupportLibrary = true }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.2")
              implementation("androidx.lifecycle:lifecycle-service:2.8.2")
              implementation("androidx.savedstate:savedstate-ktx:1.2.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.biometric:biometric:1.2.0-alpha05")

              val cameraxVersion = "1.3.4"
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("com.google.guava:guava:32.1.3-android")
          }
          ''')

          write_clean("app/src/main/res/values/strings.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ZeroFlash One UI 9</string>
              <string name="calculator_alias_name">Calculator</string>
              <string name="accessibility_service_label">ZeroFlash Instant AppLock (One UI 9)</string>
              <string name="accessibility_service_desc">Detects app launches in under 16ms to display the One UI 9 lock screen before app content renders.</string>
              <string name="device_admin_label">ZeroFlash Uninstall Guard</string>
              <string name="device_admin_desc">Prevents unauthorized uninstallation of ZeroFlash AppLock.</string>
          </resources>
          ''')

          write_clean("app/src/main/res/values-fa/strings.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ZeroFlash One UI 9</string>
              <string name="calculator_alias_name">ماشین‌حساب</string>
              <string name="accessibility_service_label">قفل آنی برنامه‌ها ZeroFlash</string>
              <string name="accessibility_service_desc">تشخیص آنی باز شدن برنامه‌ها در کمتر از ۱۶ میلی‌ثانیه با رابط کاربری Samsung One UI 9.</string>
              <string name="device_admin_label">محافظ حذف نصب ZeroFlash</string>
              <string name="device_admin_desc">جلوگیری از حذف غیرمجاز برنامه قفل توسط افراد دیگر.</string>
          </resources>
          ''')

          write_clean("app/src/main/res/xml/accessibility_service_config.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="0"
              android:description="@string/accessibility_service_desc" />
          ''')

          write_clean("app/src/main/res/xml/device_admin_receiver.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <watch-login />
              </uses-policies>
          </device-admin>
          ''')

          write_clean("app/src/main/AndroidManifest.xml", '''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera.front" android:required="false" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.DayNight">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:configChanges="uiMode|locale|layoutDirection|orientation|screenSize"
                      android:launchMode="singleTop"
                      android:excludeFromRecents="true">
                  </activity>

                  <activity-alias
                      android:name=".DefaultLauncherAlias"
                      android:targetActivity=".ui.MainActivity"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>

                  <activity-alias
                      android:name=".CalculatorStealthAlias"
                      android:targetActivity=".ui.MainActivity"
                      android:enabled="false"
                      android:exported="true"
                      android:label="@string/calculator_alias_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>

                  <service
                      android:name=".service.ZeroFlashAccessibilityService"
                      android:exported="true"
                      android:label="@string/accessibility_service_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".service.WatchdogForegroundService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="AppLock continuous security enforcement" />
                  </service>

                  <service
                      android:name=".service.NotificationShieldService"
                      android:exported="true"
                      android:label="ZeroFlash Notification Shield"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".receiver.UninstallProtectionAdminReceiver"
                      android:description="@string/device_admin_desc"
                      android:exported="true"
                      android:label="@string/device_admin_label"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin_receiver" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                          <action android:name="android.app.action.DEVICE_ADMIN_DISABLE_REQUESTED" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".receiver.BootCompletedReceiver"
                      android:exported="true"
                      android:directBootAware="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          ''')

          write_clean("app/src/main/java/io/zenzy/zeroflash/applock/theme/OneUiDynamicThemeEngine.kt", '''
          package io.zenzy.zeroflash.applock.theme

          import androidx.annotation.DrawableRes
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.ColorScheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.LayoutDirection
          import io.zenzy.zeroflash.applock.R

          enum class ThemeMode { SYSTEM, DARK, LIGHT }

          enum class AppLanguage(val code: String, val displayName: String, val layoutDirection: LayoutDirection) {
              FA("fa", "فارسی", LayoutDirection.Rtl),
              EN("en", "English", LayoutDirection.Ltr)
          }

          data class OneUiAdaptivePalette(
              val isDark: Boolean,
              val background: Color,
              val cardSurface: Color,
              val cardBorder: Color,
              val primaryBlue: Color,
              val primaryText: Color,
              val secondaryText: Color,
              val dividerColor: Color,
              val pillBackground: Color
          )

          object OneUiSystemTheme {
              private val DarkPalette = OneUiAdaptivePalette(
                  isDark = true,
                  background = Color(0xFF000000),
                  cardSurface = Color(0xFF171A21),
                  cardBorder = Color(0x26FFFFFF),
                  primaryBlue = Color(0xFF387AFF),
                  primaryText = Color(0xFFFFFFFF),
                  secondaryText = Color(0xFF8E97A8),
                  dividerColor = Color(0x1FFFFFFF),
                  pillBackground = Color(0x29387AFF)
              )

              private val LightPalette = OneUiAdaptivePalette(
                  isDark = false,
                  background = Color(0xFFF2F2F7),
                  cardSurface = Color(0xFFFFFFFF),
                  cardBorder = Color(0x14000000),
                  primaryBlue = Color(0xFF0072DE),
                  primaryText = Color(0xFF0D0F14),
                  secondaryText = Color(0xFF636B78),
                  dividerColor = Color(0x14000000),
                  pillBackground = Color(0x1F0072DE)
              )

              @Composable
              fun resolvePalette(themeMode: ThemeMode): OneUiAdaptivePalette {
                  val useDark = when (themeMode) {
                      ThemeMode.SYSTEM -> isSystemInDarkTheme()
                      ThemeMode.DARK -> true
                      ThemeMode.LIGHT -> false
                  }
                  return if (useDark) DarkPalette else LightPalette
              }

              fun toMaterialColorScheme(palette: OneUiAdaptivePalette): ColorScheme {
                  return if (palette.isDark) {
                      darkColorScheme(
                          primary = palette.primaryBlue,
                          background = palette.background,
                          surface = palette.cardSurface,
                          onPrimary = Color.White,
                          onBackground = palette.primaryText,
                          onSurface = palette.primaryText
                      )
                  } else {
                      lightColorScheme(
                          primary = palette.primaryBlue,
