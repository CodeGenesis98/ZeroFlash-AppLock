name: Build ZeroFlash One UI 9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unpack Project Files (if only workflow file was uploaded)
        run: |
          if [ ! -f "app/build.gradle.kts" ]; then
            python3 - << 'PYEOF'
          import base64, io, zipfile
          B64_DATA = ""
          raw = base64.b64decode(B64_DATA)
          with zipfile.ZipFile(io.BytesIO(raw), "r") as zf:
              zf.extractall(".")
          print("Extracted full Android Studio project + 4 HD Wallpapers successfully!")
          PYEOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ZeroFlash-OneUI9-AppLock.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroFlash-OneUI9-AppLock-APK
          path: ZeroFlash-OneUI9-AppLock.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-oneui9
          name: "ZeroFlash One UI 9 AppLock (Ready-to-Install APK)"
          body: "فایل نصبی آماده (ZeroFlash-OneUI9-AppLock.apk) برای گوشی‌های سامسونگ One UI 9 با پشتیبانی از تم تاریک/روشن خودکار، زبان فارسی و انگلیسی، و ۴ تم چرخشی."
          files: ZeroFlash-OneUI9-AppLock.apk
