                            val isCompactScreen = config.screenHeightDp < 700
                            val primaryTextColor = if (isDark) Color(0xFFF5F6FA) else Color(0xFF1C1E26)
                            val secondaryTextColor = if (isDark) Color(0xFFA9A6D4) else Color(0xFF72768C)
                            val usePattern = (comboMode == LockComboMode.PATTERN_FINGERPRINT && AppRepo.isPatternSet()) ||
                                (!AppRepo.isPinSet() && AppRepo.isPatternSet())
                            val canFp = fpEnabled && canUseFingerprint(this@MainActivity)
                            var selfEnteredPin by remember { mutableStateOf("") }
                            var selfFailedAttempts by remember { mutableStateOf(0) }
                            val defaultPrompt = if (usePattern) s.lockPromptPattern else s.lockPromptPin
                            var selfStatusMsg by remember(appLang, usePattern) { mutableStateOf(defaultPrompt) }
                            var selfIsError by remember { mutableStateOf(false) }
                            var selfBioPulse by remember { mutableStateOf(false) }
                            fun onSelfUnlockSuccess() {
                                AppRepo.markUnlocked(packageName)
                                isSelfLockedState.value = false
                            }
                            fun onSelfWrongAttempt() {
                                selfFailedAttempts++
                                selfIsError = true
                                AppRepo.triggerShortVibration(this@MainActivity, 65L)
                                if (selfFailedAttempts >= 3 && AppRepo.isIntruderSelfieEnabled()) {
                                    AppRepo.recordIntruderAttempt(this@MainActivity, packageName)
                                }
                                selfStatusMsg = s.lockWrongAttempt
                            }
                            LaunchedEffect(isSelfLocked) {
                                if (isSelfLocked && canFp) {
                                    delay(160)
                                    selfBioPulse = true
                                    triggerSelfFingerprintPrompt(
                                        s = s,
                                        onSuccess = { onSelfUnlockSuccess() },
                                        onFailedAttempt = { onSelfWrongAttempt() },
                                        onCancelOrError = { selfBioPulse = false }
