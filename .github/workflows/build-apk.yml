          unified_src = lzma.decompress(base64.b64decode(KT_XZ_B64.encode("ascii"))).decode("utf-8")
          parts = re.split(r"// === NOWLOCK_MODULE: ([A-Za-z0-9_.]+) ===\n", unified_src)
          shared_hdr = parts[0].rstrip()
          for idx in range(1, len(parts), 2):
              mod_filename = parts[idx].strip()
              mod_body = parts[idx + 1].strip()
              mod_path = os.path.join(pkg_dir, mod_filename)
              with open(mod_path, "w", encoding="utf-8") as mf:
                  mf.write(shared_hdr + "\n\n" + mod_body + "\n")
          print("NowLock v0.1.7 modular 4-file project (SecurityEngine.kt, LockServices.kt, ThemeAndStrings.kt, MainActivityUi.kt) generated cleanly!")

      - name: Build Signed Release APK with Gradle 8.7
        env:
          KEYSTORE_PATH: nowlock_signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.NOWLOCK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOWLOCK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOWLOCK_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          (yes 2>/dev/null || true) | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -f /tmp/gradle-8.7/bin/gradle ]; then
            curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip.sha256 -o /tmp/gradle-8.7.sha256
            echo "$(cat /tmp/gradle-8.7.sha256)  /tmp/gradle-8.7.zip" | sha256sum -c -
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle assembleRelease --parallel --no-daemon --no-build-cache --console=plain
          cp app/build/outputs/apk/release/app-release.apk NowLock.apk

      - name: Upload NowLock-Release-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowLock-Release-APK
          path: NowLock.apk
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.7-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.1.5-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.1.4-nowlock --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          cat << 'RELNOTES' > /tmp/release_notes.md
          ## ☄️ NowLock v0.1.7 (Beta) — Dual-Key StrongBox/TEE Crypto, ActivityHeuristicsEngine, 23.5° Organic Asteroid Physics & Safe Backup

          - 🔐 **Dual-Key StrongBox/TEE Keystore & Biometric CryptoObject**: Connected `BiometricPrompt.CryptoObject` to a hardware-backed `AES-256-GCM` key in `StrongBox`/`TEE`, added `KeyPermanentlyInvalidatedException` primary-credential recovery, live `KeyInfo` dashboard level display, and optional Lock Screen Security Question recovery with Salted `PBKDF2`.
          - 🛡️ **ActivityHeuristicsEngine, AdminNavigationLease & ServiceHealthMonitor**: Added 6-layer `AccessibilityNodeInfo` multi-signal inspection ignoring all `isEditable`/`EditText` fields, a 20-second `AdminNavigationLease` for authorized settings visits, and live `Settings.Secure` service health monitoring.
          - ☄️ **Organic Rocky 3D Asteroid on 23.5° Orbital Axis, Isolated Touch & Micro Haptics**: Upgraded to organic craggy rock & irregular crystal textures on a `23.5°` axial tilt, locked `HorizontalPager` swiping inside the 3D sphere touch zone, added Micro Haptics and cinematic Lock Screen animations, and auto-reset the update message upon leaving About.
          - 💾 **NowLockBackupManager & Standardized Technical Vocabulary**: Safe JSON backup/restore & legacy schema migration (strictly excluding all passwords/keys), and standardized `Salt`, `PBKDF2`, `StrongBox`, `TEE`, and `AES-256-GCM` across all 5 languages.
          RELNOTES
          gh release create v0.1.7-nowlock NowLock.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "☄️ NowLock v0.1.7 (Beta) — Dual-Key StrongBox/TEE, Heuristics Engine, 23.5° Orbital Physics & Safe Backup" --notes-file /tmp/release_notes.md --latest
