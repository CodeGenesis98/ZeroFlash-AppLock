                                                horizontalArrangement = Arrangement.spacedBy(18.dp),
                                                verticalAlignment = Alignment.CenterVertically
                                            ) {
                                                repeat(4) { idx ->
                                                    val filled = idx < selfEnteredPin.length
                                                    Box(
                                                        modifier = Modifier
                                                            .size(14.dp)
                                                            .clip(CircleShape)
                                                            .background(
                                                                when {
                                                                    selfIsError -> Color(0xFFEF4444)
                                                                    filled -> primaryTextColor
                                                                    else -> Color.Transparent
                                                                }
                                                            )
                                                            .border(
                                                                width = 1.5.dp,
                                                                color = if (selfIsError) Color(0xFFEF4444) else primaryTextColor.copy(alpha = 0.55f),
                                                                shape = CircleShape
                                                            )
                                                    )
                                                }
                                            }
                                        }
                                    }
                                    CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                                        if (usePattern) {
                                            Column(
                                                horizontalAlignment = Alignment.CenterHorizontally,
                                                modifier = Modifier.padding(bottom = 12.dp)
                                            ) {
                                                InteractivePatternLockView(
                                                    gridSizeDp = if (isCompactScreen) 240 else 276,
                                                    dotColor = primaryTextColor,
                                                    lineColor = blue,
                                                    errorColor = Color(0xFFEF4444),
                                                    onPatternCompleted = { patternStr, resetPatternCallback ->
                                                        if (AppRepo.verifyPattern(patternStr)) {
                                                            onSelfUnlockSuccess()
                                                        } else {
                                                            onSelfWrongAttempt()
                                                            scope.launch {
                                                                delay(350)
                                                                resetPatternCallback()
                                                                selfIsError = false
                                                                selfStatusMsg = defaultPrompt
                                                            }
                                                        }
                                                    }
                                                )
                                                Spacer(Modifier.height(14.dp))
                                                Row(
                                                    modifier = Modifier
                                                        .fillMaxWidth()
                                                        .padding(horizontal = 24.dp),
                                                    horizontalArrangement = Arrangement.SpaceBetween,
                                                    verticalAlignment = Alignment.CenterVertically
                                                ) {
                                                    TextButton(onClick = { finish() }) {
                                                        Text(
                                                            text = s.lockExitBtn,
                                                            color = secondaryTextColor,
                                                            fontSize = 15.sp
                                                        )
                                                    }
                                                    if (canFp) {
                                                        TelegramFingerprintButton(
                                                            isActivePulse = selfBioPulse,
                                                            tintColor = primaryTextColor,
                                                            accentColor = blue,
                                                            onClick = {
                                                                selfBioPulse = true
                                                                triggerSelfFingerprintPrompt(
                                                                    s = s,
                                                                    onSuccess = { onSelfUnlockSuccess() },
                                                                    onFailedAttempt = { onSelfWrongAttempt() },
                                                                    onCancelOrError = { selfBioPulse = false }
                                                                )
                                                            }
                                                        )
                                                    }
                                                }
                                            }
                                        } else {
                                            SamsungOneUiDialpad(
                                                isCompact = isCompactScreen,
                                                primaryTextColor = primaryTextColor,
                                                secondaryTextColor = secondaryTextColor,
                                                accentColor = blue,
                                                showFingerprintKey = canFp,
                                                isFingerprintPulsing = selfBioPulse,
                                                onDigitClick = { digit ->
                                                    if (selfEnteredPin.length < 4) {
                                                        selfIsError = false
                                                        selfEnteredPin += digit.toString()
                                                        if (selfEnteredPin.length == 4) {
                                                            if (AppRepo.verifyPin(selfEnteredPin)) {
                                                                onSelfUnlockSuccess()
                                                            } else {
                                                                onSelfWrongAttempt()
                                                                scope.launch {
                                                                    delay(260)
                                                                    selfEnteredPin = ""
                                                                }
                                                            }
                                                        }
                                                    }
                                                },
                                                onBackspaceClick = {
                                                    if (selfEnteredPin.isNotEmpty()) {
                                                        selfIsError = false
                                                        selfEnteredPin = selfEnteredPin.dropLast(1)
                                                    }
                                                },
                                                onFingerprintClick = {
                                                    selfBioPulse = true
                                                    triggerSelfFingerprintPrompt(
                                                        s = s,
                                                        onSuccess = { onSelfUnlockSuccess() },
                                                        onFailedAttempt = { onSelfWrongAttempt() },
                                                        onCancelOrError = { selfBioPulse = false }
                                                    )
                                                }
                                            )
                                        }
                                    }
                                }
                            }
                        }
                        // Recents Privacy Padlock Cover when paused in background switcher
                        if (isPausedInRecents && recentsPrivacy) {
                            Box(
                                modifier = Modifier
                                    .fillMaxSize()
                                    .background(if (isDark) Color(0xFF181856) else Color(0xFFF5F6FA)),
                                contentAlignment = Alignment.Center
                            ) {
                                Image(
                                    painter = painterResource(id = R.drawable.ic_nowlock_logo),
                                    contentDescription = "NowLock Privacy Shield",
                                    modifier = Modifier.size(92.dp).clip(RoundedCornerShape(22.dp))
                                )
                            }
                        }
                        // Translucent Glassy Top Status Bar & Bottom Navigation Bar Overlays
                        NotchTranslucentStatusBarOverlay(isDark = isDark)
                        GlassyNavigationBarOverlay(isDark = isDark, modifier = Modifier.align(Alignment.BottomCenter))
                        if (showPrivacyFullModal) {
                            PrivacyPolicyFullModal(
                                s = s,
                                isFa = isFa,
                                isDark = isDark,
                                txtColor = txt,
                                subColor = sub,
                                accentBlue = blue,
                                onDismiss = { showPrivacyFullModal = false }
                            )
                        }
                        if (showPinDialog) {
                            PinSetupDialog(
                                s = s,
                                onDismiss = { showPinDialog = false; pendingLockPkg = null },
                                onSavePin = { pin ->
                                    AppRepo.setPin(pin)
                                    AppRepo.setComboMode(LockComboMode.PIN_FINGERPRINT)
                                    comboMode = LockComboMode.PIN_FINGERPRINT
                                    passwordSetState = true
                                    pendingLockPkg?.let { pkg ->
                                        AppRepo.toggleAppLock(pkg, true)
                                        if (pkg == packageName) AppRepo.markUnlocked(packageName)
                                        appList = appList.map { if (it.packageName == pkg) it.copy(isLocked = true) else it }
                                    }
                                    pendingLockPkg = null
                                    showPinDialog = false
                                    NowLockMonitorService.startServiceSafely(this@MainActivity)
                                }
                            )
                        }
                        if (showPatternDialog) {
                            PatternSetupDialog(
                                s = s,
                                onDismiss = { showPatternDialog = false; pendingLockPkg = null },
                                onSavePattern = { pat ->
                                    AppRepo.setPattern(pat)
                                    AppRepo.setComboMode(LockComboMode.PATTERN_FINGERPRINT)
                                    comboMode = LockComboMode.PATTERN_FINGERPRINT
                                    passwordSetState = true
                                    pendingLockPkg?.let { pkg ->
                                        AppRepo.toggleAppLock(pkg, true)
                                        if (pkg == packageName) AppRepo.markUnlocked(packageName)
                                        appList = appList.map { if (it.packageName == pkg) it.copy(isLocked = true) else it }
                                    }
                                    pendingLockPkg = null
                                    showPatternDialog = false
                                    NowLockMonitorService.startServiceSafely(this@MainActivity)
                                }
                            )
                        }
                    }
                }
            }
        }
    }
    private fun loadRealLauncherApps(): List<RealAppItem> {
        val pm = packageManager
        val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
            addCategory(Intent.CATEGORY_LAUNCHER)
        }
        val resolveInfos = pm.queryIntentActivities(mainIntent, 0)
        val blockedKeywords = listOf(
            "plugin", "effect", "filter", "sticker", "wallpaper",
            "auto_generated_rro", "overlay", "provider", "com.android.cts"
        )
        val lockedSet = AppRepo.getLockedPackages()
        val items = resolveInfos
            .mapNotNull { ri ->
                val pkg = ri.activityInfo?.packageName ?: return@mapNotNull null
                if (blockedKeywords.any { pkg.lowercase().contains(it) }) return@mapNotNull null
                val isSelf = (pkg == packageName)
                val label = if (isSelf) "NowLock" else (ri.loadLabel(pm)?.toString() ?: pkg)
                val iconDrawable = ri.loadIcon(pm) ?: pm.defaultActivityIcon
                val bmp = drawableToBitmap(iconDrawable)
                RealAppItem(
                    label = label,
                    packageName = pkg,
                    iconBitmap = bmp,
                    isLocked = lockedSet.contains(pkg),
                    isSelfApp = isSelf
                )
            }
            .distinctBy { it.packageName }
            .toMutableList()
        if (items.none { it.packageName == packageName }) {
            runCatching {
                val ai = pm.getApplicationInfo(packageName, 0)
                val bmp = drawableToBitmap(pm.getApplicationIcon(ai))
                items.add(
                    0,
                    RealAppItem(
                        label = "NowLock",
                        packageName = packageName,
                        iconBitmap = bmp,
                        isLocked = lockedSet.contains(packageName),
                        isSelfApp = true
                    )
                )
            }
        }
        return items.sortedWith(
            compareByDescending<RealAppItem> { it.isSelfApp }
                .thenByDescending { it.isLocked }
                .thenBy { it.label.lowercase() }
        )
    }
}
