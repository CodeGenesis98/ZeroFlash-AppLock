                                                                          AppFilterMode.LOCKED -> appList.count { it.isLocked }
                                                                          AppFilterMode.UNLOCKED -> appList.count { !it.isLocked }
                                                                      }
                                                                      Text("${filter.getTitle(s)} ($count)", fontSize = 12.sp)
