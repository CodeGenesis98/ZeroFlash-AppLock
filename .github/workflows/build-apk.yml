              private const val KEY_RECENTS_PRIVACY = "nowlock_recents_privacy"
              private const val KEY_LOCKED_PKGS = "nowlock_locked_pkgs"
              private const val KEY_LOCKED_PKGS_CSV = "nowlock_locked_pkgs_csv"
              private const val KEY_THEME_MODE = "nowlock_theme_mode"
              private const val KEY_APP_LANG = "nowlock_app_lang_v76"
              private const val KEY_VIBRATE = "nowlock_vibrate_on_error"
              private const val KEY_INTRUDER = "nowlock_intruder_selfie"
              private const val KEY_INTRUDER_COUNT = "nowlock_intruder_count"
              private const val KEY_UNINSTALL = "nowlock_uninstall_protect"
                  private const val KEY_CONSEC_FAILS = "nowlock_consec_fails"
              private const val KEY_LOCKOUT_UNTIL_MS = "nowlock_lockout_until_ms"
              private const val KEY_LAUNCHER_HIDDEN = "nowlock_launcher_hidden_v90"
              private const val KEY_LOCK_ON_SCREEN_OFF = "nowlock_lock_on_screen_off_v90"
              private const val KEY_DECOY_ENABLED = "nowlock_decoy_enabled_v90"
              private const val KEY_DECOY_PIN_HASH = "nowlock_decoy_pin_hash_v90"
              private const val KEY_DECOY_PATTERN_HASH = "nowlock_decoy_pat_hash_v90"
              private const val KEY_SEC_LOGS = "nowlock_security_logs_v90"
              private lateinit var prefs: SharedPreferences
              private val lockedMemorySet = ConcurrentHashMap.newKeySet<String>()
              private val dynamicHomePackages = ConcurrentHashMap.newKeySet<String>()
              private val dynamicImePackages = ConcurrentHashMap.newKeySet<String>()
              val unlockedSession = ConcurrentHashMap.newKeySet<String>()
              val unlockTimestamps = ConcurrentHashMap<String, Long>()
              @Volatile var cachedLauncherApps: List<RealAppItem>? = null
              @Volatile var isLowEndHardware: Boolean = false
              @Volatile var lastActivePackage: String = ""
              @Volatile var lastLockShownTime: Long = 0L
              @Volatile var settingsNavigationGraceUntil: Long = 0L
              fun markLeavingForSettings(ctx: Context) {
                  val now = System.currentTimeMillis()
                  settingsNavigationGraceUntil = now + 90_000L
                  unlockedSession.add(ctx.packageName)
                  unlockTimestamps[ctx.packageName] = now
              }
              fun isSelfSettingsGraceActive(): Boolean = System.currentTimeMillis() < settingsNavigationGraceUntil
              fun init(ctx: Context) {
                  if (!::prefs.isInitialized) {
                      val storageCtx = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && ctx.isDeviceProtectedStorage) {
                          ctx
                      } else {
                          ctx.applicationContext ?: ctx
                      }
                      prefs = storageCtx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      reloadLockedPackagesFromPrefs()
                      refreshDynamicSystemPackages(storageCtx)
                  }
              }
              fun getConsecutiveFailedAttempts(): Int = prefs.getInt(KEY_CONSEC_FAILS, 0)
              fun getLockoutRemainingSeconds(): Int {
                  val untilMs = prefs.getLong(KEY_LOCKOUT_UNTIL_MS, 0L)
                  val remMs = untilMs - System.currentTimeMillis()
                  return if (remMs > 0L) ((remMs + 999L) / 1000L).toInt() else 0
              }
              // Progressive Lockout Rule:
              // Attempts 1..9: no timer.
              // Attempt 10: 15s lockout.
              // Every consecutive wrong attempt after 10 (11, 12, 13...): adds +5s (20s, 25s, 30s...)!
              fun registerWrongCredentialAttempt(ctx: Context, targetPkg: String, methodLabel: String = "PIN"): Pair<Int, Int> {
                  val fails = getConsecutiveFailedAttempts() + 1
                  prefs.edit().putInt(KEY_CONSEC_FAILS, fails).commit()
                  appendSecurityLog(ctx, targetPkg, methodLabel)
                  val effCfg = getEffectiveConfig(targetPkg)
                  if (fails >= 3 && effCfg.intruderSelfie) {
                      recordIntruderAttempt(ctx, targetPkg)
                  }
                  if (fails >= 10) {
                      appendSecurityLog(ctx, targetPkg, "LOCKOUT_TRIGGERED")
                      val penaltySec = 15 + (fails - 10) * 5
                      val untilMs = System.currentTimeMillis() + (penaltySec * 1000L)
                      prefs.edit().putLong(KEY_LOCKOUT_UNTIL_MS, untilMs).commit()
                      return fails to penaltySec
                  }
                  return fails to 0
              }
              fun appendSecurityLog(ctx: Context, targetPkg: String, method: String) {
                  val pkg = if (targetPkg.isBlank()) ctx.packageName else targetPkg
                  val label = runCatching {
                      if (pkg == ctx.packageName) "NowLock"
                      else {
                          val ai = ctx.packageManager.getApplicationInfo(pkg, 0)
                          ctx.packageManager.getApplicationLabel(ai).toString()
                      }
                  }.getOrDefault(pkg)
                  val ts = SimpleDateFormat("yyyy/MM/dd HH:mm:ss", Locale.US).format(Date())
                  val entryLine = "$ts|||$pkg|||$label|||$method"
                  val currentRaw = prefs.getString(KEY_SEC_LOGS, "") ?: ""
                  val lines = currentRaw.lines().filter { it.contains("|||") }.toMutableList()
                  lines.add(0, entryLine)
                  val trimmed = lines.take(40).joinToString("\n")
                  prefs.edit().putString(KEY_SEC_LOGS, trimmed).commit()
              }
              fun getSecurityLogs(): List<SecurityLogEntry> {
                  val raw = prefs.getString(KEY_SEC_LOGS, "") ?: ""
                  if (raw.isBlank()) return emptyList()
                  return raw.lines().mapNotNull { line ->
                      val parts = line.split("|||")
                      if (parts.size >= 4) {
                          SecurityLogEntry(
                              timestamp = parts[0],
                              targetPkg = parts[1],
                              targetAppLabel = parts[2],
                              method = parts[3]
                          )
                      } else null
                  }
              }
              fun clearSecurityLogs() {
                  prefs.edit().putString(KEY_SEC_LOGS, "").commit()
              }
              fun isLockOnScreenOffEnabled(): Boolean = prefs.getBoolean(KEY_LOCK_ON_SCREEN_OFF, true)
              fun setLockOnScreenOffEnabled(enabled: Boolean) {
                  prefs.edit().putBoolean(KEY_LOCK_ON_SCREEN_OFF, enabled).commit()
              }
              fun isDecoyEnabled(): Boolean = prefs.getBoolean(KEY_DECOY_ENABLED, false)
              fun setDecoyEnabled(enabled: Boolean) {
                  prefs.edit().putBoolean(KEY_DECOY_ENABLED, enabled).commit()
              }
              fun isDecoyPinSet(): Boolean = prefs.getString(KEY_DECOY_PIN_HASH, null) != null
              fun isDecoyPatternSet(): Boolean = prefs.getString(KEY_DECOY_PATTERN_HASH, null) != null
              fun setDecoyPin(pin: String) {
                  prefs.edit().putString(KEY_DECOY_PIN_HASH, sha256("decoy_pin_" + pin)).putBoolean(KEY_DECOY_ENABLED, true).commit()
              }
              fun verifyDecoyPin(pin: String): Boolean {
                  if (!isDecoyEnabled()) return false
                  val saved = prefs.getString(KEY_DECOY_PIN_HASH, null) ?: return false
                  val candidate = sha256("decoy_pin_" + pin)
                  return MessageDigest.isEqual(candidate.toByteArray(Charsets.UTF_8), saved.toByteArray(Charsets.UTF_8))
              }
              fun setDecoyPattern(pat: String) {
                  prefs.edit().putString(KEY_DECOY_PATTERN_HASH, sha256("decoy_pat_" + pat)).putBoolean(KEY_DECOY_ENABLED, true).commit()
              }
              fun verifyDecoyPattern(pat: String): Boolean {
                  if (!isDecoyEnabled()) return false
                  val saved = prefs.getString(KEY_DECOY_PATTERN_HASH, null) ?: return false
                  val candidate = sha256("decoy_pat_" + pat)
                  return MessageDigest.isEqual(candidate.toByteArray(Charsets.UTF_8), saved.toByteArray(Charsets.UTF_8))
              }
              fun getPerAppConfig(pkg: String): PerAppLockConfig {
                  val raw = prefs.getString("per_app_cfg_$pkg", null) ?: return PerAppLockConfig(
                      useCustom = false,
                      comboMode = getComboMode(),
                      fpEnabled = isFingerprintEnabled(),
                      relockMinutes = getRelockDelayMinutes(),
                      lockOnScreenOff = isLockOnScreenOffEnabled(),
                      intruderSelfie = isIntruderSelfieEnabled(),
                      vibrateOnError = isVibrationEnabled(),
                      decoyCrashEnabled = isDecoyEnabled()
                  )
                  return runCatching {
                      val p = raw.split("|")
                      PerAppLockConfig(
                          useCustom = p[0].toBoolean(),
                          comboMode = LockComboMode.valueOf(p[1]),
                          fpEnabled = p[2].toBoolean(),
                          relockMinutes = p[3].toInt(),
                          lockOnScreenOff = p[4].toBoolean(),
                          intruderSelfie = p[5].toBoolean(),
                          vibrateOnError = p[6].toBoolean(),
                          decoyCrashEnabled = p.getOrNull(7)?.toBoolean() ?: isDecoyEnabled()
                      )
                  }.getOrDefault(PerAppLockConfig())
              }
              fun savePerAppConfig(pkg: String, cfg: PerAppLockConfig) {
                  val serialized = listOf(
                      cfg.useCustom,
                      cfg.comboMode.name,
                      cfg.fpEnabled,
                      cfg.relockMinutes,
                      cfg.lockOnScreenOff,
                      cfg.intruderSelfie,
                      cfg.vibrateOnError,
