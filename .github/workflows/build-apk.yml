                      val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as? ActivityManager
                      val cores = Runtime.getRuntime().availableProcessors()
                      isLowEndHardware = (am?.isLowRamDevice == true) || (cores <= 4)
                  }
                  runCatching {
                      val pm = ctx.packageManager
                      val homeIntent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                      pm.queryIntentActivities(homeIntent, PackageManager.MATCH_DEFAULT_ONLY).forEach { ri ->
                          ri.activityInfo?.packageName?.let { if (it.isNotEmpty()) dynamicHomePackages.add(it) }
