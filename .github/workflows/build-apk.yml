name: Build ZeroFlash One UI 9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Android Project & 4 HD Wallpapers (Zero-Dependency Python)
        run: |
          python3 - << 'PYEOF'
          import os, struct, zlib

          os.makedirs("app/src/main/res/drawable-nodpi", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/values-fa", exist_ok=True)
          os.makedirs("app/src/main/java/io/zenzy/zeroflash/applock", exist_ok=True)

          def make_atmospheric_png(path, top_rgb, mid_rgb, bot_rgb, glow_rgb, w=540, h=960):
              raw = bytearray()
              cx, cy = w // 2, int(h * 0.38)
              max_r = float(w * 0.55)
              for y in range(h):
                  raw.append(0)
                  t = y / float(h - 1)
                  if t < 0.55:
                      u = t / 0.55
                      br = int(top_rgb[0] * (1 - u) + mid_rgb[0] * u)
                      bg = int(top_rgb[1] * (1 - u) + mid_rgb[1] * u)
                      bb = int(top_rgb[2] * (1 - u) + mid_rgb[2] * u)
                  else:
                      u = (t - 0.55) / 0.45
                      br = int(mid_rgb[0] * (1 - u) + bot_rgb[0] * u)
                      bg = int(mid_rgb[1] * (1 - u) + bot_rgb[1] * u)
                      bb = int(mid_rgb[2] * (1 - u) + bot_rgb[2] * u)
                  dy2 = (y - cy) * (y - cy)
                  row_bytes = bytearray(w * 3)
                  idx = 0
                  for x in range(w):
                      dx = x - cx
                      dist = (dx * dx + dy2) ** 0.5
                      if dist < max_r:
                          g_factor = (1.0 - dist / max_r) * 0.28
                          r = min(255, int(br * (1 - g_factor) + glow_rgb[0] * g_factor))
                          g = min(255, int(bg * (1 - g_factor) + glow_rgb[1] * g_factor))
                          b = min(255, int(bb * (1 - g_factor) + glow_rgb[2] * g_factor))
                      else:
                          r, g, b = br, bg, bb
                      row_bytes[idx] = r
                      row_bytes[idx + 1] = g
                      row_bytes[idx + 2] = b
                      idx += 3
                  raw.extend(row_bytes)

              def png_chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)

              ihdr = struct.pack("!IIBBBBB", w, h, 8, 2, 0, 0, 0)
              png_data = b"\x89PNG\r\n\x1a\n" + png_chunk(b"IHDR", ihdr) + png_chunk(b"IDAT", zlib.compress(bytes(raw), 6)) + png_chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png_data)

          make_atmospheric_png("app/src/main/res/drawable-nodpi/bg_misty_forest.png", (42, 68, 60), (20, 40, 34), (7, 16, 13), (110, 231, 183))
          make_atmospheric_png("app/src/main/res/drawable-nodpi/bg_cozy_wood_cafe.png", (52, 32, 20), (38, 22, 14), (16, 9, 5), (251, 191, 36))
