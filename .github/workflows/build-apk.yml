// Direct Deep-Link Permission Helpers (Takes user directly to NowLock's specific toggle switch!)
fun openDirectAccessibilitySettings(context: Context) {
    AppRepo.markLeavingForSettings(context)
    val comp = ComponentName(context, NowLockAccessibilityService::class.java).flattenToString()
    val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply {
        val bundle = Bundle()
